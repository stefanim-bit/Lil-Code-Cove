<!--
==================================================================================
  WIX L&D  ·  PRACTICE SESSION  ·  INTERACTIVE SCENARIO TEMPLATE  (Rise Code Block)
  v2 — Wix-branded redesign. SAME interaction/scoring model as v1; look only.
==================================================================================

  HOW TO READ THIS FILE (for stakeholders / non-coders)
  -----------------------------------------------------
  Two parts, on purpose:
    1) THE SCENARIO  (<script id="scenario">) — the CONTENT. Reads like a table.
    2) THE ENGINE    (<script id="engine">)   — the machinery that plays ANY scenario.

  WHAT CHANGED IN v2 (design only — the model below is unchanged)
  --------------------------------------------------------------
    • Wix Madefor typography (Display for headings, Text for body) via Google Fonts.
    • Three phases in one self-contained embed: MEET THE USER → LIVE CHAT → COMPLETE.
    • The live chat mirrors the real Wix Communication Panel: gray customer bubbles
      (left), blue agent bubbles (right), a call timer, and a red "End" button.
      (No sentiment chip — deliberately omitted.)
    • Brand palette applied. The END scorecard keeps the locked correctness legend
      (green / amber / red · done / partial / missed) — unchanged.
    • Helper pop-ups use the native <dialog> element (MDN-recommended for modals).

  THE INTERACTION MODEL (unchanged from v1)
  -----------------------------------------
  Each scenario mirrors a real Expert <-> user interaction across eight graded
  behaviors (the rubric, 100 pts):
     open(5) · dynamics(10) · familiarize(10) · clarify(15)
     roadmap(10) · article(20) · recreate(10) · solve(20)

  Rules:
    • FEEDBACK IS SAVED FOR THE END. No grade, no correctness colors, no running
      score during play. Choosing an answer simply advances the call.
    • IN-CHARACTER REACTIONS ARE NOT FEEDBACK. A weak choice may draw a caller
      reaction in dialogue; that line is part of the sim, not a grade.
    • MOSTLY GATED, SOME FREEDOM — "gate:true" screens must be finished to advance.
    • RETRY ONLY IF THE USER PROMPTS — a choice marked "retry:true" re-opens the
      screen because the caller pushed back; the retry is capped by "capIfRetried".
    • SKIPS ARE RECOVERABLE — each stage keeps its own best score.
    • ROADMAP FLOATS — attach roadmap credit to any choice via credits:[...].

  FIELD GUIDE
  -----------
    user   : { name, image, bio } — shown on the MEET screen and in the call header.
    STAGE  : id, name, max, strength (shown at end if done), improvement (if missed).
    SCREEN : stage, gate, speaker (caller line), prompt, choices[].
    CHOICE : text, verdict, points, goTo, credits[], retry/capIfRetried,
             consequence, stageOverride.
==================================================================================
-->

<style>
  :root{
    /* ---- Brand palette (the exact hexes supplied) ---- */
    --ink:#242424; --ink-2:#424242; --muted:#707070;
    --line:#E0E0E0; --line-2:#D1D1D1; --bg:#F5F5F5; --paper:#ffffff;
    --brand:#DA3B01;                 /* Wix orange-red — the End button + accents   */
    --agent:#0F62E6; --agent-deep:#1464A0;  /* agent (you) blue                     */
    --positive:#5BBE7E;
    --agent-bubble:#EAF1FE; --agent-bubble-line:#CFE0FF;
    /* ---- LOCKED end-screen correctness legend (scorecard only) ---- */
    --correct:#38761d; --correct-bg:#D9EAD3;
    --partial:#bf9000;  --partial-bg:#FFF2CC;
    --incorrect:#cc0000;--incorrect-bg:#F4CCCC;
    /* ---- shape ---- */
    --r-lg:20px; --r-md:14px; --r-sm:10px;
    --shadow:0 10px 30px rgba(20,24,40,.10);
    --font-display:'Wix Madefor Display','Wix Madefor Text',system-ui,Arial,sans-serif;
    --font-text:'Wix Madefor Text',system-ui,Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font-text); color:var(--ink); line-height:1.5;
    background:
      radial-gradient(1100px 500px at 12% -10%, #EEF3FF 0%, rgba(238,243,255,0) 60%),
      radial-gradient(900px 500px at 105% 0%, #F3F0FA 0%, rgba(243,240,250,0) 55%),
      var(--bg);
    min-height:100vh;
  }
  .app{max-width:1060px;margin:0 auto;padding:24px 20px}
  h1,h2,h3{font-family:var(--font-display);letter-spacing:-.01em;margin:0}
  .display{font-weight:800;line-height:1.05}

  /* ============================ MEET THE USER ============================ */
  .meet{
    display:grid;grid-template-columns:0.85fr 1.15fr;gap:0;
    background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow);overflow:hidden;min-height:500px;
  }
  .meet .portrait{
    position:relative;
    background:linear-gradient(160deg,#EDF2FE 0%,#F1EEFA 55%,#F6F7FA 100%);
    display:flex;align-items:flex-end;justify-content:center;padding:0 12px;
  }
  .meet .portrait img{max-height:480px;max-width:100%;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(20,24,40,.16))}
  .meet .portrait .noimg{align-self:center;color:var(--muted);font-size:14px;text-align:center;padding:24px}
  .meet .body{padding:44px 44px 40px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-size:13px;font-weight:700;color:var(--agent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
  .meet .body h1{font-size:44px;margin-bottom:18px}
  .meet .body p{font-size:17px;color:var(--ink-2);margin:0 0 28px;max-width:44ch}

  /* black pill buttons — matches the Rise course (Get Started / Next / Restart) */
  .btn{font-family:var(--font-text);font-weight:700;font-size:15px;cursor:pointer;border:0;border-radius:999px;padding:13px 26px;transition:transform .12s ease, box-shadow .12s ease, background .12s ease}
  .btn:active{transform:translateY(1px)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-dark:hover{background:#000}
  .btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line-2)}
  .btn-ghost:hover{border-color:var(--ink)}

  /* ============================ THE CALL (Communication Panel) ============================ */
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
  .panel-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:#fff}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--agent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .who-name{font-weight:700;font-size:15px}
  .who-sub{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;margin-top:1px}
  .livedot{width:8px;height:8px;border-radius:50%;background:var(--positive);display:inline-block;box-shadow:0 0 0 3px rgba(91,190,126,.20)}
  .timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2)}
  .head-spacer{flex:1}
  .btn-end{background:var(--brand);color:#fff;font-weight:700;font-size:13px;border:0;border-radius:8px;padding:9px 18px;cursor:pointer}
  .btn-end:hover{filter:brightness(.94)}


  .chat{padding:16px 18px 6px;display:flex;flex-direction:column;gap:14px;min-height:150px;max-height:52vh;overflow-y:auto}
  .msg{display:flex;flex-direction:column;max-width:78%}
  .msg .meta{font-size:11px;color:var(--muted);margin:0 0 4px}
  .bubble{padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.45}
  .msg.caller{align-self:flex-start;align-items:flex-start}
  .msg.caller .bubble{background:var(--bg);border:1px solid var(--line);border-top-left-radius:5px;color:var(--ink)}
  .msg.you{align-self:flex-end;align-items:flex-end}
  .msg.you .meta{text-align:right;color:var(--agent-deep)}
  .msg.you .bubble{background:var(--agent-bubble);border:1px solid var(--agent-bubble-line);border-top-right-radius:5px;color:var(--ink)}
  .msg.system{align-self:center;max-width:90%;align-items:center}
  .msg.system .bubble{background:transparent;border:0;color:var(--muted);font-style:italic;font-size:13px;padding:2px 6px;text-align:center}

  /* composer / decision area — where the real panel's message box sits */
  .composer{border-top:1px solid var(--line);background:#FBFBFC;padding:14px 18px 18px}
  .helperbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .hbtn{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);cursor:pointer}
  .hbtn:hover{border-color:var(--agent);color:var(--agent)}
  .prompt{font-weight:700;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:2px 0 10px}
  .choice{display:block;width:100%;text-align:left;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-sm);padding:13px 15px;margin:8px 0;font-size:14.5px;font-family:var(--font-text);color:var(--ink);cursor:pointer;transition:border-color .12s ease, box-shadow .12s ease, background .12s ease}
  .choice:hover:not(:disabled){border-color:var(--agent);box-shadow:0 2px 10px rgba(15,98,230,.10);background:#fff}
  .choice:disabled{opacity:.45;cursor:not-allowed}
  .next{margin-top:12px}

  /* typing awareness indicator (TAI) — the user "typing…" bubble before a reply */
  .msg.typing .bubble{display:inline-flex;align-items:center;gap:5px;padding:13px 15px}
  .tai-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4;animation:tai-blink 1.2s infinite ease-in-out}
  .tai-dot:nth-child(2){animation-delay:.2s}
  .tai-dot:nth-child(3){animation-delay:.4s}
  @keyframes tai-blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-2px)}}

  /* learner name field on the Meet screen */
  .namefield{display:flex;flex-direction:column;gap:8px;margin:0 0 24px;max-width:340px}
  .namefield label{font-size:13px;font-weight:700;color:var(--ink-2)}
  .nameinput{font-family:var(--font-text);font-size:15px;padding:12px 14px;border:1px solid var(--line-2);border-radius:var(--r-sm);color:var(--ink);background:#fff}
  .nameinput:focus{outline:none;border-color:var(--agent);box-shadow:0 0 0 3px rgba(15,98,230,.12)}
  .nameinput.invalid{border-color:#D64545}
  .nameerror{font-size:12.5px;color:#D64545}

  /* ============================ COMPLETE ============================ */
  .complete-hero{display:grid;grid-template-columns:0.7fr 1.3fr;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
  .complete-hero .portrait{background:linear-gradient(160deg,#EDF2FE 0%,#F1EEFA 55%,#F6F7FA 100%);display:flex;align-items:flex-end;justify-content:center}
  .complete-hero .portrait img{max-height:340px;max-width:100%;object-fit:contain;filter:drop-shadow(0 16px 22px rgba(20,24,40,.16))}
  .complete-hero .body{padding:40px 44px;display:flex;flex-direction:column;justify-content:center}
  .complete-hero h1{font-size:48px;margin-bottom:12px}
  .complete-hero .lead{font-size:16px;color:var(--ink-2);margin:0 0 22px;max-width:46ch}
  .scorenum{font-family:var(--font-display);font-weight:800;font-size:56px;line-height:1}
  .scorenum small{font-size:22px;color:var(--muted);font-weight:700}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;margin-top:16px;box-shadow:0 4px 16px rgba(20,24,40,.05)}
  .card h3{font-size:15px;margin:0 0 8px}
  .srow{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:9px 0;border-bottom:1px solid #F1F1F1}
  .srow:last-child{border-bottom:0}
  .sdot{width:9px;height:9px;border-radius:50%;margin-right:9px;display:inline-block}
  .sdot.done{background:var(--correct)} .sdot.partial{background:var(--partial)} .sdot.miss{background:var(--incorrect)}
  .sval{font-variant-numeric:tabular-nums;font-weight:600}
  .list{margin:8px 0 0;padding-left:0;list-style:none}
  .list li{padding:9px 0 9px 26px;position:relative;font-size:14px;border-bottom:1px solid #F4F4F4}
  .list li:last-child{border-bottom:0}
  .list.str li:before{content:"✓";position:absolute;left:2px;color:var(--correct);font-weight:800}
  .list.imp li:before{content:"→";position:absolute;left:2px;color:var(--partial);font-weight:800}
  .pick{font-size:12.5px;color:var(--muted);margin-top:5px;font-style:italic}
  .pick.miss{color:#9aa0a6}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .tbeat{padding:10px 0;border-bottom:1px solid #F1F1F1}
  .tbeat:last-child{border-bottom:0}
  .tspk{background:var(--bg);border:1px solid var(--line);padding:8px 11px;border-radius:8px;font-size:13px;margin:3px 0}
  .tyou{padding:7px 11px;font-size:13px;color:var(--agent-deep);font-weight:600}

  /* ============================ helper <dialog> ============================ */
  dialog.modal{border:0;border-radius:var(--r-md);max-width:560px;width:calc(100% - 32px);padding:0;box-shadow:0 24px 60px rgba(20,24,40,.28)}
  dialog.modal::backdrop{background:rgba(20,24,40,.45)}
  .modal-inner{padding:20px 22px 22px}
  .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .mhead h3{font-size:17px}
  .mx{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}
  .mx:hover{color:var(--ink)}
  .mopt{display:block;width:100%;text-align:left;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-sm);padding:11px 13px;margin:0 0 8px;font-size:14px;font-family:var(--font-text);color:var(--ink);cursor:pointer}
  .mopt:hover{border-color:var(--agent)}
  .tabrow{display:flex;gap:6px;margin-bottom:10px}
  .tab{font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--line-2);background:#fff;font-family:var(--font-text);cursor:pointer}
  .tab.active{border-color:var(--agent);color:var(--agent);font-weight:700}
  .article-body{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:var(--r-sm);padding:13px;min-height:90px;line-height:1.5}
  .mnote{font-size:12.5px;color:var(--muted);margin-top:8px}
  .speakerbox{background:var(--bg);border:1px solid var(--line);padding:11px 13px;border-radius:var(--r-sm);font-size:14px}

  /* MDN: honour users who prefer less motion */
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; scroll-behavior:auto !important}
  }
  @media (max-width:720px){
    .meet,.complete-hero{grid-template-columns:1fr}
    .meet .portrait,.complete-hero .portrait{min-height:260px}
    .meet .body{padding:28px 24px 32px}
    .meet .body h1{font-size:34px}
    .complete-hero .body{padding:28px 24px}
    .msg{max-width:88%}
  }
</style>

<!-- ============================ THE SCENARIO (edit this) ============================ -->
<script id="scenario">
/* ===================================================================
   THIS FILE IS A BLANK TEMPLATE — fill in every <<PLACEHOLDER>> below.

   For a fully worked, filled-in example of this exact shape (a Wix
   Customer Care call about menu sub-pages), see the sibling file:
     practice_scenario_template_v2_RISE.html
   Copy patterns from it — the `stages`/`screens`/`resources` shapes
   below are identical, just with placeholder values instead of real
   scenario content.
   =================================================================== */
window.SCENARIO = {
  title: "<<SCENARIO_TITLE>>",  // e.g. "Practice Call — <<Topic>>"

  // Who's calling.
  user: {
    name: "<<USER_NAME>>",  // e.g. "Sam"
    // Leave image null to show an initials avatar instead of a portrait.
    // To add a portrait: either a relative path (local preview only) or a
    // base64 data URI (works inside the Rise build). See the reference
    // file above for a worked base64 example.
    image: null,
    bio: "<<USER_BIO>>"  // 1-2 sentences: who they are + why they're contacting support
  },

  // ===================================================================
  //  CHECK RESOURCES — the single on-screen helper button. Opens a modal
  //  of dynamic links. If the learner never opens the item marked
  //  `correct:true` at/after 30 seconds into the call, the `stage` score
  //  named below is capped at `capIfUnchecked` (see RESOURCE_CREDIT_MIN_SECONDS
  //  in the engine code for the 30s rule).
  // ===================================================================
  resources: {
    title: "Check Resources",
    stage: "<<STAGE_ID_THIS_CAPS>>",   // must match one of the `stages[].id` below
    capIfUnchecked: <<CAP_POINTS>>,     // e.g. 10
    note: "<<RESOURCES_MODAL_NOTE>>",   // e.g. "Open the resource that explains the fix."
    items: [
      { label:"<<RESOURCE_1_LABEL>>", url:"<<RESOURCE_1_URL>>", correct:true },
      { label:"<<RESOURCE_2_LABEL>>", url:"<<RESOURCE_2_URL>>" }
      // add more { label, url } items as needed; exactly one should have correct:true
    ]
  },

  // ===================================================================
  //  STAGES — the scorecard categories. Each screen's `stage` (and any
  //  `credits`) must reference one of these ids. `max` is the ceiling for
  //  that stage; the final score is the sum of all stage points earned.
  // ===================================================================
  stages: [
    { id:"<<STAGE_1_ID>>", name:"<<STAGE_1_NAME>>", max:<<STAGE_1_MAX>>,
      strength:"<<STAGE_1_STRENGTH_TEXT>>",
      improvement:"<<STAGE_1_IMPROVEMENT_TEXT>>" },
    { id:"<<STAGE_2_ID>>", name:"<<STAGE_2_NAME>>", max:<<STAGE_2_MAX>>,
      strength:"<<STAGE_2_STRENGTH_TEXT>>",
      improvement:"<<STAGE_2_IMPROVEMENT_TEXT>>" }
    // add one object per scoring stage (Opening, Clarify, Solve, etc.)
  ],

  // ===================================================================
  //  SCREENS — the conversation graph. `start` names the first screen id.
  //  Each screen:
  //    stage      — which stages[].id this screen's choices score against
  //    speaker    — (optional) the caller's line shown before the prompt
  //    prompt     — the instruction shown above the choice buttons
  //    choices    — array of options the learner can pick
  //
  //  Each choice:
  //    id          — unique within the screen (used by `retry`)
  //    text        — button label; use [name] anywhere to insert the
  //                  learner's own name (captured on the Meet screen)
  //    verdict     — "correct" | "partial" | "incorrect"
  //    points      — points awarded toward `stage` (or `stageOverride`)
  //    goTo        — id of the next screen, or "__end__" to finish
  //    consequence — (optional) the caller's reply, shown after a 5s
  //                  typing-indicator delay; omit if there's no reply
  //    credits     — (optional) extra stage credit, e.g.
  //                  [{stage:"<<OTHER_STAGE_ID>>", points:<<N>>, verdict:"partial"}]
  //    retry       — (optional) true if picking this should let the learner
  //                  try the screen again instead of advancing
  //    capIfRetried — (optional) point cap applied if they retry then succeed
  // ===================================================================
  start: "<<FIRST_SCREEN_ID>>",
  screens: {

    "<<FIRST_SCREEN_ID>>": {
      stage: "<<STAGE_1_ID>>",
      speaker: "<<OPENING_LINE_FROM_CALLER>>",
      prompt: "How do you respond?",
      choices: [
        { id:"A", text:"<<CHOICE_A_TEXT>>",
          verdict:"incorrect", points:0, goTo:"<<NEXT_SCREEN_ID>>",
          consequence:"<<CALLER_REPLY_TO_CHOICE_A>>" },
        { id:"B", text:"<<CHOICE_B_TEXT>>",
          verdict:"correct", points:<<CHOICE_B_POINTS>>, goTo:"<<NEXT_SCREEN_ID>>" }
      ]
    },

    "<<NEXT_SCREEN_ID>>": {
      stage: "<<STAGE_2_ID>>",
      speaker: "<<CALLER_LINE>>",
      prompt: "<<PROMPT_TEXT>>",
      choices: [
        { id:"A", text:"<<CHOICE_TEXT>>",
          verdict:"correct", points:<<POINTS>>, goTo:"__end__" }
      ]
    }

    // add every additional screen the same way; the last screen(s) should
    // set goTo:"__end__" to route into the results/scorecard screen
  }
};
</script>

<!-- ============================ THE ENGINE (do not edit) =========================== -->
<script id="engine">
(function(){
  const S = window.SCENARIO;
  const app = document.getElementById('app');
  const U = S.user || { name:(S.userBio? "the user":"User"), image:null, bio:S.userBio||"" };

  const earned = {};        // stageId -> best points (skips are recoverable)
  const status = {};        // stageId -> 'todo' | 'partial' | 'done'
  const decisivePick = {};  // stageId -> the response that set that stage's score
  const transcript = [];    // ordered record of the whole conversation
  S.stages.forEach(st => { earned[st.id]=0; status[st.id]='todo'; });
  const maxTotal = S.stages.reduce((a,st)=>a+st.max,0);
  const visitedScreens = new Set();
  const help = { used:false, checkedCorrectArticle:false };

  /* ---- learner name ----------------------------------------------------
     Captured on the Meet screen. Used to (a) label the learner's own chat
     bubbles, (b) substitute the [name] token anywhere in scenario text, and
     (c) push the value out to a Rise/Storyline "learner_name" variable. */
  let learner_name = "";
  function px(s){ return String(s==null?'':s).replace(/\[name\]/gi, learner_name || "you"); }
  function setLearnerName(v){
    learner_name = (v||"").trim();
    pushRiseVar("learner_name", learner_name);
  }
  // Best-effort write to the host course's variable. Storyline exposes
  // GetPlayer(); Rise/other hosts can listen for the postMessage below.
  function pushRiseVar(name, value){
    try {
      const p = (window.parent && window.parent.GetPlayer && window.parent.GetPlayer())
             || (window.top && window.top.GetPlayer && window.top.GetPlayer());
      if(p && p.SetVar) p.SetVar(name, value);
    } catch(e){}
    try { window.parent && window.parent.postMessage({ type:'setVar', name:name, value:value }, '*'); } catch(e){}
  }

  // Stamp each screen with its own id so retry can re-open it.
  Object.keys(S.screens).forEach(k => { S.screens[k].id = k; });

  // Telemetry seam — no-op in this stakeholder template; wired to the Sheet in prod.
  function logEvent(evt){ /* no-op in template */ }

  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ---- call timer (authentic Communication-Panel touch) ---- */
  let callSeconds = 0, timerHandle = null;
  function mmss(t){ const m=Math.floor(t/60), s=t%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
  function startTimer(){ const el=()=>document.getElementById('timer');
    timerHandle = setInterval(()=>{ callSeconds++; const e=el(); if(e) e.textContent=mmss(callSeconds); }, 1000); }
  function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

  let chatEl, composerEl;

  /* =================== PHASE 1 — MEET THE USER =================== */
  function renderMeet(){
    stopTimer();
    const portrait = U.image
      ? `<img src="${escapeHtml(U.image)}" alt="Portrait of ${escapeHtml(U.name)}"
             onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=\\'noimg\\'>[ ${escapeHtml(U.name)} ]<br><span style=&quot;font-size:12px&quot;>character image not found</span></div>')">`
      : `<div class="noimg">[ ${escapeHtml(U.name)} ]</div>`;
    app.innerHTML = `
      <section class="meet">
        <div class="portrait">${portrait}</div>
        <div class="body">
          <div class="eyebrow">Practice Session · User Scenario</div>
          <h1 class="display">Meet ${escapeHtml(U.name)}</h1>
          <p>${escapeHtml(U.bio)}</p>
          <div class="namefield">
            <label for="learnerName">Your name</label>
            <input class="nameinput" id="learnerName" type="text" autocomplete="name"
                   placeholder="Enter your name" value="${escapeHtml(learner_name)}">
            <div class="nameerror" id="nameError" hidden>Please enter your name to continue.</div>
          </div>
          <div><button class="btn btn-dark" id="startBtn">Start the chat →</button></div>
        </div>
      </section>`;
    const nameInput = document.getElementById('learnerName');
    const nameError = document.getElementById('nameError');
    nameInput.addEventListener('input', e => {
      setLearnerName(e.target.value);
      if(learner_name) { nameError.hidden = true; nameInput.classList.remove('invalid'); }
    });
    document.getElementById('startBtn').onclick = () => {
      setLearnerName(nameInput.value);
      if(!learner_name){
        nameError.hidden = false;
        nameInput.classList.add('invalid');
        nameInput.focus();
        return;
      }
      startCall();
    };
  }

  /* =================== PHASE 2 — THE LIVE CALL =================== */
  function startCall(){
    const initial = (U.name||'?').trim().charAt(0).toUpperCase();
    app.innerHTML = `
      <section class="panel">
        <div class="panel-head">
          <div class="avatar">${escapeHtml(initial)}</div>
          <div>
            <div class="who-name">${escapeHtml(U.name)}</div>
            <div class="who-sub"><span class="livedot"></span> Live chat · <span class="timer" id="timer">00:00</span></div>
          </div>
          <div class="head-spacer"></div>
          <button class="btn-end" id="endBtn">End</button>
        </div>
        <div class="chat" id="chat" aria-live="polite"></div>
        <div class="composer">
          <div class="helperbar" id="helperbar"></div>
          <div id="composer"></div>
        </div>
      </section>`;
    chatEl = document.getElementById('chat');
    composerEl = document.getElementById('composer');
    document.getElementById('endBtn').onclick = confirmEnd;
    renderHelpers();
    startTimer();
    renderScreen(S.start, [], undefined);
  }

  function confirmEnd(){
    // Ending early is allowed — skips are recoverable, unreached stages simply score 0.
    const dlg = document.createElement('dialog'); dlg.className='modal';
    dlg.innerHTML = `<div class="modal-inner">
        <div class="mhead"><h3>End the chat?</h3></div>
        <p style="font-size:14px;color:var(--ink-2);margin:0 0 16px">You'll go straight to your results. Anything you haven't done yet won't score.</p>
        <div class="actions" style="margin:0">
          <button class="btn btn-dark" id="endYes">End &amp; see results</button>
          <button class="btn btn-ghost" id="endNo">Keep going</button>
        </div></div>`;
    document.body.appendChild(dlg); dlg.showModal();
    dlg.querySelector('#endNo').onclick = ()=>{ dlg.close(); dlg.remove(); };
    dlg.querySelector('#endYes').onclick = ()=>{ dlg.close(); dlg.remove(); renderFinal(); };
  }

  function appendBubble(kind, text){
    const who = kind==='you' ? (learner_name || 'You') : (kind==='caller' ? U.name : '');
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + kind;
    wrap.innerHTML = (kind==='system'?'':`<div class="meta">${escapeHtml(who)} · ${mmss(callSeconds)}</div>`) +
                     `<div class="bubble">${escapeHtml(px(text))}</div>`;
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap;
  }

  /* Show the caller's typing awareness indicator (TAI) for TAI_MS after every
     learner choice, then reveal `text` as their reply (or, if the choice has
     no scripted reply, just clear the indicator and continue). */
  const TAI_MS = 5000;
  function typeThenReply(text, done){
    const kind = text ? callerKind(text) : 'caller';
    const wrap = document.createElement('div');
    wrap.className = 'msg typing ' + kind;
    wrap.innerHTML = `<div class="meta">${escapeHtml(U.name)} · typing…</div>` +
      `<div class="bubble"><span class="tai-dot"></span><span class="tai-dot"></span><span class="tai-dot"></span></div>`;
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    setTimeout(()=>{
      wrap.remove();
      if(text) appendBubble(kind, text);
      if(done) done();
    }, TAI_MS);
  }
  function setComposer(html){ composerEl.innerHTML = html; }
  function callerKind(line){ return /^\s*\(/.test(line) ? 'system' : 'caller'; }

  /* ---- Helper buttons (native <dialog>) ---- */
  function openModal(title, node){
    const dlg = document.createElement('dialog'); dlg.className='modal'; dlg.id='modal';
    const inner = document.createElement('div'); inner.className='modal-inner';
    const head = document.createElement('div'); head.className='mhead';
    head.innerHTML = `<h3>${escapeHtml(title)}</h3>`;
    const x = document.createElement('button'); x.className='mx'; x.innerHTML='&times;'; x.setAttribute('aria-label','Close');
    x.onclick = closeModal; head.appendChild(x);
    inner.appendChild(head); inner.appendChild(node); dlg.appendChild(inner);
    document.body.appendChild(dlg); dlg.showModal();
    dlg.addEventListener('click', e=>{ if(e.target===dlg) closeModal(); });  // backdrop click
  }
  function closeModal(){ const m=document.getElementById('modal'); if(m){ try{m.close();}catch(e){} m.remove(); } }

  function renderHelpers(){
    const bar = document.getElementById('helperbar');
    if(!S.resources){ bar.style.display='none'; return; }
    bar.innerHTML='';
    const b=document.createElement('button');
    b.className='hbtn';
    b.textContent = S.resources.title || 'Check Resources';
    b.onclick = openResources;
    bar.appendChild(b);
  }
  /* Opens the scenario's dynamic links in a modal. Opening the resource
     marked correct:true is what lifts the article-stage cap in renderFinal —
     but only if it happens at/after RESOURCE_CREDIT_MIN_SECONDS into the call.
     Opening it earlier doesn't count; the learner can still open it again
     later (any time before ending the chat) to earn credit. */
  const RESOURCE_CREDIT_MIN_SECONDS = 30;
  function openResources(){
    const r=S.resources, wrap=document.createElement('div');
    logEvent({type:'helper', helper:'resources', action:'open'});
    if(r.note) wrap.innerHTML='<div class="mnote" style="margin:0 0 10px">'+escapeHtml(r.note)+'</div>';
    (r.items||[]).forEach(it=>{
      const a=document.createElement('a');
      a.className='mopt'; a.href=it.url||'#'; a.target='_blank'; a.rel='noopener noreferrer';
      a.textContent=it.label + '  ↗';
      a.onclick=()=>{
        if(it.correct){
          if(callSeconds >= RESOURCE_CREDIT_MIN_SECONDS){
            help.checkedCorrectArticle=true;
            logEvent({type:'helper', helper:'resources', action:'viewed-correct'});
          } else {
            logEvent({type:'helper', helper:'resources', action:'viewed-correct-too-early', atSecond:callSeconds});
          }
        } else logEvent({type:'helper', helper:'resources', action:'viewed-other'});
      };
      wrap.appendChild(a);
    });
    openModal(r.title||'Check Resources', wrap);
  }

  /* Progress bar removed — kept as a no-op so existing call sites are harmless. */
  function paintProgress(){}

  function applyCredit(stg, pts, verdict, pickText){
    if(!(stg in earned)) return;
    if(!(stg in decisivePick) || pts > earned[stg]) decisivePick[stg] = {text:pickText, verdict:verdict, points:pts};
    if(pts > earned[stg]) earned[stg] = pts;
    if(verdict==='correct') status[stg]='done';
    else if(verdict==='partial' && status[stg]!=='done') status[stg]='partial';
  }
  function recordChoice(screen, ch, cappedPoints){
    const primary = ch.stageOverride || screen.stage;
    applyCredit(primary, cappedPoints, ch.verdict, ch.text);
    (ch.credits||[]).forEach(c => applyCredit(c.stage, c.points, c.verdict||'correct', ch.text));
  }

  function renderScreen(id, retriedIds, cap, skipSpeaker){
    retriedIds = retriedIds || [];
    if(id==='__end__') return renderFinal();
    const scr = S.screens[id];
    visitedScreens.add(scr.id);
    paintProgress();
    if(scr.speaker && !skipSpeaker) appendBubble(callerKind(scr.speaker), scr.speaker);
    setComposer(`<div class="prompt">${escapeHtml(px(scr.prompt))}</div><div id="choices"></div>`);
    const cWrap = document.getElementById('choices');
    scr.choices.forEach(ch=>{
      const b=document.createElement('button');
      b.className='choice'; b.textContent=px(ch.text);
      if(retriedIds.includes(ch.id)) b.disabled=true;
      b.onclick=()=>choose(scr,ch,retriedIds,cap);
      cWrap.appendChild(b);
    });
  }

  function choose(scr, ch, retriedIds, cap){
    [...composerEl.querySelectorAll('.choice')].forEach(x=>x.disabled=true);
    appendBubble('you', ch.text);

    if(ch.retry && !retriedIds.includes(ch.id)){
      transcript.push({ speaker:scr.speaker, picked:ch.text, consequence:ch.consequence });
      logEvent({ type:'choice', stage:scr.stage, screen:scr.id, text:ch.text, verdict:ch.verdict, points:0, retry:true });
      // Always wait through the 5s typing indicator, whether or not there's a reply to reveal.
      setComposer('');
      typeThenReply(ch.consequence, ()=>{
        setComposer(`<button class="btn btn-dark next" id="next">Try again →</button>`);
        document.getElementById('next').onclick =
          ()=>renderScreen(scr.id, retriedIds.concat(ch.id), ch.capIfRetried, true);
      });
      return;
    }
    let pts = ch.points;
    if(typeof cap === 'number') pts = Math.min(pts, cap);
    recordChoice(scr, ch, pts);
    logEvent({ type:'choice', stage:scr.stage, screen:scr.id, text:ch.text, verdict:ch.verdict, points:pts });
    transcript.push({ speaker:(typeof cap==='number'?null:scr.speaker), picked:ch.text, consequence:ch.consequence });

    // Always wait through the 5s typing indicator before advancing, whether or
    // not this choice has a scripted reply.
    setComposer('');
    typeThenReply(ch.consequence, ()=>{
      setComposer(`<button class="btn btn-dark next" id="next">Continue →</button>`);
      document.getElementById('next').onclick = ()=>renderScreen(ch.goTo, [], undefined, false);
    });
  }

  /* =================== PHASE 3 — COMPLETE =================== */
  function renderFinal(){
    stopTimer();

    // Apply the Check-Resources penalty before tallying (same rule the old
    // "Check the Articles" used: no verify of the correct resource → capped).
    const helpNotes = [];
    const res = S.resources;
    if(res && !help.checkedCorrectArticle && (res.stage in earned) && earned[res.stage] > res.capIfUnchecked){
      earned[res.stage] = res.capIfUnchecked;
      helpNotes.push("You reached the right answer, but didn't verify it in the source resource — checking the resource is the skill, not remembering.");
    }
    S.stages.forEach(st=>{ if(earned[st.id] >= st.max) status[st.id]='done'; else if(earned[st.id] > 0 && status[st.id]==='done') status[st.id]='partial'; });

    const sum = Object.values(earned).reduce((a,b)=>a+b,0);

    const rows = S.stages.map(st=>{
      const cls = status[st.id]==='done'?'done':status[st.id]==='partial'?'partial':'miss';
      return `<div class="srow"><span><span class="sdot ${cls}"></span>${st.name}</span>
              <span class="sval">${earned[st.id]} / ${st.max}</span></div>`;
    }).join('');

    const pickLine = st => {
      const p = decisivePick[st.id];
      return p ? `<div class="pick">Your response: “${escapeHtml(p.text)}”</div>`
               : `<div class="pick miss">You didn't reach this step.</div>`;
    };
    const strengths = S.stages.filter(st=>status[st.id]==='done' && st.strength)
        .map(st=>`<li><b>${st.name}</b> — ${st.strength}${pickLine(st)}</li>`).join('');
    const areas = S.stages.filter(st=>status[st.id]!=='done' && st.improvement)
        .map(st=>`<li><b>${st.name}</b> — ${st.improvement}${pickLine(st)}</li>`).join('');

    const portrait = U.image
      ? `<img src="${escapeHtml(U.image)}" alt="" onerror="this.style.display='none'">` : '';

    app.innerHTML = `
      <section class="complete-hero">
        <div class="portrait">${portrait}</div>
        <div class="body">
          <div class="eyebrow">Chat complete</div>
          <h1 class="display">Complete!</h1>
          <p class="lead">Here's how the chat went, stage by stage — with the exact response that set each score.</p>
          <div class="scorenum">${sum}<small> / ${maxTotal}</small></div>
        </div>
      </section>

      <div class="card">
        <h3>Scorecard</h3>${rows}
      </div>

      <div class="card">
        <h3 style="color:var(--correct)">Top strengths</h3>
        <ul class="list str">${strengths || '<li>No stage was completed to full marks this time.</li>'}</ul>
      </div>

      <div class="card">
        <h3 style="color:var(--partial)">Areas for improvement</h3>
        <ul class="list imp">${areas || '<li>Nothing flagged — a clean run.</li>'}</ul>
      </div>

      ${helpNotes.length ? `<div class="card"><h3>Notes</h3><ul class="list imp">${helpNotes.map(n=>`<li>${n}</li>`).join('')}</ul></div>` : ''}

      <div class="actions">
        <button class="btn btn-ghost" id="txBtn">View conversation transcript</button>
        <button class="btn btn-dark" onclick="location.reload()">Restart</button>
      </div>
      <div id="tx" class="card" style="display:none"></div>`;

    document.getElementById('txBtn').onclick = () => {
      const tx = document.getElementById('tx'), btn = document.getElementById('txBtn');
      if(tx.style.display==='none'){
        tx.innerHTML = `<h3 style="margin-bottom:6px">Conversation transcript</h3>` +
          transcript.map(t=>
            `<div class="tbeat">${t.speaker?`<div class="tspk">${escapeHtml(t.speaker)}</div>`:''}
             <div class="tyou">You: ${escapeHtml(t.picked)}</div>
             ${t.consequence?`<div class="tspk">${escapeHtml(t.consequence)}</div>`:''}</div>`).join('');
        tx.style.display='block'; btn.textContent='Hide conversation transcript';
      } else { tx.style.display='none'; btn.textContent='View conversation transcript'; }
    };
  }

  /* ---- boot ---- */
  renderMeet();
})();
</script>
</body>
</html>
