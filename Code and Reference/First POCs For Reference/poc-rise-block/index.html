<div id="scene12" style="font-family: -apple-system, Segoe UI, Arial, sans-serif; font-size: 15px; color: #222; max-width: 640px;">
  <p style="font-weight: bold; margin-bottom: 4px;">Sam Trent:</p>
  <p style="margin-top: 0;">"Hi — I'm trying to add sub-pages to my menu and it's just not working. I've been at this for an hour."</p>

  <div id="choices" style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
    <button class="choiceBtn" data-response="That sounds frustrating. Let me take a look."
      style="padding: 10px 14px; text-align: left; border-radius: 6px; border: 1px solid #999; background: #fff; cursor: pointer; font-size: 14px;">
      "That sounds frustrating. Let me take a look."
    </button>
    <button class="choiceBtn" data-response="Hi, what's your account email?"
      style="padding: 10px 14px; text-align: left; border-radius: 6px; border: 1px solid #999; background: #fff; cursor: pointer; font-size: 14px;">
      "Hi, what's your account email?"
    </button>
    <button class="choiceBtn" data-response="Hi, you're through to Wix Support, this is [name]. Sorry you've been stuck — let's get it sorted. Can I start with the email on your account?"
      style="padding: 10px 14px; text-align: left; border-radius: 6px; border: 1px solid #999; background: #fff; cursor: pointer; font-size: 14px;">
      "Hi, you're through to Wix Support, this is [name]. Sorry you've been stuck — let's get it sorted. Can I start with the email on your account?"
    </button>
    <button class="choiceBtn" data-response="Sure — go into menu settings and switch it to Advanced."
      style="padding: 10px 14px; text-align: left; border-radius: 6px; border: 1px solid #999; background: #fff; cursor: pointer; font-size: 14px;">
      "Sure — go into menu settings and switch it to Advanced."
    </button>
  </div>

  <div id="log" style="margin-top: 14px; background: #111; color: #b6ffb6; font-family: Menlo, Consolas, monospace; font-size: 12px; padding: 10px; border-radius: 6px; height: 140px; overflow-y: auto; white-space: pre-wrap;">(log output)</div>
</div>

<script>
/*
 * Rise Code/Embed block version of the same telemetry POC built for the
 * Storyline Web Object. No Storyline-style trigger-compiler exists here at
 * all, so unlike Storyline this doesn't need the Adjust-Variable-then-
 * Timeline-Starts workaround — a plain click handler runs fetch() directly.
 * Unknown here instead: whether this block's iframe sandbox permits
 * window.parent access for the SCORM lookup. findAPI() below is defensive
 * (try/catch per frame level) so a stricter sandbox degrades to NO-API
 * instead of throwing and breaking the whole script.
 */

var ENDPOINT = 'https://docs.google.com/forms/d/e/1FAIpQLSegiZwFV7DN-wwWsqnBbrqzJ5yEK-3lk8Zl182M0fMNFYH5hg/formResponse';

var FIELD_IDS = {
  learner_email:    'entry.1276253364',
  learner_name:      'entry.2005409239',
  attempt_id:        'entry.1673953677',
  course:            'entry.2010105379',
  scene:             'entry.1283761747',
  interaction:       'entry.1781563601',
  question:          'entry.786197073',
  response:          'entry.2057562952',
  correct:           'entry.1897805741',
  points:            'entry.1780599104',
  time_on_step_sec:  'entry.1327709145',
  notes:             'entry.1963386753'
};

var logEl = document.getElementById('log');
function log(msg) {
  var t = new Date().toLocaleTimeString();
  logEl.textContent += '[' + t + '] ' + msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

function findAPI(win, depthLimit) {
  var depth = 0;
  while (win && depth < depthLimit) {
    try {
      if (win.API_1484_11) return { api: win.API_1484_11, version: '2004' };
      if (win.API) return { api: win.API, version: '1.2' };
    } catch (e) {
      log('Frame access blocked at depth ' + depth + ' (' + e.message + ') — sandbox likely lacks allow-same-origin.');
      return null;
    }
    try {
      if (win.parent && win.parent !== win) {
        win = win.parent;
      } else if (win.opener) {
        win = win.opener;
      } else {
        break;
      }
    } catch (e) {
      return null;
    }
    depth++;
  }
  return null;
}

function lmsGetValue(found, key2004, key12) {
  if (!found) return '';
  try {
    if (found.version === '2004') return found.api.GetValue(key2004) || '';
    return found.api.LMSGetValue(key12) || '';
  } catch (e) {
    log('lmsGetValue error: ' + e.message);
    return '';
  }
}

var learnerEmail = 'NO-API';
var learnerName = '';
var attemptId = 'anon-' + Date.now();

function initLms() {
  log('Searching for SCORM API in ancestor frames...');
  var found = findAPI(window, 8);
  if (!found) {
    log('No SCORM API found. learner_email = NO-API.');
    return;
  }
  log('Found SCORM ' + found.version + ' API.');
  var email = lmsGetValue(found, 'cmi.learner_id', 'cmi.core.student_id');
  var name  = lmsGetValue(found, 'cmi.learner_name', 'cmi.core.student_name');
  learnerEmail = email || 'NO-API';
  learnerName = name || '';
  attemptId = (email || 'anon') + '-' + Date.now();
  log('learner_email = ' + learnerEmail);
}

function sendChoice(responseText) {
  log('Clicked: "' + responseText.slice(0, 40) + (responseText.length > 40 ? '...' : '') + '"');

  var fields = {};
  fields[FIELD_IDS.learner_email]   = learnerEmail;
  fields[FIELD_IDS.learner_name]    = learnerName;
  fields[FIELD_IDS.attempt_id]      = attemptId;
  fields[FIELD_IDS.course]          = 'Practice Session 1 - Wix Editor Sub-pages - Rise POC';
  fields[FIELD_IDS.scene]           = 'scene-1.2-opening-call';
  fields[FIELD_IDS.interaction]     = 'opening-etiquette';
  fields[FIELD_IDS.question]        = 'n/a';
  fields[FIELD_IDS.response]        = responseText;
  fields[FIELD_IDS.correct]         = '';
  fields[FIELD_IDS.points]          = '';
  fields[FIELD_IDS.time_on_step_sec] = '';
  fields[FIELD_IDS.notes]           = 'Rise Code/Embed block POC';

  var body = [];
  for (var k in fields) {
    if (Object.prototype.hasOwnProperty.call(fields, k)) {
      var v = fields[k];
      body.push(k + '=' + encodeURIComponent(v == null ? '' : v));
    }
  }

  fetch(ENDPOINT, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
    body: body.join('&')
  }).then(function () {
    log('fetch() resolved — check the Sheet to confirm the row landed.');
  }).catch(function (e) {
    log('fetch() threw: ' + e.message);
  });
}

var buttons = document.querySelectorAll('.choiceBtn');
for (var i = 0; i < buttons.length; i++) {
  buttons[i].addEventListener('click', function (evt) {
    sendChoice(evt.currentTarget.getAttribute('data-response'));
  });
}

log('Block loaded. window === window.top: ' + (window === window.top));
initLms();
</script>
