  function segMarkup(kind, text){
    const who = kind==='system' ? '' : (kind==='you' ? (firstName()||'You') : U.name);
    return bubbleMarkup(kind, text, who);
  }

  /* ---- Typing indicator + auto-advance reveal ----
     Sarah's "typing…" dots show before her first reply to a pick; follow-on
     caller lines in the same beat use a shorter delay; your/system lines appear
     after a short beat. animate=false reveals everything at once (first load). */
  const TAI_MS = 5000, TAI_FOLLOW_MS = 1500, YOU_MS = 700, SYS_MS = 500;
  // Consequence beats:
  //  • inline notes (centered system bubbles) reveal 2s apart;
  //  • spoken consequence lines (Samantha OR the Expert) show a 5s typing
  //    indicator before landing.
  const REACT_INLINE_MS = 2000, REACT_TYPING_MS = 5000;
  function typingBubble(kind){
    const you = kind==='you';
    const side = you ? 'you' : 'caller';
    const who  = you ? (firstName()||'You') : U.name;
    return appendNode(
      `<div class="msg typing ${side}"><div class="meta">${escapeHtml(who)} · typing…</div>`+
      `<div class="bubble"><span class="tai-dot"></span><span class="tai-dot"></span><span class="tai-dot"></span></div></div>`);
  }
  function revealSegments(segs, animate, done, opts){
    opts = opts || {};
    const reaction = !!opts.reaction;
    let i=0, sawCaller=false;
    (function next(){
      if(i>=segs.length){ if(done) done(); return; }
      const s=segs[i++];
      // In a consequence (reaction) reveal:
      //  • centered inline notes (system) turn green and reveal 2s apart;
      //  • spoken lines — Samantha (caller) OR the Expert (you) — show a 5s
      //    typing indicator, then land.
      const inlineNote = reaction && s.kind==='system';
      if(!animate){ appendBubble(s.kind, s.text, inlineNote); return next(); }
      if(inlineNote){
        setTimeout(()=>{ appendBubble('system', s.text, true); next(); }, REACT_INLINE_MS);
      } else if(reaction && s.kind==='you' && window.CallMode && window.CallMode.shouldSpeak && window.CallMode.shouldSpeak()){
        promptSayLine(s.text, ()=>{ appendBubble('you', s.text); next(); });
      } else if(reaction && (s.kind==='caller' || s.kind==='you')){
        const dots=typingBubble(s.kind);
        setTimeout(()=>{ dots.remove(); appendBubble(s.kind, s.text); next(); }, REACT_TYPING_MS);
      } else if(s.kind==='caller'){
        const t = sawCaller ? TAI_FOLLOW_MS : TAI_MS; sawCaller=true;
        const dots=typingBubble();
        setTimeout(()=>{ dots.remove(); appendBubble('caller', s.text); next(); }, t);
      } else {
        setTimeout(()=>{ appendBubble(s.kind, s.text); next(); }, s.kind==='you'?YOU_MS:SYS_MS);
      }
    })();
  }

  /* CALL MODE: an Expert follow-up line inside a consequence. The learner is the
     Expert, so on a voice call they say it; it appears in the chat once sent. */
  function promptSayLine(text, done){
    setComposer(`<div class="choices-label" id="choicesLabel">Say this aloud to ${escapeHtml(U.name)}</div>`
              + `<div class="say-line">${escapeHtml(px(text))}</div><div id="voicepanel"></div>`);
    setSheetQuestion('Say your next line');
    window.CallMode.sayLine(document.getElementById('voicepanel'), px(text), ()=>{ setComposer(''); done(); });
    syncChatBottom();
  }

  /* ---- Helper buttons (native <dialog>) ---- */
  function openModal(title, node){
    const dlg = document.createElement('dialog'); dlg.className='modal'; dlg.id='modal';
    const inner = document.createElement('div'); inner.className='modal-inner';
    const head = document.createElement('div'); head.className='mhead';
    head.innerHTML = `<h3>${escapeHtml(title)}</h3>`;
    const x = document.createElement('button'); x.className='mx'; x.innerHTML='&times;'; x.setAttribute('aria-label','Close');
    x.onclick = closeModal; head.appendChild(x);
    inner.appendChild(head); inner.appendChild(node); dlg.appendChild(inner);
    document.body.appendChild(dlg); dlg.showModal();
    dlg.addEventListener('click', e=>{ if(e.target===dlg) closeModal(); });  // backdrop click
  }
  function closeModal(){ const m=document.getElementById('modal'); if(m){ try{m.close();}catch(e){} m.remove(); } }

  function renderHelpers(){
    const bar = document.getElementById('helperbar');
    if(!S.resources){ bar.style.display='none'; return; }
    bar.innerHTML='';
    const b=document.createElement('button');
    b.className='hbtn';
    b.textContent = S.resources.title || 'Check Resources';
    b.onclick = openResources;
    bar.appendChild(b);
  }
  /* Opens the scenario's dynamic links in a modal. Opening the resource
     marked correct:true is what lifts the article-stage cap in renderFinal —
     but only if it happens at/after RESOURCE_CREDIT_MIN_SECONDS into the call.
     Opening it earlier doesn't count; the learner can still open it again
     later (any time before ending the chat) to earn credit. */
  const RESOURCE_CREDIT_MIN_SECONDS = 30;
  function openResources(){
    const r=S.resources, wrap=document.createElement('div');
    resourcesOpenedAt = callSeconds;   // start the clock for this modal's dwell time
    logEvent({type:'helper', helper:'resources', action:'opened Check Resources', seconds:0});
    if(r.note) wrap.innerHTML='<div class="mnote" style="margin:0 0 0.625rem">'+escapeHtml(r.note)+'</div>';
    (r.items||[]).forEach(it=>{
      const a=document.createElement('a');
      a.className='mopt'; a.href=it.url||'#'; a.target='_blank'; a.rel='noopener noreferrer';
      a.textContent=it.label + '  ↗';
      a.onclick=()=>{
        // Any resource link click (correct or distractor) counts as "opened a
        // resource" — this gates speaker lines like "(You open CSI.)" that
        // should only appear if the learner actually looked something up.
        help.openedAnyResourceLink = true;
        help.openedLabels.add((it.label||'').trim().toLowerCase());
        if(it.correct){
          if(callSeconds >= RESOURCE_CREDIT_MIN_SECONDS){
            help.checkedCorrectArticle=true;
            logEvent({type:'helper', helper:'resources', action:it.label,
                      verdict:'correct', seconds:secondsOnResources(), notes:'opened the correct resource'});
          } else {
            logEvent({type:'helper', helper:'resources', action:it.label,
                      seconds:secondsOnResources(), notes:'opened the correct resource too early to earn credit (before '+RESOURCE_CREDIT_MIN_SECONDS+'s)'});
          }
        } else logEvent({type:'helper', helper:'resources', action:it.label,
                         verdict:'incorrect', seconds:secondsOnResources(), notes:'opened a distractor resource'});
      };
      wrap.appendChild(a);
    });
    openModal(r.title||'Check Resources', wrap);
    document.getElementById('modal').addEventListener('close', ()=>{
      logEvent({type:'helper', helper:'resources', action:'closed Check Resources', seconds:secondsOnResources()});
    }, {once:true});
  }

  /* Centered in-sim notice (styled like the Check Resources panel) shown when a
     learner tries to reply from an article they never opened in Check Resources —
     replaces the old browser alert(). */
  function notifyResourceNotOpened(){
    const wrap=document.createElement('div');
    wrap.innerHTML='<div class="mnote" style="margin:0;font-size:0.875rem;color:var(--ink-2)">'
      + 'It looks like you didn’t open this article using Check Resources. '
      + 'Remember to always check the resource before answering from memory.</div>';
    openModal('Check the resource first', wrap);
  }

  /* Progress bar removed — kept as a no-op so existing call sites are harmless. */
  function paintProgress(){}

  function applyCredit(stg, pts, verdict, pickText){
    if(!(stg in earned)) return;
    const cfg = stageCfg[stg] || {};
    if(cfg.additive){
      // Stage spans more than one screen (e.g. solve = s_solve + s_solve2):
      // sum contributions, capped at the stage max, rather than taking the best.
      const next = Math.min(cfg.max==null ? Infinity : cfg.max, earned[stg] + Math.max(0, pts));
      if(pts > 0 || !(stg in decisivePick)) decisivePick[stg] = {text:pickText, verdict:verdict, points:next};
      earned[stg] = next;
      if(verdict==='correct') status[stg]='done';
      else if(verdict==='partial' && status[stg]!=='done') status[stg]='partial';
      return;
    }
    if(!(stg in decisivePick) || pts > earned[stg]) decisivePick[stg] = {text:pickText, verdict:verdict, points:pts};
    if(pts > earned[stg]) earned[stg] = pts;
    if(verdict==='correct') status[stg]='done';
    else if(verdict==='partial' && status[stg]!=='done') status[stg]='partial';
  }
  function recordChoice(screen, ch, cappedPoints){
    const primary = ch.stageOverride || screen.stage;
    applyCredit(primary, cappedPoints, ch.verdict, ch.text);
    (ch.credits||[]).forEach(c => applyCredit(c.stage, c.points, c.verdict||'correct', ch.text));
  }

  function renderScreen(id, opts){
    opts = opts || {};
    const retriedIds = opts.retriedIds || [];
    if(id==='__end__') return renderFinal();
    const scr = S.screens[id];
    visitedScreens.add(scr.id);
    paintProgress();
    setComposer('');   // choices appear only AFTER the caller's line has landed

    const showChoices = ()=>{
      // (Screen screenshots are no longer shown automatically — they now reveal
      //  only when the learner picks the choice flagged with caption:"Samantha's Layers panel…".)
      // CALL MODE: all response options stay visible; the learner reads one aloud
      // (or taps it). The voice panel + meter sit below. See the CALL MODE module.
      setComposer(`<div class="choices-label" id="choicesLabel">Read one of these responses aloud — or tap to pick</div>`
                + `<div id="choices"></div>`
                + `<div id="voicepanel"></div>`);
      setSheetQuestion(px(scr.prompt));   // the question shows in the sheet handle
      const cWrap = document.getElementById('choices');
      const choiceBtns = [];
      scr.choices.forEach(ch=>{
        const b=document.createElement('button');
        // A choice with `say` is the Expert SPEAKING (rendered as a bubble), so
        // it isn't a tool action — no badge, even if its label reads "[Action]".
        const badge = isAction(ch.text) && !ch.say;
        b.className = 'choice' + (badge ? ' choice-action' : '');
        b.innerHTML = (badge ? '<span class="cbadge">Action</span>' : '')
                    + escapeHtml(stripAction(px(ch.text)));
        if(retriedIds.includes(ch.id)) b.disabled=true;
        b.onclick=()=>choose(scr,ch,retriedIds,opts.cap);
        cWrap.appendChild(b);
        choiceBtns.push({ btn:b, choice:ch, disabled:!!b.disabled });
      });
      markStepStart();   // start the clock for this screen's time_on_step_sec
      // CALL MODE: attach the speak-aloud panel that transcribes and matches.
      if(window.CallMode) window.CallMode.attach(scr, choiceBtns);
      syncChatBottom();  // choices are now in the DOM — slide the chat up above them
    };

    // The caller line (which may itself contain Expert:/Sarah: parts) is split
    // into its own bubbles. On auto-advance it animates in with typing dots.
    currentSpeakerShown = !!(scr.speaker && !opts.skipSpeaker && speakerGateMet(scr));
    if(currentSpeakerShown){
      revealSegments(splitDialogue(scr.speaker), !!opts.animateSpeaker, showChoices);
    } else {
      showChoices();
    }
  }

  /* Some speaker lines only make sense if the learner actually did something
     first. `speakerIf:"resourceOpened"` on a screen gates its speaker line so
     it's skipped entirely unless the learner clicked a resource link in Check
     Resources at some point in the call. Add more gate keys here as needed. */
  function speakerGateMet(scr){
    if(!scr.speakerIf) return true;
    if(scr.speakerIf === 'resourceOpened') return !!help.openedAnyResourceLink;
    return true;
  }

  function choose(scr, ch, retriedIds, cap){
    // Stage lock: a choice phrased "Reply using …" / "Provide a response using …"
    // requires the learner to have opened the quoted article(s) in Check
    // Resources first. Matching is normalized (case/punctuation/&-and, plus a
    // prefix-tolerant substring test) and ALL quoted articles must be opened.
    if(/\b(?:reply using|provide a response using)\b/i.test(px(ch.text)||'')){
      const toks = s => new Set((s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean));
      const subset = (a,b) => [...a].every(t => b.has(t));   // a ⊆ b
      const opened = [...help.openedLabels].map(toks).filter(s => s.size);
      const needed = (px(ch.text).match(/["“”'‘’]([^"“”'‘’]+)["“”'‘’]/g)||[])
                       .map(q => toks(q.replace(/["“”'‘’]/g,''))).filter(s => s.size);
      const missing = needed.some(n => !opened.some(o => subset(n,o) || subset(o,n)));
      if(!needed.length || missing){
        notifyResourceNotOpened();
        return;
      }
    }
    [...composerEl.querySelectorAll('.choice')].forEach(x=>x.disabled=true);
    // The learner's pick renders as:
    //   • `say` present  -> a blue Expert bubble of the spoken words ("Tell Sarah…")
    //   • an [Action]    -> an inline "You …" note (a tool action)
    //   • otherwise      -> a blue reply bubble of the choice text
    if(ch.say) appendBubble('you', ch.say);
    else if(isAction(ch.text)) appendActionNote(actionNoteText(ch.text));
    else appendBubble('you', ch.text);

    // Choice-gated screenshot: shows immediately on selection, before the reply.
    // Action-revealed screenshots auto-open the full-screen lightbox (2nd arg).
    if(ch.showsImage && (ch.image||scr.image)) appendImage(ch.image||scr.image, true);
    // Deferred screenshot: shown AFTER the consequence (reply) finishes revealing.
    const showImageAfter = ()=>{ if(ch.showsImageAfter && (ch.image||scr.image)) appendImage(ch.image||scr.image, true); };
    const segs = splitDialogue(ch.consequence);

    if(ch.retry && !retriedIds.includes(ch.id)){
      transcript.push({ speaker:currentSpeakerShown ? scr.speaker : null, picked:ch.text, say:ch.say, consequence:ch.consequence });
      logEvent({ type:'choice', stage:scr.stage, screen:scr.id, question:px(scr.prompt),
                 text:stripAction(px(ch.text)), verdict:ch.verdict, points:0, seconds:secondsOnStep(),
                 notes:'first attempt — caller pushed back, screen re-opened for a retry (capped at '+ch.capIfRetried+')' });
      setComposer('');
      // Auto-advance: once the pushback lands, re-open the same screen (no button).
      revealSegments(segs, true, ()=>renderScreen(scr.id,
        { retriedIds:retriedIds.concat(ch.id), cap:ch.capIfRetried, skipSpeaker:true }), { reaction:true });
      return;
    }

    let pts = ch.points;
    if(typeof cap === 'number') pts = Math.min(pts, cap);
    recordChoice(scr, ch, pts);
    logEvent({ type:'choice', stage:scr.stage, screen:scr.id, question:px(scr.prompt),
               text:stripAction(px(ch.text)), verdict:ch.verdict, points:pts, seconds:secondsOnStep(),
               notes:(isAction(ch.text) ? 'action' : 'reply')
                     + (typeof cap==='number' ? '; retry attempt, capped at '+cap : '') });
    transcript.push({ speaker:(typeof cap==='number'?null:scr.speaker), picked:ch.text, say:ch.say, consequence:ch.consequence });

    setComposer('');
    // Auto-advance to the next screen — NO Continue button. The next caller line
    // arrives via its own typing indicator, straight into the next choices.
    revealSegments(segs, true, ()=>{
      showImageAfter();
      if(ch.goTo==='__end__') renderFinal();
      else renderScreen(ch.goTo, { animateSpeaker:true });
    }, { reaction:true });
  }

  /* =================== PHASE 3 — COMPLETE =================== */
  function renderFinal(){
    stopTimer();
    // The call is over: stop the recorder and ship the audio to Drive (keyed by
    // attempt_id). Best-effort — never blocks rendering the results.
    try{
      if(window.CallMode && window.CallMode.stopRecording){
        window.CallMode.stopRecording().then(blob => {
          uploadRecording(blob);   // permanent copy → L&D Drive
          mountPlayback(blob);     // play-only copy → learner, in the results panel
        }).catch(()=>{});
      }
    } catch(e){}

    // Apply the Check-Resources penalty before tallying (same rule the old
    // "Check the Articles" used: no verify of the correct resource → capped).
    const helpNotes = [];
    const res = S.resources;
    if(res && !help.checkedCorrectArticle && (res.stage in earned) && earned[res.stage] > res.capIfUnchecked){
      earned[res.stage] = res.capIfUnchecked;
      helpNotes.push("You reached the right answer, but didn't verify it in the source resource — checking the resource is the skill, not remembering.");
    }
    S.stages.forEach(st=>{ if(earned[st.id] >= st.max) status[st.id]='done'; else if(earned[st.id] > 0 && status[st.id]==='done') status[st.id]='partial'; });

    const sum = Object.values(earned).reduce((a,b)=>a+b,0);

    // One summary row per attempt: the total score only.
    logEvent({ type:'final', points:sum, seconds:callSeconds,
               notes:'final score ' + sum + ' / ' + maxTotal });

    const rows = S.stages.map(st=>{
      const cls = status[st.id]==='done'?'done':status[st.id]==='partial'?'partial':'miss';
      return `<div class="srow"><span><span class="sdot ${cls}"></span>${st.name}</span>
              <span class="sval">${earned[st.id]} / ${st.max}</span></div>`;
    }).join('');

    const pickLine = st => {
      const p = decisivePick[st.id];
      return p ? `<div class="pick">Your response: “${escapeHtml(p.text)}”</div>`
               : `<div class="pick miss">You didn't reach this step.</div>`;
    };
    // A stage counts as "reached" only if the learner actually answered or was
    // credited for it (decisivePick set). Stages skipped by ending the chat
    // early get no coaching feedback — just a "didn't reach this step" note.
    const reached = st => (st.id in decisivePick);
    const strengths = S.stages.filter(st=>status[st.id]==='done' && st.strength)
        .map(st=>`<li><b>${st.name}</b> — ${st.strength}${pickLine(st)}</li>`).join('');
    const areas = S.stages.filter(st=>status[st.id]!=='done' && st.improvement)
        .map(st=> reached(st)
            ? `<li><b>${st.name}</b> — ${st.improvement}${pickLine(st)}</li>`
            : `<li><b>${st.name}</b> — You didn't reach this step.</li>`).join('');

    // One collapsible row, styled like the wix.com "Website builder FAQs".
    const accItem = (id, title, inner) => `
      <div class="acc-item" data-acc="${id}">
        <button class="acc-head" type="button" aria-expanded="false" aria-controls="accp-${id}">
          <span>${title}</span><span class="acc-icon" aria-hidden="true"></span>
        </button>
        <div class="acc-panel" id="accp-${id}" role="region">
          <div class="acc-clip"><div class="acc-inner">${inner}</div></div>
        </div>
      </div>`;

    // CALL MODE: voice summary for the results panel + one telemetry row.
    const dv = (window.CallMode && window.CallMode.delivery) ? window.CallMode.delivery() : null;
    if(dv && dv.spoken) logEvent({ type:'helper', helper:'voice', action:dv.rating, seconds:callSeconds,
      notes: dv.spoken + ' spoken responses, ' + dv.events + ' volume events (' + dv.quiet + ' too quiet, ' + dv.loud + ' too loud)' });

    const completeImg = U.completeImage || U.image;
    const portrait = completeImg
      ? `<img src="${escapeHtml(completeImg)}" alt="" onerror="this.style.display='none'">` : '';

    app.innerHTML = `
      <section class="complete-hero">
        <div class="portrait">${portrait}</div>
        <div class="body">
          <h1 class="display">Complete!</h1>
          <p class="lead">Here's how the chat went, stage by stage — with the exact response that set each score.</p>
          <div class="scorenum">${sum}<small> / ${maxTotal}</small></div>
        </div>
      </section>

      <div class="acc">
        ${accItem('scorecard','Scorecard', rows)}
        ${accItem('strengths','Top strengths', `<ul class="list str">${strengths || '<li>No stage was completed to full marks this time.</li>'}</ul>`)}
        ${accItem('areas','Areas for improvement', `<ul class="list imp">${areas || '<li>Nothing flagged — a clean run.</li>'}</ul>`)}
        ${dv ? accItem('delivery','Voice and Projection', dv.html) : ''}
      </div>

      ${helpNotes.length ? `<div class="card"><h3>Notes</h3><ul class="list imp">${helpNotes.map(n=>`<li>${n}</li>`).join('')}</ul></div>` : ''}

      <div class="gate">
        <button class="btn btn-dark" id="finishBtn" type="button" disabled>Finish</button>
        <span class="hint" id="gateHint">Open all three sections to finish.</span>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" id="txBtn">View conversation transcript</button>
        <button class="btn btn-dark" onclick="location.reload()">Restart</button>
      </div>
      <div id="tx" class="card" style="display:none"></div>`;

    if(window.CallMode && window.CallMode.mountGraph) window.CallMode.mountGraph();   // draw the volume waveform

    // ---- Accordion toggle + completion gate ----------------------------------
    // Each row opens independently (mirrors the Wix FAQ). The Finish button
    // unlocks only once all three rows have each been opened at least once;
    // re-collapsing a row does not re-lock it. Finishing pushes the Rise/
    // Storyline variable that marks the activity complete.
    const needIds = ['scorecard','strengths','areas'];
    const opened  = new Set();
    const finishBtn = document.getElementById('finishBtn');
    const gateHint  = document.getElementById('gateHint');
    let finished = false;

    app.querySelectorAll('.acc-head').forEach(head=>{
      head.onclick = () => {
        const item = head.closest('.acc-item');
        const isOpen = item.classList.toggle('open');
        head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        if(isOpen){
          opened.add(item.getAttribute('data-acc'));
          if(!finished && needIds.every(id=>opened.has(id))){
            finishBtn.disabled = false;
            gateHint.textContent = 'All sections reviewed — you can finish.';
            gateHint.classList.add('ready');
          }
        }
      };
    });

    finishBtn.onclick = () => {
      if(finishBtn.disabled || finished) return;
      finished = true;
      pushRiseVar('activity_complete', 'true');
      logEvent({ type:'complete', points:sum, seconds:callSeconds,
                 notes:'learner reviewed all end-screen sections and finished — ' + sum + ' / ' + maxTotal });
      finishBtn.classList.remove('btn-dark');
      finishBtn.classList.add('done');
      finishBtn.textContent = 'Completed ✓';
      gateHint.textContent = IS_CALL_TAB ? 'Marked complete. You can close this tab and go back to your course.' : 'Marked complete.';
      gateHint.classList.add('ready');
    };

    document.getElementById('txBtn').onclick = () => {
      const tx = document.getElementById('tx'), btn = document.getElementById('txBtn');
      if(tx.style.display==='none'){
        // Mirror the live chat: split speaker/consequence into speaker bubbles,
        // render the pick as an action note or a blue reply bubble.
        // Same back-to-back grouping as the live chat: name label only on the
        // first bubble of a same-speaker run (txSeg tracks the previous kind).
        let txLast = null;
        const txSeg = (kind, text, actionNote) => {
          const same = (kind !== 'system' && kind === txLast);
          txLast = kind;
          if(actionNote) return bubbleMarkup('system', text, '');
          const who = (kind==='system' || same) ? '' : (kind==='you' ? (firstName()||'You') : U.name);
          return bubbleMarkup(kind, text, who);
        };
        tx.innerHTML = `<h3 style="margin-bottom:0.375rem">Conversation transcript</h3>` +
          `<div class="chat txchat">` +
          transcript.map(t=>{
            let h='';
            if(t.speaker) splitDialogue(t.speaker).forEach(s=> h+=txSeg(s.kind, s.text));
            h += t.say ? txSeg('you', t.say)
               : isAction(t.picked) ? txSeg('system', actionNoteText(t.picked), true)
               : txSeg('you', t.picked);
            if(t.consequence) splitDialogue(t.consequence).forEach(s=> h+=txSeg(s.kind, s.text));
            return h;
          }).join('') + `</div>`;
        tx.style.display='block'; btn.textContent='Hide conversation transcript';
      } else { tx.style.display='none'; btn.textContent='View conversation transcript'; }
    };
  }

  /* ---- boot ---- */
  if(IS_CALL_TAB && window.opener) bootCallTab(); else renderMeet();

  /* Signal the Rise 360 code block that the project has loaded and can display. */
  try { window.parent.postMessage({ type: 'complete' }, '*'); } catch(e){}
})();
</script>
<script id="callmode">
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const cm = { audio:null, analyser:null, data:null, meterFill:null, rafId:null,
               peak:0, recognizing:false,
               volLog:[],     // one entry per SPOKEN response: level, zone, when, what
               curFrames:[], t0:0, t1:0,   // loudness frames for the response being spoken now
               timeline:[],   // [seconds into recording, loudest level in that 0.1s, speaking?]
               recStart:0, recEnd:0,       // performance.now() when capture started / call ended
               voiceMode:false,            // true once the learner is taking the call by voice
               stream:null, recorder:null, chunks:[] };  // call-recording capture

  /* ---- The "good volume" zone ----
     Matches the green band of the live meter (0.40 to 0.88 on the same 0..1
     scale). Each spoken response is scored by its typical speaking level (the
     80th percentile of its voiced frames), so a whisper, a normal voice and a
     shout land in different places instead of averaging out. Tune these two
     numbers if real headset tests read consistently high or low. */
  const ZONE_LOW = 0.30, ZONE_HIGH = 0.88;   // LOW matches where the meter/graph turns yellow-green
  function relNow(){ return cm.recStart ? (performance.now() - cm.recStart) / 1000 : 0; }

  // Words too common to help distinguish one choice from another.
  const STOP = new Set(("a an the and or but so to of in on at for with your you "+
    "i we they it is are be do does can could would should how what that this "+
    "them then just let me my our their his her him she he as if into about "+
    "okay ok hi hey please thanks thank got get go going want need see look "+
    "us up out now here there yes no not").split(/\s+/));

  function norm(s){ return String(s||'').toLowerCase()
      .replace(/\[action\]/gi,' ').replace(/[^a-z0-9\s]/g,' ')
      .replace(/\s+/g,' ').trim(); }
  function tokens(s){ return norm(s).split(' ')
      .map(w=>w.replace(/(ing|ed|es|s)$/,''))          // crude stemming
      .filter(w=>w.length>2 && !STOP.has(w)); }

  // Build the text we match each spoken answer AGAINST. Prefer `say` (the exact
  // words the Expert would speak); fall back to the button label.
  function targetText(ch){ return (ch.say ? ch.say + ' ' : '') + (ch.text||''); }

  // Score how well the transcript matches a choice: count of shared content
  // words, each weighted by how DISTINCTIVE it is across the visible choices
  // (a word appearing in only one choice is worth more than a shared one).
  function scoreChoices(transcript, choiceBtns){
    const heard = new Set(tokens(transcript));
    const sets = choiceBtns.map(c=>new Set(tokens(targetText(c.choice))));
    const df = {}; sets.forEach(set=>set.forEach(w=>{ df[w]=(df[w]||0)+1; }));
    return choiceBtns.map((c,idx)=>{
      let score=0;
      sets[idx].forEach(w=>{ if(heard.has(w)) score += 1/(df[w]||1); });
      return { ...c, score, idx };
    }).sort((a,b)=>b.score-a.score);
  }

  /* ---- Live volume meter (Web Audio) — initialised once, on first mic use ---- */
  async function ensureAudio(){
    if(cm.audio) return true;
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      cm.stream = stream;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const src = ctx.createMediaStreamSource(stream);
      const an = ctx.createAnalyser(); an.fftSize = 1024;
      src.connect(an);
      cm.audio = ctx; cm.analyser = an; cm.data = new Uint8Array(an.fftSize);
      cm.recStart = performance.now();   // time zero for the graph and the recording
      startRecording(stream);   // begin capturing the call from the first mic use
      loopMeter();
      return true;
    } catch(e){ cm.lastError = e; return false; }
  }

  /* ---- Call recording (MediaRecorder) — one continuous file per attempt ----
     Starts on the first mic use and runs through the whole call; stopRecording()
     (called at end-of-call) returns the finished audio Blob for upload. Records
     the learner's side only — the caller's lines are scripted text, not audio.
     If MediaRecorder or a supported codec is missing, it silently no-ops. */
  function pickMime(){
    const cands = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    if(typeof MediaRecorder==='undefined' || !MediaRecorder.isTypeSupported) return '';
    for(const m of cands){ if(MediaRecorder.isTypeSupported(m)) return m; }
    return '';
  }
  function startRecording(stream){
    if(cm.recorder || typeof MediaRecorder==='undefined') return;
    try{
      const mime = pickMime();
      cm.recorder = mime ? new MediaRecorder(stream, { mimeType:mime })
                         : new MediaRecorder(stream);
      cm.chunks = [];
      cm.recorder.ondataavailable = e => { if(e.data && e.data.size) cm.chunks.push(e.data); };
      cm.recorder.start();   // one blob at stop; simplest and reliable for a POC
    } catch(e){ cm.recorder = null; }
  }
  function stopRecording(){
    if(cm.recStart && !cm.recEnd) cm.recEnd = performance.now();   // the call is over: freeze the timeline
    return new Promise(resolve => {
      const rec = cm.recorder;
      // Always release the mic when the call ends, recorder or not.
      const releaseMic = ()=>{ try{ (cm.stream && cm.stream.getTracks()||[]).forEach(t=>t.stop()); }catch(_){} };
      if(!rec || rec.state === 'inactive'){ releaseMic(); resolve(null); return; }
      rec.onstop = () => {
        const type = (cm.chunks[0] && cm.chunks[0].type) || rec.mimeType || 'audio/webm';
        const blob = cm.chunks.length ? new Blob(cm.chunks, { type }) : null;
        cm.recorder = null; cm.chunks = [];
        releaseMic();
        resolve(blob);
      };
      try{ rec.stop(); }catch(e){ releaseMic(); resolve(null); }
    });
  }

  function level(){ // RMS -> 0..1, lightly boosted so normal speech reads mid-scale
    if(!cm.analyser) return 0;
    cm.analyser.getByteTimeDomainData(cm.data);
    let sum=0; for(let i=0;i<cm.data.length;i++){ const v=(cm.data[i]-128)/128; sum+=v*v; }
    return Math.min(1, Math.sqrt(sum/cm.data.length) * 3.2);
  }
  /* Whole-bar color for the CURRENT loudness. Quiet is penalized hardest:
     the entire red→orange band lives below the 0.22 "minimum projection" mark,
     the good range is solid green, and only an extreme shout (>~0.9) tips into
     a soft amber "ease off" — because too loud is far less bad than too quiet. */
  const METER_STOPS = [
    [0.00, [179, 18,  0 ]],   // deep red   — barely audible
    [0.12, [230, 34, 20 ]],   // red        — too quiet
    [0.22, [245,166, 35 ]],   // orange     — at the projection threshold mark
    [0.30, [232,195,  0 ]],   // amber-yellow
    [0.40, [143,203,  0 ]],   // yellow-green — entering the good zone
    [0.55, [ 95,178,  0 ]],   // green      — good projection
    [0.88, [ 79,163,  0 ]],   // solid green (holds through loud)
    [1.00, [224,160, 32 ]]    // soft amber — only an extreme shout
  ];
  function meterColor(L){
    L = Math.max(0, Math.min(1, L));
    for(let i=1;i<METER_STOPS.length;i++){
      const [p1,c1]=METER_STOPS[i-1], [p2,c2]=METER_STOPS[i];
      if(L<=p2){
        const t=(L-p1)/(p2-p1||1);
        const r=Math.round(c1[0]+(c2[0]-c1[0])*t);
        const g=Math.round(c1[1]+(c2[1]-c1[1])*t);
        const b=Math.round(c1[2]+(c2[2]-c1[2])*t);
        return `rgb(${r},${g},${b})`;
      }
    }
    return `rgb(79,163,0)`;
  }
  function loopMeter(){
    // Calm the meter for EVERYONE by default: (1) exponential smoothing damps
    // spikes, (2) the width is quantized to steps so it doesn't twitch, (3)
    // repaints are throttled. Low-motion is the baseline — not gated behind the
    // OS setting. When the OS "reduce motion" setting is on, it's calmer still.
    const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const EMA      = reduce ? 0.07 : 0.12;   // lower = smoother / slower to react
    const STEP_PCT = reduce ? 12   : 8;      // quantize width to whole % steps
    const INTERVAL = reduce ? 260  : 150;    // ms between DOM repaints
    let smoothed = 0, lastPaint = 0, lastPct = -1, lastBucket = -1;
    let lastSample = 0, winMax = 0, winSpk = false;
    const step = (ts)=>{
      const L = level();
      if(cm.recognizing){ cm.peak = Math.max(cm.peak, L); cm.curFrames.push(L); }
      if(cm.recStart && !cm.recEnd){         // timeline for the results graph
        winMax = Math.max(winMax, L); if(cm.recognizing) winSpk = true;
        if(ts - lastSample >= 100){ cm.timeline.push([relNow(), winMax, winSpk ? 1 : 0]); winMax = 0; winSpk = false; lastSample = ts; }
      }
      smoothed += (L - smoothed) * EMA;      // low-pass filter
      if(cm.meterFill && (ts - lastPaint) >= INTERVAL){
        lastPaint = ts;
        const pct = Math.round(smoothed*100 / STEP_PCT) * STEP_PCT;
        if(pct !== lastPct){ cm.meterFill.style.width = pct + '%'; lastPct = pct; }
        const bucket = Math.round(smoothed / 0.05);           // recolor per 5% band
        if(bucket !== lastBucket){ cm.meterFill.style.background = meterColor(smoothed); lastBucket = bucket; }
      }
      cm.rafId = requestAnimationFrame(step);
    };
    cm.rafId = requestAnimationFrame(step);
  }

  /* ---- Attach the voice panel to the current screen's composer ---- */
  function attach(scr, choiceBtns){
    const panel = document.getElementById('voicepanel');
    const choicesWrap = document.getElementById('choices');
    const label = document.getElementById('choicesLabel');
    if(!panel) return;

    // ACTION-ONLY step (every option is an [Action], i.e. something the Expert
    // DOES, not says): nothing to say aloud, so the mic is shown switched off.
    const actionOnly = choiceBtns.length && choiceBtns.every(c => /^\s*\[Action\]/i.test(c.choice.text||'') && !c.choice.say);
    if(actionOnly){
      cm.meterFill = null;
      panel.innerHTML = `
        <div class="voice voice-off">
          <div class="voice-row"><button class="mic-btn" type="button" disabled><span class="mic-ico"></span>Hold &amp; say your answer</button></div>
          <p class="voice-status">This step is an action, not something you say. Tap the action you'd take.</p>
        </div>`;
      if(label) label.textContent = "Tap the action you'd take";
      return;
    }

    // All response options stay VISIBLE — the learner reads one aloud (or taps it).
    if(!SR){
      panel.innerHTML = `<div class="voice-unsupported">Speak-aloud isn't supported in this browser
        (use Chrome or Edge). You can still tap a response above.</div>`;
      if(label) label.textContent = 'Pick a response:';
      return;
    }

    panel.innerHTML = `
      <div class="voice">
        <div class="voice-row">
          <button class="mic-btn" id="micBtn" type="button"><span class="mic-ico"></span>Hold &amp; say your answer</button>
          <div class="meter"><div class="meter-fill" id="meterFill"></div><div class="meter-mark" style="left:22%"></div></div>
        </div>
        <p class="voice-status" id="vStatus">Hold the button and read your chosen response aloud, as you would on a real call.</p>
        <div class="voice-confirm" id="vConfirm" style="display:none"></div>
      </div>`;
    cm.meterFill = document.getElementById('meterFill');
    const micBtn = document.getElementById('micBtn');
    const vStatus = document.getElementById('vStatus');
    const vConfirm = document.getElementById('vConfirm');

    let rec=null, finalText='', listening=false, finished=false, committed=false;

    function say(html){ vStatus.innerHTML = html; }
    function resetBtn(){ micBtn.classList.remove('listening');
      micBtn.innerHTML = `<span class="mic-ico"></span>Hold &amp; say your answer`; }

    async function start(){
      if(listening) return;
      const ok = await ensureAudio();
      if(!ok){ micErrorMessage(cm.lastError).then(h=>say(h + ' You can still tap a response above.')); return; }
      finalText=''; cm.peak=0; cm.curFrames=[]; cm.t0=relNow(); cm.recognizing=true;
      listening=true; finished=false; committed=false;
      vConfirm.style.display='none'; vConfirm.innerHTML='';
      choiceBtns.forEach(c=>c.btn.classList.remove('matched'));
      rec = new SR(); rec.lang='en-US'; rec.interimResults=true; rec.continuous=true; rec.maxAlternatives=1;
      rec.onresult = (e)=>{
        let interim='';
        for(let i=e.resultIndex;i<e.results.length;i++){
          const r=e.results[i];
          if(r.isFinal) finalText += r[0].transcript + ' ';
          else interim += r[0].transcript;
        }
        say(`<span class="heard">“${escapeText((finalText+interim).trim())}”</span>`);
      };
      rec.onerror = (e)=>{ say(`<span style="color:#C81C0F">Didn't catch that (${e.error}). Try again.</span>`); };
      // finish() runs whenever recognition ENDS — whether the learner released
      // the button or the recogniser stopped on its own. (This is the fix: the
      // old code gated finish behind a flag we had already cleared on release.)
      rec.onend = ()=>{ finish(); };
      try{ rec.start(); }catch(_){}
      micBtn.classList.add('listening');
      micBtn.innerHTML = `<span class="mic-ico"></span>Listening… release to submit`;
    }

    function stop(){ if(!listening) return; listening=false; cm.recognizing=false; cm.t1=relNow();
      resetBtn();
      if(rec){ try{ rec.stop(); }catch(_){} } }

    // Fraction of the option's own content-words that were actually heard —
    // ~1.0 when the learner reads an option (nearly) verbatim.
    function coverage(said, ch){
      const heard = new Set(tokens(said));
      const t = tokens(targetText(ch));
      if(!t.length) return 0;
      let hit=0; t.forEach(w=>{ if(heard.has(w)) hit++; });
      return hit / t.length;
    }

    function finish(){
      if(finished) return; finished=true; listening=false; cm.recognizing=false;
      resetBtn();
      const said = finalText.trim();
      if(!said){ say(`I didn't hear anything — hold the button and speak up.`); return; }

      const pool = choiceBtns.filter(c=>!c.disabled);
      const ranked = scoreChoices(said, pool);
      const top = ranked[0], second = ranked[1];
      choiceBtns.forEach(c=>c.btn.classList.remove('matched'));

      if(!top || top.score <= 0){
        say(`<span class="heard">“${escapeText(said)}”</span><br>I couldn't match that to a response — read one of the options aloud, or tap it.`);
        return;
      }

      const cov = coverage(said, top.choice);
      const gap = second ? (top.score - second.score) : top.score;
      // STRONG / VERBATIM MATCH → auto-select, no click. True when the learner
      // read most of an option's words, or the top choice clearly wins.
      const strong = cov >= 0.5 || gap >= 0.4 || (!second) || top.score >= 1.2;

      if(strong){
        top.btn.classList.add('matched');
        say(`<span class="heard">“${escapeText(said)}”</span> &nbsp;✓ matched — sending…`);
        committed = true;
        setTimeout(()=>commit(top), 600);   // brief beat so the learner sees the match
        return;
      }

      // Ambiguous → show the top two to choose between (fallback only).
      say(`<span class="heard">“${escapeText(said)}”</span><br>Not sure which one — tap the closest:`);
      vConfirm.style.display='flex'; vConfirm.innerHTML='';
      ranked.slice(0,2).forEach(r=>{
        r.btn.classList.add('matched');
        const b=document.createElement('button'); b.className='vc-yes'; b.style.background='#116DFF';
        b.textContent = shortLabel(r.choice); b.onclick=()=>commit(r); vConfirm.appendChild(b);
      });
      const again=document.createElement('button'); again.className='vc-no'; again.textContent='Try again';
      again.onclick=()=>{ vConfirm.style.display='none'; choiceBtns.forEach(c=>c.btn.classList.remove('matched')); say('Hold the button and read a response aloud.'); };
      vConfirm.appendChild(again);
    }

    function commit(match){ if(!match) return;
      // Record THIS spoken response's peak loudness for the end-of-call
      // projection summary (only voice-driven selections land here; tapping a
      // choice directly doesn't, which is correct — no voice to measure).
      logSpoken('response', scr.prompt, match.btn.textContent.replace(/^\s*Action\s*/, ''));
      match.btn.click(); }  // reuse the engine's real scoring path

    // Press-and-hold interaction.
    micBtn.addEventListener('mousedown', (e)=>{ e.preventDefault(); start(); });
    micBtn.addEventListener('mouseup', stop);
    micBtn.addEventListener('mouseleave', stop);
    micBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); start(); }, {passive:false});
    micBtn.addEventListener('touchend',  (e)=>{ e.preventDefault(); stop(); });
  }

  /* ---- Score one spoken response ---- */
  function speakingLevel(frames){
    const voiced = frames.filter(v => v >= 0.10).sort((a,b)=>a-b);   // ignore pauses/breaths between words
    if(!voiced.length) return frames.length ? Math.max(...frames) : 0;
    return voiced[Math.min(voiced.length - 1, Math.floor(voiced.length * 0.9))];
  }
  function zoneOf(L){ return L < ZONE_LOW ? 'quiet' : (L > ZONE_HIGH ? 'loud' : 'good'); }
  function logSpoken(kind, prompt, text){
    const lvl = speakingLevel(cm.curFrames);
    cm.volLog.push({ kind, prompt:String(prompt||''), text:String(text||''), level:lvl, peak:cm.peak,
                     zone:zoneOf(lvl), t0:cm.t0, t1:cm.t1 || relNow() });
    cm.voiceMode = true;   // they're taking the call by voice
  }

  /* ---- Expert follow-up line: the learner says it aloud ----
     When a pick triggers another Expert line (e.g. "Expert: Love it, I'll keep
     this efficient then."), the engine pauses and shows that line here. The
     learner holds the mic and says it; any reasonable attempt is accepted (it
     isn't graded), and it counts toward Voice and Projection like any response.
     "Send without saying it" always lets them move on. */
  function shouldSpeak(){ return !!SR && cm.voiceMode === true && !embeddedBlocked(); }
  function setVoiceMode(v){ cm.voiceMode = !!v; }
  function sayLine(panel, line, onDone){
    if(!panel){ onDone(); return; }
    panel.innerHTML = `
      <div class="voice">
        <div class="voice-row">
          <button class="mic-btn" id="micBtn" type="button"><span class="mic-ico"></span>Hold &amp; say this line</button>
          <div class="meter"><div class="meter-fill" id="meterFill"></div><div class="meter-mark" style="left:22%"></div></div>
        </div>
        <p class="voice-status" id="vStatus">Hold the button and say the line above, as you would on a real call.</p>
        <div class="voice-confirm"><button class="vc-no" id="vSkip" type="button">Send without saying it</button></div>
      </div>`;
    cm.meterFill = document.getElementById('meterFill');
    const micBtn = document.getElementById('micBtn'), vStatus = document.getElementById('vStatus');
    let rec = null, finalText = '', listening = false, finished = false, sent = false;
    const say = h => { vStatus.innerHTML = h; };
    const resetBtn = ()=>{ micBtn.classList.remove('listening'); micBtn.innerHTML = `<span class="mic-ico"></span>Hold &amp; say this line`; };
    const send = (spoken)=>{ if(sent) return; sent = true; if(spoken) logSpoken('line', 'Your follow-up line', line); onDone(); };
    document.getElementById('vSkip').onclick = ()=>send(false);
    async function start(){
      if(listening || sent) return;
      const ok = await ensureAudio();
      if(!ok){ micErrorMessage(cm.lastError).then(h=>say(h + ' Use Send without saying it to continue.')); return; }
      finalText = ''; cm.peak = 0; cm.curFrames = []; cm.t0 = relNow(); cm.recognizing = true;
      listening = true; finished = false;
      rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true;
      rec.onresult = (e)=>{ let interim = '';
        for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finalText += r[0].transcript + ' '; else interim += r[0].transcript; }
        say(`<span class="heard">“${escapeText((finalText+interim).trim())}”</span>`); };
      rec.onerror = (e)=>{ say(`<span style="color:#C81C0F">Didn't catch that (${e.error}). Try again.</span>`); };
      rec.onend = ()=>finish();
      try{ rec.start(); }catch(_){}
      micBtn.classList.add('listening'); micBtn.innerHTML = `<span class="mic-ico"></span>Listening… release to send`;
    }
    function stop(){ if(!listening) return; listening = false; cm.recognizing = false; cm.t1 = relNow(); resetBtn(); if(rec){ try{ rec.stop(); }catch(_){} } }
    function finish(){
      if(finished) return; finished = true; listening = false; cm.recognizing = false; resetBtn();
      const said = finalText.trim();
      if(!said){ say(`I didn't hear anything. Hold the button and speak up.`); return; }
      const want = tokens(line), heard = new Set(tokens(said));
      const cov = want.length ? want.filter(w=>heard.has(w)).length / want.length : 1;
      if(cov < 0.3){ say(`<span class="heard">“${escapeText(said)}”</span><br>That didn't sound like the line. Try again, reading it as written.`); return; }
      say(`<span class="heard">“${escapeText(said)}”</span> &nbsp;✓ sending…`);
      setTimeout(()=>send(true), 500);
    }
    micBtn.addEventListener('mousedown', (e)=>{ e.preventDefault(); start(); });
    micBtn.addEventListener('mouseup', stop);
    micBtn.addEventListener('mouseleave', stop);
    micBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); start(); }, {passive:false});
    micBtn.addEventListener('touchend',  (e)=>{ e.preventDefault(); stop(); });
  }

  function fmtTime(s){ s = Math.max(0, Math.round(s||0)); const m = Math.floor(s/60), r = s%60; return m + ':' + (r<10?'0':'') + r; }

  /* ---- Volume through the call (results graph) ----
     A waveform: thin rounded bars mirrored around a centre line, evenly spaced
     at a fixed ~7px pitch (3px bar + gap) however wide the panel is, so the bars
     never squash together; the bar count adapts to the width and redraws on
     resize. Each bar = the loudest moment in its slice of the call, colored with
     the SAME scale as the live meter; grey dots = not speaking. The faint band is
     the good zone (mirrored) and red/amber tints mark each volume event.
     bindGraph() adds a playhead that follows playback; clicking jumps there. */
  const BAR_W = 3, BAR_PITCH = 7;
  let graphState = null;
  function graphHTML(log){
    const tl = cm.timeline;
    const total = cm.recEnd ? (cm.recEnd - cm.recStart) / 1000 : (tl.length ? tl[tl.length-1][0] : 0);
    if(tl.length < 2 || total <= 0){ graphState = null; return ''; }
    graphState = { total, log };
    return `
      <div class="dv-section">Your volume through the call</div>
      <div class="dv-graph static" id="dvGraph" data-total="${total.toFixed(2)}" tabindex="-1" role="img"
           aria-label="Waveform of your speaking volume across the call">
        <div class="dv-plot" id="dvPlot">
          <svg id="dvSvg" aria-hidden="true"></svg>
          <div class="dv-dim" id="dvDim"></div>
          <div class="dv-head" id="dvHead"></div>
        </div>
      </div>
      <div class="dv-times"><span>0:00</span><span id="dvTime"><b>0:00</b> / ${fmtTime(total)}</span><span>${fmtTime(total)}</span></div>
      <div class="dv-legend">
        <span><i style="background:${meterColor(0.12)}"></i>Too quiet</span>
        <span><i style="background:${meterColor(0.6)}"></i>Good</span>
        <span><i style="background:${meterColor(1)}"></i>Too loud</span>
        <span><i style="background:#D5DBE3"></i>Not speaking</span>
        <span><i style="background:rgba(79,163,0,.25)"></i>Good zone</span>
      </div>`;
  }
  function drawGraph(){
    const plot = document.getElementById('dvPlot'), svg = document.getElementById('dvSvg');
    if(!plot || !svg || !graphState) return;
    const W = Math.round(plot.clientWidth), H = Math.round(plot.clientHeight);
    if(!W || !H) return;
    const { total, log } = graphState;
    const N = Math.max(20, Math.floor(W / BAR_PITCH)), pitch = W / N;
    const b = Array.from({ length:N }, ()=>({ max:0, spk:false }));
    cm.timeline.forEach(([t, L, s])=>{ const i = Math.min(N-1, Math.floor(t / total * N)); if(L > b[i].max) b[i].max = L; if(s) b[i].spk = true; });
    const mid = H / 2, amp = mid - 2;                 // bar half-height for level 1.0
    const zoneTop = amp * ZONE_HIGH, zoneBot = amp * ZONE_LOW;
    let out = `<rect x="0" y="${(mid-zoneTop).toFixed(1)}" width="${W}" height="${(zoneTop-zoneBot).toFixed(1)}" fill="rgba(79,163,0,.09)"/>`
            + `<rect x="0" y="${(mid+zoneBot).toFixed(1)}" width="${W}" height="${(zoneTop-zoneBot).toFixed(1)}" fill="rgba(79,163,0,.09)"/>`;
    log.filter(e=>e.zone !== 'good').forEach(e=>{
      const x0 = e.t0 / total * W, x1 = Math.max(x0 + pitch, e.t1 / total * W);
      out += `<rect x="${x0.toFixed(1)}" y="0" width="${(x1-x0).toFixed(1)}" height="${H}" rx="4" fill="${e.zone==='quiet' ? 'rgba(208,33,15,.08)' : 'rgba(224,144,10,.11)'}"/>`;
    });
    out += `<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="#E6EAF0" stroke-width="1"/>`;
    b.forEach((k, i)=>{
      const h = k.spk ? Math.max(BAR_W, Math.min(1, k.max) * amp * 2) : BAR_W;
      const x = i * pitch + (pitch - BAR_W) / 2;
      out += `<rect x="${x.toFixed(1)}" y="${(mid - h/2).toFixed(1)}" width="${BAR_W}" height="${h.toFixed(1)}" rx="${BAR_W/2}" fill="${k.spk ? meterColor(k.max) : '#D5DBE3'}"/>`;
    });
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.innerHTML = out;
  }
  // Called by the engine once the results are on screen; redraws on resize
  // (window, fullscreen, or the accordion opening).
  function mountGraph(){
    const plot = document.getElementById('dvPlot'); if(!plot) return;
    drawGraph();
    if('ResizeObserver' in window) new ResizeObserver(()=>drawGraph()).observe(plot);
    else window.addEventListener('resize', drawGraph);
  }
  function bindGraph(audio){
    const g = document.getElementById('dvGraph'), plot = document.getElementById('dvPlot'); if(!g || !plot || !audio) return;
    const total = parseFloat(g.dataset.total) || 0; if(!total) return;
    const head = document.getElementById('dvHead'), dim = document.getElementById('dvDim'), tl = document.getElementById('dvTime');
    g.classList.remove('static');
    g.setAttribute('tabindex', '0'); g.setAttribute('role', 'slider');
    g.setAttribute('aria-label', 'Call recording position. Click, or use the arrow keys, to move through your call.');
    g.setAttribute('aria-valuemin', '0'); g.setAttribute('aria-valuemax', String(Math.round(total)));
    const paint = ()=>{
      const t = Math.min(total, Math.max(0, audio.currentTime || 0)), x = t / total * 100;
      head.style.left = x.toFixed(2) + '%'; dim.style.left = x.toFixed(2) + '%';
      if(tl) tl.innerHTML = `<b>${fmtTime(t)}</b> / ${fmtTime(total)}`;
      g.setAttribute('aria-valuenow', String(Math.round(t))); g.setAttribute('aria-valuetext', fmtTime(t));
    };
    let raf = null;
    const loop = ()=>{ paint(); if(!audio.paused && !audio.ended) raf = requestAnimationFrame(loop); };
    audio.addEventListener('play', ()=>{ cancelAnimationFrame(raf); loop(); });
    ['pause','seeked','timeupdate','ended'].forEach(ev => audio.addEventListener(ev, paint));
    const seekTo = t => { try{ audio.currentTime = Math.max(0, Math.min(total, t)); }catch(_){} paint(); };
    g.addEventListener('click', e => { const r = plot.getBoundingClientRect(); if(e.clientX >= r.left) seekTo((e.clientX - r.left) / r.width * total); });
    g.addEventListener('keydown', e => {
      if(e.key === 'ArrowRight'){ e.preventDefault(); seekTo((audio.currentTime||0) + 5); }
      else if(e.key === 'ArrowLeft'){ e.preventDefault(); seekTo((audio.currentTime||0) - 5); }
      else if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); audio.paused ? audio.play().catch(()=>{}) : audio.pause(); }
    });
    document.querySelectorAll('.dv-ev[data-t]').forEach(btn => {
      btn.classList.remove('static'); btn.disabled = false;
      btn.onclick = ()=>{ seekTo(Math.max(0, parseFloat(btn.dataset.t) - 0.3)); audio.play().catch(()=>{}); };
    });
    // Chrome's recorder files report no length until played through; force it so
    // seeking (clicks on the graph / events) works right away.
    const fixDuration = ()=>{
      if(audio.duration !== Infinity) return;
      const back = ()=>{ audio.removeEventListener('durationchange', back); audio.currentTime = 0; paint(); };
      audio.addEventListener('durationchange', back);
      audio.currentTime = 1e101;
    };
    if(audio.readyState >= 1) fixDuration(); else audio.addEventListener('loadedmetadata', fixDuration, { once:true });
    paint();
  }

  /* ---- Why the mic didn't start, in plain words ----
     getUserMedia fails the same way (NotAllowedError, no prompt) whether the
     learner said no, Chrome's site setting blocks it, or the page this activity
     is EMBEDDED in (e.g. a course iframe) doesn't grant microphone access. That
     last case can't be fixed from Chrome settings, so we check it first. The
     small code line lets L&D see exactly what the browser reported. */
  function embeddedBlocked(){
    try{
      const fp = document.permissionsPolicy || document.featurePolicy;
      return !!(fp && fp.allowsFeature && !fp.allowsFeature('microphone'));
    }catch(_){ return false; }
  }
  async function micErrorMessage(err){
    const name = (err && err.name) || 'Error';
    const red = t => `<span style="color:#C81C0F;font-weight:700">${t}</span>`;
    const embedded = embeddedBlocked();
    let msg;
    if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      msg = red("This page can't use a microphone.") + " Browsers only allow microphones on secure (https) pages.";
    } else if(embedded){
      msg = red("The course page this activity is in doesn't allow microphone use.") + " Your browser blocks it without asking, so your Chrome settings aren't the cause.";
    } else if(name==='NotFoundError' || name==='OverconstrainedError'){
      msg = red("No microphone found.") + " Plug in your headset, then try again.";
    } else if(name==='NotReadableError' || name==='AbortError' || name==='TrackStartError'){
      msg = red("Your microphone is busy.") + " Another app may be using it (for example Zoom or Teams). Close it, then try again.";
    } else if(name==='NotAllowedError' || name==='SecurityError' || name==='PermissionDeniedError'){
      let state = '';
      try{ state = (await navigator.permissions.query({ name:'microphone' })).state; }catch(_){}
      msg = state==='denied'
        ? red("Chrome is blocking the microphone for this page.") + " In Chrome, go to <b>Settings › Privacy and security › Site settings › Microphone</b>, remove this page from the blocked list, then reload."
        : red("Microphone permission wasn't given.") + " Try again and choose <b>Allow</b> when your browser asks.";
    } else {
      msg = red("The microphone couldn't start.");
    }
    return msg + `<span class="mc-code">Browser reported: ${escapeText(name)}${embedded ? ' (embedded page blocks microphone)' : ''}</span>`;
  }

  function shortLabel(ch){
    const t = String(ch.text||'').replace(/\[action\]/gi,'').trim();
    return t.length>48 ? t.slice(0,46)+'…' : t;
  }
  function escapeText(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ---- End-of-call projection summary (feeds the results "Voice and Projection" panel) ----
     Every spoken response (and every Expert line said aloud) is placed in a
     zone: too quiet, good, or too loud. Each one outside the good zone is a
     VOLUME EVENT, listed with the screen it happened on, so a learner who
     whispered half the time and shouted the other half sees exactly where, and
     isn't told "well projected" because the two averaged out. The overall
     rating comes from those events, not from one call-wide average. */
  function delivery(){
    const log = cm.volLog.slice();
    const spoken = log.length;
    if(!spoken){
      return { spoken:0, events:0, quiet:0, loud:0, rating:'', html:
        `<p class="dv-none">No spoken responses were captured this time. `+
        `Try it again with your headset microphone on to get projection feedback.</p>` };
    }
    const quiet = log.filter(e=>e.zone==='quiet').length, loud = log.filter(e=>e.zone==='loud').length;
    const events = quiet + loud;
    let rating, cls, note;
    if(!events){ rating='Well projected'; cls='good';
      note='Every spoken response stayed in the good volume zone. Your voice carried clearly across the call. Great job!'; }
    else if(quiet && loud){ rating='Inconsistent volume'; cls='low';
      note='Your volume swung between too quiet and too loud. Aim for the same steady, clear volume on every response.'; }
    else if(quiet){ const most = quiet/spoken >= 0.5; rating = most ? 'Too quiet overall' : 'A bit quiet in places'; cls = most ? 'low' : 'mid';
      note = most ? 'Most of your responses were too quiet. Speak up so the user hears you clearly.'
                  : 'Some of your responses dropped below the good volume zone. Keep your volume up on every response.'; }
    else { const most = loud/spoken >= 0.5; rating = most ? 'Too loud overall' : 'A bit loud in places'; cls = most ? 'low' : 'mid';
      note = most ? 'Most of your responses were louder than they needed to be. Ease off a little so you sound calm and in control.'
                  : 'Some of your responses went above the good volume zone. Ease off a little on those.'; }
    const clip = (s, n) => { s = String(s||'').replace(/\s+/g,' ').trim(); return s.length > n ? s.slice(0, n-1) + '…' : s; };
    const evItems = log.map((e, i)=>({ e, n:i+1 })).filter(x=>x.e.zone !== 'good').map(({ e, n })=>`
        <li><button class="dv-ev static" type="button" data-t="${e.t0.toFixed(2)}" disabled
              aria-label="Response ${n}, ${e.zone==='quiet'?'too quiet':'too loud'}, at ${fmtTime(e.t0)}. Play this moment.">
          <span class="dv-ev-tag ${e.zone}">${e.zone==='quiet' ? 'Too quiet' : 'Too loud'}</span>
          <span class="dv-ev-where">Response ${n} · ${escapeText(clip(e.prompt, 60))}</span>
          <span class="dv-ev-time">${fmtTime(e.t0)}</span>
          <span class="dv-ev-said">“${escapeText(clip(e.text, 110))}”</span>
        </button></li>`).join('');
    return { spoken, events, quiet, loud, rating, html:
      `<div class="dv-wrap">
         <div class="dv-top"><span class="dv-pill ${cls}">${rating}</span>
           <span class="dv-meta">${spoken} spoken response${spoken>1?'s':''} · ${events} volume event${events===1?'':'s'}</span></div>
         <p class="dv-note">${note}</p>
         <div class="dv-section">Volume events<span class="dv-ev-count">${events}</span></div>
         ${events
           ? `<p class="dv-ev-sub">Each time you spoke outside the good volume zone (${quiet} too quiet, ${loud} too loud). Click one to hear that moment.</p><ol class="dv-ev-list">${evItems}</ol>`
           : `<p class="dv-ev-sub">None. Every response stayed in the good volume zone.</p>`}
         ${graphHTML(log)}
         <div class="dv-playback" id="callPlayback">
           <div class="dv-pb-label">Listen back to your call</div>
           <div class="dv-pb-slot" id="callPlaybackSlot">
             <span class="dv-pb-prep">Preparing your recording…</span>
           </div>
         </div>
       </div>` };
  }

  /* ---- Pre-call mic test ----
     A separate, short-lived stream used only for the check before the call. It
     drives a meter and reports once the learner's voice clears the minimum-
     projection mark (0.22). It is NOT recorded, and stop() releases the mic.
     Permission granted here carries over, so the in-call mic won't prompt again. */
  function micCheck(fillEl, onHeard){
    let stream=null, ctx=null, raf=null, stopped=false, heard=false;
    const stop = ()=>{
      stopped = true; if(raf) cancelAnimationFrame(raf);
      try{ (stream && stream.getTracks() || []).forEach(t=>t.stop()); }catch(_){}
      try{ if(ctx) ctx.close(); }catch(_){}
    };
    const ready = (async ()=>{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unavailable');
      stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      if(stopped){ stop(); return; }
      const Ctx = window.AudioContext || window.webkitAudioContext; ctx = new Ctx();
      const an = ctx.createAnalyser(); an.fftSize = 1024;
      ctx.createMediaStreamSource(stream).connect(an);
      const data = new Uint8Array(an.fftSize);
      let smoothed = 0, framesAbove = 0;
      const step = ()=>{
        an.getByteTimeDomainData(data);
        let sum=0; for(let i=0;i<data.length;i++){ const v=(data[i]-128)/128; sum+=v*v; }
        const L = Math.min(1, Math.sqrt(sum/data.length) * 3.2);   // same scale as the in-call meter
        smoothed += (L - smoothed) * 0.2;
        fillEl.style.width = Math.round(smoothed*100) + '%';
        fillEl.style.background = meterColor(smoothed);
        if(smoothed >= 0.22 && ++framesAbove >= 8 && !heard){ heard = true; onHeard(); }
        raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    })();
    return { ready, stop };
  }

  window.CallMode = { attach, delivery, stopRecording, micCheck, micErrorMessage, embeddedBlocked,
                      sayLine, shouldSpeak, setVoiceMode, bindGraph, mountGraph, supported: !!SR };
})();
</script>
</body>
</html>
