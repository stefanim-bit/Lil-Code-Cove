     learner finished saying it under the old hold-to-talk flow). */
  function bindToggleMic(micBtn, o){
    let rec=null, finalText='', interim='', listening=false, starting=false, ended=true, errored=false, capturing=false;
    const idle = ()=>{ micBtn.classList.remove('listening'); micBtn.setAttribute('aria-pressed','false');
      micBtn.innerHTML = `<span class="mic-ico"></span>${o.idleLabel}`; };
    const live = ()=>{ micBtn.classList.add('listening'); micBtn.setAttribute('aria-pressed','true');
      micBtn.innerHTML = `<span class="mic-ico"></span>Listening… click to stop`; };
    const checking = ()=>{ micBtn.innerHTML = `<span class="mic-ico"></span>Checking microphone…`; };
    // Ends this turn's capture: freeze the clock, pause the recording, release the mic.
    const endCapture = ()=>{
      if(!capturing) return; capturing=false;
      cm.recognizing=false; cm.t1=relNow();
      if(cm.segStart){ cm.recAccum += (performance.now() - cm.segStart) / 1000; cm.segStart = 0; }
      recPause(); closeMic();
    };
    function done(){
      if(ended) return; ended=true; listening=false; endCapture();
      if(!micBtn.isConnected) return;          // screen moved on (e.g. a response was tapped)
      idle();
      if(!errored) o.onDone(finalText.trim());   // an error never sends a half-heard answer
    }
    function open(){
      rec = new SR(); rec.lang='en-US'; rec.interimResults=true; rec.continuous=true; rec.maxAlternatives=1;
      rec.onresult = (e)=>{
        if(!micBtn.isConnected){ listening=false; try{ rec.abort(); }catch(_){} return; }
        interim='';
        for(let i=e.resultIndex;i<e.results.length;i++){
          const r=e.results[i];
          if(r.isFinal) finalText += r[0].transcript + ' ';
          else interim += r[0].transcript;
        }
        o.onHeard((finalText+interim).trim());
      };
      rec.onerror = (e)=>{
        // Silence / our own restart: keep listening. Anything else ends the turn.
        if(e.error==='no-speech' || e.error==='aborted') return;
        listening=false; errored=true; if(o.onError) o.onError(e.error);
      };
      rec.onend = ()=>{
        if(interim){ finalText += interim + ' '; interim=''; }
        if(listening && micBtn.isConnected){ try{ open(); return; }catch(_){ listening=false; } }
        done();
      };
      rec.start();
    }
    async function start(){
      if(listening || starting) return;
      starting=true; checking();
      const ok = await o.beforeStart(); starting=false;
      if(!ok || !micBtn.isConnected){ if(ok) closeMic(); if(micBtn.isConnected) idle(); return; }
      cm.segStart = performance.now(); recResume(); capturing = true;
      finalText=''; interim=''; cm.peak=0; cm.curFrames=[]; cm.t0=relNow(); cm.recognizing=true;
      listening=true; ended=false; errored=false;
      if(o.onStart) o.onStart();
      try{ open(); }catch(_){ listening=false; done(); return; }
      live();
    }
    function stop(){
      if(!listening) return; listening=false;
      idle();
      try{ rec.stop(); }catch(_){ done(); }   // final results arrive, then onend → done()
      endCapture();                            // mic off the moment they click stop
    }
    idle();
    micBtn.addEventListener('click', (e)=>{ e.preventDefault(); listening ? stop() : start(); });
    // Lets the engine switch this mic off when a response is tapped mid-listen.
    cm.stopMic = ()=>{ if(!listening) return; listening=false; errored=true; try{ rec.abort(); }catch(_){} done(); };
  }
  function stopMic(){ if(cm.stopMic) cm.stopMic(); }

  /* ---- Score one spoken response ---- */
  function speakingLevel(frames){
    const voiced = frames.filter(v => v >= 0.10).sort((a,b)=>a-b);   // ignore pauses/breaths between words
    if(!voiced.length) return frames.length ? Math.max(...frames) : 0;
    return voiced[Math.min(voiced.length - 1, Math.floor(voiced.length * 0.9))];
  }
  // Only quiet is flagged. Loud counts as good (testing: "a bit loud" felt wrong at normal volume).
  function zoneOf(L){ return L < ZONE_LOW ? 'quiet' : 'good'; }
  function logSpoken(kind, prompt, text){
    const lvl = speakingLevel(cm.curFrames);
    cm.volLog.push({ kind, prompt:String(prompt||''), text:String(text||''), level:lvl, peak:cm.peak,
                     zone:zoneOf(lvl), t0:cm.t0, t1:cm.t1 || relNow() });
    cm.voiceMode = true;   // they're taking the call by voice
  }

  /* ---- Expert follow-up line: the learner says it aloud ----
     When a pick triggers another Expert line (e.g. "Expert: Love it, I'll keep
     this efficient then."), the engine pauses and shows that line here. The
     learner clicks the mic, says it, and clicks again to stop; any reasonable attempt is accepted (it
     isn't graded), and it counts toward Voice and Projection like any response.
     "Send without saying it" always lets them move on. */
  function shouldSpeak(){ return !!SR && cm.voiceMode === true && !embeddedBlocked(); }
  function setVoiceMode(v){ cm.voiceMode = !!v; }
  function sayLine(panel, line, onDone){
    if(!panel){ onDone(); return; }
    panel.innerHTML = `
      <div class="voice">
        <div class="voice-row">
          <button class="mic-btn" id="micBtn" type="button" aria-pressed="false"><span class="mic-ico"></span>Click to start speaking</button>
          <div class="meter"><div class="meter-fill" id="meterFill"></div><div class="meter-mark" style="left:22%"></div></div>
        </div>
        <p class="voice-status" id="vStatus">Click the mic, say the line above as you would on a real call, then click it again to stop.</p>
        <div class="voice-confirm"><button class="vc-no" id="vSkip" type="button">Send without saying it</button></div>
      </div>`;
    cm.meterFill = document.getElementById('meterFill');
    const micBtn = document.getElementById('micBtn'), vStatus = document.getElementById('vStatus');
    let sent = false;
    const say = h => { vStatus.innerHTML = h; };
    const send = (spoken)=>{ if(sent) return; sent = true; if(spoken) logSpoken('line', 'Your follow-up line', line); onDone(); };
    document.getElementById('vSkip').onclick = ()=>send(false);
    function finish(said){
      if(sent) return;
      if(!said){ say(`I didn't hear anything. Click the mic, speak up, then click it again to stop.`); return; }
      const want = tokens(line), heard = new Set(tokens(said));
      const cov = want.length ? want.filter(w=>heard.has(w)).length / want.length : 1;
      if(cov < 0.3){ say(`<span class="heard">“${escapeText(said)}”</span><br>That didn't sound like the line. Try again, reading it as written.`); return; }
      say(`<span class="heard">“${escapeText(said)}”</span> &nbsp;Sending…`);
      setTimeout(()=>send(true), 500);
    }
    bindToggleMic(micBtn, {
      idleLabel: 'Click to start speaking',
      beforeStart: async ()=>{
        if(sent) return false;
        const ok = await openMic(()=>say('Your browser will ask to use your microphone. Choose <b>Allow</b> to start speaking.'));
        if(!ok){ micErrorMessage(cm.lastError).then(h=>say(h + ' Click the mic to try again, or use Send without saying it to continue.')); return false; }
        return true;
      },
      onStart: ()=>say('Listening… Say the line, then click the mic again to stop.'),
      onHeard: t=>say(`<span class="heard">“${escapeText(t)}”</span>`),
      onError: err=>say(`<span style="color:#C81C0F">Didn't catch that (${escapeText(err)}). Click the mic to try again.</span>`),
      onDone: finish
    });
  }

  function fmtTime(s){ s = Math.max(0, Math.round(s||0)); const m = Math.floor(s/60), r = s%60; return m + ':' + (r<10?'0':'') + r; }

  /* ---- Volume through the call (results graph) ----
     A waveform: thin rounded bars mirrored around a centre line, evenly spaced
     at a fixed ~7px pitch (3px bar + gap) however wide the panel is, so the bars
     never squash together; the bar count adapts to the width and redraws on
     resize. Each bar = the loudest moment in its slice of the call, colored with
     the SAME scale as the live meter; grey dots = not speaking. The faint band is
     the good zone (mirrored) and red/amber tints mark each volume event.
     bindGraph() adds a playhead that follows playback; clicking jumps there. */
  const BAR_W = 3, BAR_PITCH = 7;
  let graphState = null;
  function graphHTML(log){
    const tl = cm.timeline;
    const total = cm.recEnd ? cm.recAccum : (tl.length ? tl[tl.length-1][0] : 0);
    if(tl.length < 2 || total <= 0){ graphState = null; return ''; }
    graphState = { total, log };
    return `
      <div class="dv-section">Your volume through the call</div>
      <div class="dv-graph static" id="dvGraph" data-total="${total.toFixed(2)}" tabindex="-1" role="img"
           aria-label="Waveform of your speaking volume across the call">
        <div class="dv-plot" id="dvPlot">
          <svg id="dvSvg" aria-hidden="true"></svg>
          <div class="dv-dim" id="dvDim"></div>
          <div class="dv-head" id="dvHead"></div>
        </div>
      </div>
      <div class="dv-times"><span>0:00</span><span id="dvTime"><b>0:00</b> / ${fmtTime(total)}</span><span>${fmtTime(total)}</span></div>
      <div class="dv-legend">
        <span><i style="background:${meterColor(0.12)}"></i>Quiet</span>
        <span><i style="background:${meterColor(0.6)}"></i>Good</span>
        <span><i style="background:${meterColor(1)}"></i>Loud</span>
        <span><i style="background:rgba(79,163,0,.25)"></i>Good zone</span>
      </div>`;
  }
  function drawGraph(){
    const plot = document.getElementById('dvPlot'), svg = document.getElementById('dvSvg');
    if(!plot || !svg || !graphState) return;
    const W = Math.round(plot.clientWidth), H = Math.round(plot.clientHeight);
    if(!W || !H) return;
    const { total, log } = graphState;
    const N = Math.max(20, Math.floor(W / BAR_PITCH)), pitch = W / N;
    const b = Array.from({ length:N }, ()=>({ max:0, spk:false }));
    cm.timeline.forEach(([t, L, s])=>{ const i = Math.min(N-1, Math.floor(t / total * N)); if(L > b[i].max) b[i].max = L; if(s) b[i].spk = true; });
    const mid = H / 2, amp = mid - 2;                 // bar half-height for level 1.0
    const zoneTop = amp * ZONE_HIGH, zoneBot = amp * ZONE_LOW;
    let out = `<rect x="0" y="${(mid-zoneTop).toFixed(1)}" width="${W}" height="${(zoneTop-zoneBot).toFixed(1)}" fill="rgba(79,163,0,.09)"/>`
            + `<rect x="0" y="${(mid+zoneBot).toFixed(1)}" width="${W}" height="${(zoneTop-zoneBot).toFixed(1)}" fill="rgba(79,163,0,.09)"/>`;
    log.filter(e=>e.zone !== 'good').forEach(e=>{
      const x0 = e.t0 / total * W, x1 = Math.max(x0 + pitch, e.t1 / total * W);
      if(e.zone !== 'quiet') return;   // only quiet stretches are tinted; loud is fine
      out += `<rect x="${x0.toFixed(1)}" y="0" width="${(x1-x0).toFixed(1)}" height="${H}" rx="4" fill="rgba(232,195,0,.14)"/>`;
    });
    out += `<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="#E6EAF0" stroke-width="1"/>`;
    b.forEach((k, i)=>{
      const h = k.spk ? Math.max(BAR_W, Math.min(1, k.max) * amp * 2) : BAR_W;
      const x = i * pitch + (pitch - BAR_W) / 2;
      out += `<rect x="${x.toFixed(1)}" y="${(mid - h/2).toFixed(1)}" width="${BAR_W}" height="${h.toFixed(1)}" rx="${BAR_W/2}" fill="${k.spk ? meterColor(k.max) : '#D5DBE3'}"/>`;
    });
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.innerHTML = out;
  }
  // Called by the engine once the results are on screen; redraws on resize
  // (window, fullscreen, or the accordion opening).
  function mountGraph(){
    const plot = document.getElementById('dvPlot'); if(!plot) return;
    drawGraph();
    if('ResizeObserver' in window) new ResizeObserver(()=>drawGraph()).observe(plot);
    else window.addEventListener('resize', drawGraph);
  }
  function bindGraph(audio){
    const g = document.getElementById('dvGraph'), plot = document.getElementById('dvPlot'); if(!g || !plot || !audio) return;
    const total = parseFloat(g.dataset.total) || 0; if(!total) return;
    const head = document.getElementById('dvHead'), dim = document.getElementById('dvDim'), tl = document.getElementById('dvTime');
    g.classList.remove('static');
    g.setAttribute('tabindex', '0'); g.setAttribute('role', 'slider');
    g.setAttribute('aria-label', 'Call recording position. Click, or use the arrow keys, to move through your call.');
    g.setAttribute('aria-valuemin', '0'); g.setAttribute('aria-valuemax', String(Math.round(total)));
    const paint = ()=>{
      const t = Math.min(total, Math.max(0, audio.currentTime || 0)), x = t / total * 100;
      head.style.left = x.toFixed(2) + '%'; dim.style.left = x.toFixed(2) + '%';
      if(tl) tl.innerHTML = `<b>${fmtTime(t)}</b> / ${fmtTime(total)}`;
      g.setAttribute('aria-valuenow', String(Math.round(t))); g.setAttribute('aria-valuetext', fmtTime(t));
    };
    let raf = null;
    const loop = ()=>{ paint(); if(!audio.paused && !audio.ended) raf = requestAnimationFrame(loop); };
    audio.addEventListener('play', ()=>{ cancelAnimationFrame(raf); loop(); });
    ['pause','seeked','timeupdate','ended'].forEach(ev => audio.addEventListener(ev, paint));
    const seekTo = t => { try{ audio.currentTime = Math.max(0, Math.min(total, t)); }catch(_){} paint(); };
    g.addEventListener('click', e => { const r = plot.getBoundingClientRect(); if(e.clientX >= r.left) seekTo((e.clientX - r.left) / r.width * total); });
    g.addEventListener('keydown', e => {
      if(e.key === 'ArrowRight'){ e.preventDefault(); seekTo((audio.currentTime||0) + 5); }
      else if(e.key === 'ArrowLeft'){ e.preventDefault(); seekTo((audio.currentTime||0) - 5); }
      else if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); audio.paused ? audio.play().catch(()=>{}) : audio.pause(); }
    });
    document.querySelectorAll('.dv-ev[data-t]').forEach(btn => {
      btn.classList.remove('static'); btn.disabled = false;
      btn.onclick = ()=>{ seekTo(Math.max(0, parseFloat(btn.dataset.t) - 0.3)); audio.play().catch(()=>{}); };
    });
    // Chrome's recorder files report no length until played through; force it so
    // seeking (clicks on the graph / events) works right away.
    const fixDuration = ()=>{
      if(audio.duration !== Infinity) return;
      const back = ()=>{ audio.removeEventListener('durationchange', back); audio.currentTime = 0; paint(); };
      audio.addEventListener('durationchange', back);
      audio.currentTime = 1e101;
    };
    if(audio.readyState >= 1) fixDuration(); else audio.addEventListener('loadedmetadata', fixDuration, { once:true });
    paint();
  }

  /* ---- Why the mic didn't start, in plain words ----
     getUserMedia fails the same way (NotAllowedError, no prompt) whether the
     learner said no, Chrome's site setting blocks it, or the page this activity
     is EMBEDDED in (e.g. a course iframe) doesn't grant microphone access. That
     last case can't be fixed from Chrome settings, so we check it first. The
     small code line lets L&D see exactly what the browser reported. */
  function embeddedBlocked(){
    try{
      const fp = document.permissionsPolicy || document.featurePolicy;
      return !!(fp && fp.allowsFeature && !fp.allowsFeature('microphone'));
    }catch(_){ return false; }
  }
  async function micErrorMessage(err){
    const name = (err && err.name) || 'Error';
    const red = t => `<span style="color:#C81C0F;font-weight:700">${t}</span>`;
    const embedded = embeddedBlocked();
    let msg;
    if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      msg = red("This page can't use a microphone.") + " Browsers only allow microphones on secure (https) pages.";
    } else if(embedded){
      msg = red("The course page this activity is in doesn't allow microphone use.") + " Your browser blocks it without asking, so your Chrome settings aren't the cause.";
    } else if(name==='NotFoundError' || name==='OverconstrainedError'){
      msg = red("No microphone found.") + " Plug in your headset, then try again.";
    } else if(name==='NotReadableError' || name==='AbortError' || name==='TrackStartError'){
      msg = red("Your microphone is busy.") + " Another app may be using it (for example Zoom or Teams). Close it, then try again.";
    } else if((name==='NotAllowedError' || name==='SecurityError') && /system/i.test((err && err.message) || '')){
      // macOS/Windows privacy settings block Chrome itself, so Chrome never asks.
      msg = red("Your computer is blocking Chrome from using the microphone.") + " On a Mac, go to <b>System Settings › Privacy &amp; Security › Microphone</b> and turn on Google Chrome, then quit and reopen Chrome. On Windows, go to <b>Settings › Privacy › Microphone</b>.";
    } else if((name==='NotAllowedError' || name==='SecurityError') && (location.origin === 'null' || !location.origin)){
      // Opaque origin: the host serves this page sandboxed, which blocks the mic without a prompt.
      msg = red("The site hosting this activity blocks microphone use.") + " Your Chrome settings aren't the cause.";
    } else if(name==='NotAllowedError' || name==='SecurityError' || name==='PermissionDeniedError'){
      let state = '';
      try{ state = (await navigator.permissions.query({ name:'microphone' })).state; }catch(_){}
      msg = state==='denied'
        ? red("Chrome is blocking the microphone for this page.") + " In Chrome, go to <b>Settings › Privacy and security › Site settings › Microphone</b>, remove this page from the blocked list, then reload."
        : red("Microphone permission wasn't given.") + " Try again and choose <b>Allow</b> when your browser asks.";
    } else {
      msg = red("The microphone couldn't start.");
    }
    // Extra detail for L&D troubleshooting: Chrome's own message, the permission
    // state, and the page's origin ("null" = sandboxed by the host).
    let perm = '';
    try{ perm = (await navigator.permissions.query({ name:'microphone' })).state; }catch(_){ perm = 'n/a'; }
    let inFrame = false; try{ inFrame = window.self !== window.top; }catch(_){ inFrame = true; }
    const detail = [err && err.message ? '"' + err.message + '"' : '', 'permission: ' + perm, 'origin: ' + (location.origin || 'none'), inFrame ? 'in a frame' : 'own tab'].filter(Boolean).join(' · ');
    return msg + `<span class="mc-code">Browser reported: ${escapeText(name)}${embedded ? ' (embedded page blocks microphone)' : ''}<br>${escapeText(detail)}</span>`;
  }

  function shortLabel(ch){
    const t = String(ch.text||'').replace(/\[action\]/gi,'').trim();
    return t.length>48 ? t.slice(0,46)+'…' : t;
  }
  function escapeText(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ---- End-of-call projection summary (feeds the results "Voice and Projection" panel) ----
     Every spoken response (and every Expert line said aloud) is placed in a
     zone: too quiet, good, or too loud. Each one outside the good zone is a
     VOLUME EVENT, listed with the screen it happened on, so a learner who
     whispered half the time and shouted the other half sees exactly where, and
     isn't told "well projected" because the two averaged out. The overall
     rating comes from those events, not from one call-wide average. */
  function delivery(){
    const log = cm.volLog.slice();
    const spoken = log.length;
    if(!spoken){
      return { spoken:0, events:0, quiet:0, loud:0, rating:'', html:
        `<p class="dv-none">No spoken responses were captured this time. `+
        `Try it again with your headset microphone on to get projection feedback.</p>` };
    }
    const quiet = log.filter(e=>e.zone==='quiet').length, loud = log.filter(e=>e.zone==='loud').length;
    const events = quiet + loud;
    let rating, cls, note;
    if(!events){ rating='Well projected'; cls='good';
      note='Every spoken response stayed in the good volume zone. Your voice carried clearly across the call. Great job!'; }
    else if(quiet && loud){ rating='Inconsistent volume'; cls='low';
      note='Your volume swung between too quiet and too loud. Aim for the same steady, clear volume on every response.'; }
    else if(quiet){ const most = quiet/spoken >= 0.5; rating = most ? 'Too quiet overall' : 'A bit quiet in places'; cls = most ? 'low' : 'mid';
      note = most ? 'Most of your responses were too quiet. Speak up so the user hears you clearly.'
                  : 'Some of your responses dropped below the good volume zone. Keep your volume up on every response.'; }
    else { const most = loud/spoken >= 0.5; rating = most ? 'Too loud overall' : 'A bit loud in places'; cls = most ? 'low' : 'mid';
      note = most ? 'Most of your responses were louder than they needed to be. Ease off a little so you sound calm and in control.'
                  : 'Some of your responses went above the good volume zone. Ease off a little on those.'; }
    const clip = (s, n) => { s = String(s||'').replace(/\s+/g,' ').trim(); return s.length > n ? s.slice(0, n-1) + '…' : s; };
    const evItems = log.map((e, i)=>({ e, n:i+1 })).filter(x=>x.e.zone !== 'good').map(({ e, n })=>`
        <li><button class="dv-ev static" type="button" data-t="${e.t0.toFixed(2)}" disabled
              aria-label="Response ${n}, ${e.zone==='quiet'?'too quiet':'too loud'}, at ${fmtTime(e.t0)}. Play this moment.">
          <span class="dv-ev-tag ${e.zone}">${e.zone==='quiet' ? 'Too quiet' : 'Too loud'}</span>
          <span class="dv-ev-where">Response ${n} · ${escapeText(clip(e.prompt, 60))}</span>
          <span class="dv-ev-time">${fmtTime(e.t0)}</span>
          <span class="dv-ev-said">“${escapeText(clip(e.text, 110))}”</span>
        </button></li>`).join('');
    return { spoken, events, quiet, loud, rating, html:
      `<div class="dv-wrap">
         <div class="dv-top"><span class="dv-pill ${cls}">${rating}</span>
           <span class="dv-meta">${spoken} spoken response${spoken>1?'s':''} · ${events} volume event${events===1?'':'s'}</span></div>
         <p class="dv-note">${note}</p>
         <div class="dv-section">Volume events<span class="dv-ev-count">${events}</span></div>
         ${events
           ? `<p class="dv-ev-sub">Each time you spoke too quietly (${quiet}). Click one to hear that moment.</p><ol class="dv-ev-list">${evItems}</ol>`
           : `<p class="dv-ev-sub">None. Every response stayed in the good volume zone.</p>`}
         ${graphHTML(log)}
         <div class="dv-playback" id="callPlayback">
           <div class="dv-pb-label">Listen back to your call</div>
           <div class="dv-pb-slot" id="callPlaybackSlot">
             <span class="dv-pb-prep">Preparing your recording…</span>
           </div>
         </div>
       </div>` };
  }

  /* ---- Pre-call mic test ----
     A separate, short-lived stream used only for the check before the call. It
     drives a meter and reports once the learner's voice clears the minimum-
     projection mark (0.22). It is NOT recorded, and stop() releases the mic.
     Permission granted here carries over, so the in-call mic won't prompt again. */
  function micCheck(fillEl, onHeard){
    let stream=null, ctx=null, raf=null, stopped=false, heard=false;
    const stop = ()=>{
      stopped = true; if(raf) clearTimeout(raf);
      try{ (stream && stream.getTracks() || []).forEach(t=>t.stop()); }catch(_){}
      try{ if(ctx) ctx.close(); }catch(_){}
    };
    const ready = (async ()=>{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unavailable');
      stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      if(stopped){ stop(); return; }
      const Ctx = window.AudioContext || window.webkitAudioContext; ctx = new Ctx();
      wakeAudio(ctx);
      const an = ctx.createAnalyser(); an.fftSize = 1024;
      ctx.createMediaStreamSource(stream).connect(an);
      const data = new Uint8Array(an.fftSize);
      let smoothed = 0, framesAbove = 0;
      const step = ()=>{
        an.getByteTimeDomainData(data);
        let sum=0; for(let i=0;i<data.length;i++){ const v=(data[i]-128)/128; sum+=v*v; }
        const L = Math.min(1, Math.sqrt(sum/data.length) * MIC_GAIN);   // same scale as the in-call meter
        smoothed += (L - smoothed) * 0.2;
        fillEl.style.width = Math.round(smoothed*100) + '%';
        fillEl.style.background = meterColor(smoothed);
        // Testing update: passes at a slightly quieter voice (was 0.22). This only
        // affects the mic test; in-call volume scoring is unchanged.
        if(smoothed >= 0.16 && ++framesAbove >= 8 && !heard){ heard = true; onHeard(); }
        if(!stopped) raf = setTimeout(step, 33);
      };
      // A timer, not requestAnimationFrame: some course frames pause animation
      // frames, which would freeze the meter even while the mic is live.
      raf = setTimeout(step, 33);
    })();
    return { ready, stop };
  }

  window.CallMode = { attach, delivery, stopRecording, stopMic, micCheck, micErrorMessage, embeddedBlocked,
                      sayLine, shouldSpeak, setVoiceMode, bindGraph, mountGraph, supported: !!SR };
})();
</script>
</body>
