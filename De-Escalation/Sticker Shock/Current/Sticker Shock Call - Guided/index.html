            <span class="sheet-chev" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <div class="sheet-body"><div id="composer"></div></div>
        </div>
      </section>
      </div>`;
    chatEl = document.getElementById('chat');
    lastBubbleKind = null;   // fresh chat — start a new speaker run
    composerEl = document.getElementById('composer');
    const sheetHandle = document.getElementById('sheetHandle');
    if(sheetHandle) sheetHandle.onclick = toggleSheet;
    // The sheet grows/shrinks as its choices render (they're appended after it
    // opens). Re-sync the chat's reserved bottom space whenever its size changes,
    // so the newest messages always sit just above the choices.
    const sheetEl = document.getElementById('sheet');
    if(sheetEl && 'ResizeObserver' in window){
      new ResizeObserver(()=>syncChatBottom()).observe(sheetEl);
    }
    document.getElementById('endBtn').onclick = confirmEnd;
    // Fullscreen toggle — expand the whole sim (wrapper incl. the floating icon)
    // via the Fullscreen API, swapping the maximize/minimize icon on change.
    const fsBtn = document.getElementById('fsBtn'), simWrap = document.getElementById('simWrap');
    if(fsBtn && simWrap && document.fullscreenEnabled){
      fsBtn.onclick = toggleAppFullscreen;
      syncFsButtons();
    } else if(fsBtn){ fsBtn.style.display='none'; }
    renderHelpers();
    const infoBtn = document.getElementById('infoBtn'); if(infoBtn) infoBtn.onclick = showCallInfo;
    // TONY TEST: point out Check Resources + Full screen before the first line.
    // The call (and its timer) starts when the learner clicks "Start the call".
    showCoachMarks(()=>{
      startTimer();
      renderScreen(S.start, { animateSpeaker:false });  // first line appears immediately
    });
  }

  /* First-call coach marks: a dimmed panel and a short guided tour, one callout
     at a time, anchored to the REAL buttons (which stay lit and clickable):
       1 Full screen → 2 Check Resources → "This is just practice" + Start.
     (Replaces the old "Your tools" intro slide.)
     Positions are measured from the live DOM so they track any width. */
  function showCoachMarks(onDone){
    const wrap = document.getElementById('simWrap');
    if(!wrap){ onDone(); return; }
    const resBtn = document.querySelector('#helperbar .hbtn');
    const fsBtn = document.getElementById('fsBtn');
    const steps = [];
    if(fsBtn && fsBtn.style.display !== 'none') steps.push({ el:fsBtn, title:'Full screen', text: document.fullscreenElement
      ? "You're in full screen, so the conversation and your responses have more room. Click this button or press Esc to exit."
      : 'Expand the call so the conversation and your responses have more room. We recommend turning it on now. Click again or press Esc to exit.' });
    if(resBtn) steps.push({ el:resBtn, title:'Check Resources', text:'Your help docs live here. Each article opens in a new tab: read it, then come back. Only articles opened here count toward your score.' });
    const layer = document.createElement('div');
    layer.innerHTML = `<div class="coach-scrim"></div>`;
    wrap.appendChild(layer);
    let i = 0, lit = null;
    const total = steps.length;
    const show = ()=>{
      [...layer.querySelectorAll('.coach,.coach-done')].forEach(n=>n.remove());
      if(lit){ lit.classList.remove('lift'); lit = null; }
      if(i >= total){
        const card = document.createElement('div');
        card.className = 'coach-done';
        card.innerHTML = `<p>${S.guided
            ? `<b>This is a guided call.</b> If a response could be stronger, you'll get coaching and one chance to try again. Your full results come at the end.`
            : `<b>This is just practice.</b> Nothing is graded during the call. Your feedback comes at the end.`}</p>
          <button class="btn btn-dark btn-wide" id="coachGo" type="button">Start the call${ARROW_SVG}</button>`;
        layer.appendChild(card);
        card.querySelector('#coachGo').onclick = ()=>{ layer.remove(); onDone(); };
        card.querySelector('#coachGo').focus();
        return;
      }
      const st = steps[i], box = wrap.getBoundingClientRect(), r = st.el.getBoundingClientRect();
      lit = st.el; lit.classList.add('lift');
      const t = document.createElement('div');
      t.className = 'coach';
      t.innerHTML = `<b>${i+1} of ${total} · ${st.title}</b>${st.text}
        <div style="margin-top:0.625rem;text-align:right"><button class="btn btn-ghost" type="button" style="display:inline-flex;height:1.875rem">Next</button></div>`;
      layer.appendChild(t);
      const w = Math.min(280, box.width - 32);
      t.style.width = w + 'px';
      t.style.top  = (r.bottom - box.top + 12) + 'px';
      const left = Math.max(16, Math.min(box.width - w - 16, r.left - box.left + r.width/2 - w + 28));
      t.style.left = left + 'px';
      // point the arrow at the button's centre
      t.style.setProperty('--ax', Math.max(12, Math.min(w - 26, r.left - box.left + r.width/2 - left - 7)) + 'px');
      const nb = t.querySelector('button'); nb.onclick = ()=>{ i++; show(); }; nb.focus();
    };
    show();
  }

  /* Info button: the intro's key points in one panel, available any time
     during the call without leaving it (testing: instructions should stay reachable). */

      <h4>Responses</h4>
      <div class="demo-grid">
        <div class="demo-card">
          <h3><span class="demo-ico say">${MIC_SVG}</span>Say it</h3>
          <p>What you'd say to ${name}. Click the blue mic button, read one aloud, then click it again to stop.</p>
        </div>
        <div class="demo-card">
          <h3><span class="demo-ico click">${CLICK_SVG}</span>Click it</h3>

        <p><b>Check Resources</b> opens your help articles in a new tab. Only articles opened there count.</p>

        </div>
        <div class="demo-card"><ul class="score-list">${rows}</ul></div>

  function confirmEnd(){
    // Ending early is allowed — skips are recoverable, unreached stages simply score 0.
    const dlg = document.createElement('dialog'); dlg.className='modal';
    dlg.innerHTML = `<div class="modal-inner">
        <div class="mhead"><h3>End the call?</h3></div>
        <p style="font-size:0.875rem;color:var(--ink-2);margin:0 0 1rem">You'll go straight to your results. Anything you haven't done yet won't score.</p>
        <div class="actions" style="margin:0">
          <button class="btn btn-dark" id="endYes">End &amp; see results</button>
          <button class="btn btn-ghost" id="endNo">Keep going</button>
        </div></div>`;
    (document.fullscreenElement || document.body).appendChild(dlg); dlg.showModal();
    dlg.querySelector('#endNo').onclick = ()=>{ dlg.close(); dlg.remove(); };
    dlg.querySelector('#endYes').onclick = ()=>{ dlg.close(); dlg.remove(); renderFinal(); };
  }

  /* ---- Bubble markup (shared by the LIVE chat and the END transcript) ----
     'system' bubbles are inline notes (pill), used for both tool/observation
     lines and action notes — anything that isn't a direct spoken quote. */
  function bubbleMarkup(kind, text, metaText, reaction){
    const meta = metaText ? `<div class="meta">${escapeHtml(metaText)}</div>` : '';
    const cls  = 'bubble' + (kind==='system' ? ' action' : '');
    const msgCls = 'msg ' + kind + (reaction ? ' reaction' : '');
    const body = escapeHtml(px(text)).replace(/\n/g,'<br>');
    return `<div class="${msgCls}">${meta}<div class="${cls}">${body}</div></div>`;
  }
  function appendNode(html){
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const node = tmp.firstElementChild;
    chatEl.appendChild(node); chatEl.scrollTop = chatEl.scrollHeight;
    return node;
  }
  /* Group consecutive messages from the SAME speaker: the name label is shown
     only on the FIRST bubble of a run, not repeated on back-to-back messages
     from the same person. System notes are centered and never labeled; they
     also break a run so the next spoken bubble re-shows its name. */
  let lastBubbleKind = null;
  function appendBubble(kind, text, reaction){
    const sameSpeaker = (kind !== 'system' && kind === lastBubbleKind);
    const meta = (kind==='system' || sameSpeaker) ? '' :
      `${kind==='you' ? (firstName()||'You') : U.name} · ${mmss(callSeconds)}`;
    lastBubbleKind = kind;
    return appendNode(bubbleMarkup(kind, text, meta, reaction));
  }
  /* Inline action note: an "[Action]" choice is something the Expert DOES, shown
     as a centered system note in the stream (e.g. "You open User Manager."). */
  function actionNoteText(raw){
    const t = stripAction(px(raw)).trim().replace(/\s+/g,' ');
    const note = 'You ' + t.charAt(0).toLowerCase() + t.slice(1);
    return /[.!?]$/.test(note) ? note : note + '.';
  }
  function appendActionNote(text){ return appendBubble('system', text, true); }

  /* Inline screen image: a screenshot shown in the stream for a given screen
     (e.g. the Layers panel or the Accessibility Wizard). `img` is {src, alt,
     caption}. Rendered as a full-width figure so learners see the same thing
     the Expert would be looking at. Broken/absent sources hide gracefully. */
  function appendImage(img, autoOpen, fromExpert){
    if(!img || !img.src) return null;
    // Expert-sent screenshot: shown on the Expert's side of the chat, in the
    // flow of the conversation (no auto-opened lightbox; click still zooms).
    if(fromExpert){
      const meta = lastBubbleKind==='you' ? '' : `<div class="meta">${escapeHtml(firstName()||'You')} · ${mmss(callSeconds)}</div>`;
      lastBubbleKind = 'you';
      return appendNode(
        `<div class="msg you">${meta}<figure class="screenshot">`+
        `<img src="${escapeHtml(img.src)}" alt="${escapeHtml(img.alt||'')}" tabindex="0" role="button" `+
        `aria-label="View larger image" onclick="window.__openLightbox(this.src,this.alt)" `+
        `onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.__openLightbox(this.src,this.alt);}">`+
        `</figure></div>`);
    }
    lastBubbleKind = 'system';   // an image breaks a same-speaker run
    const alt = escapeHtml(img.alt || '');
    // No caption — learners read the screenshot and locate the info themselves.
    // Click (or Enter/Space) opens the image in a full-screen zoom lightbox.
    const node = appendNode(
      `<div class="msg system"><figure class="screenshot ref">`+
      `<img src="${escapeHtml(img.src)}" alt="${alt}" loading="lazy" tabindex="0" role="button" `+
      `aria-label="View larger image" onclick="window.__openLightbox(this.src,this.alt)" `+
      `onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.__openLightbox(this.src,this.alt);}" `+
      `onerror="this.closest('figure').innerHTML='<div class=\\'noimg\\'>[ screenshot not found ]</div>'">`+
      `<figcaption>For your reference · click to enlarge</figcaption></figure></div>`);
    // Engine rule: a screenshot revealed by an ACTION (e.g. "You impersonate…and
    // find the element in the Layers panel") pops straight into the full-screen
    // lightbox so the learner sees the detail immediately; they close it (X / Esc /
    // click-outside) to continue. It stays inline in the chat afterward too.
    // Short label only (text before the dash) so the caption names the view without giving away the answer.
    // Testing update: reference images no longer pop open by themselves; they
    // sit inline as a small labeled thumbnail the learner can click to enlarge.
    return node;
  }

  /* ---- Lightbox: click any inline screenshot to view it enlarged ---- */
  function openLightbox(src, alt, caption){
    const dlg = document.createElement('dialog'); dlg.className='lightbox';
    // Testing update: action-opened images get a caption so learners know what
    // they're looking at.
    dlg.innerHTML = `<button class="lightbox-close" type="button" aria-label="Close">&times;</button>`+
      `<img src="${escapeHtml(src)}" alt="${escapeHtml(alt||caption||'')}">`+
      (caption ? `<div class="lightbox-caption">${escapeHtml(caption)}</div>` : '');
    // Testing update: mount inside the fullscreen element (when there is one) so
    // closing the image doesn't knock the whole sim out of fullscreen.
    (document.fullscreenElement || document.body).appendChild(dlg); dlg.showModal();
    const close = ()=>{ try{dlg.close();}catch(e){} dlg.remove(); };
    dlg.addEventListener('click', e=>{ if(e.target===dlg) close(); });
    dlg.querySelector('.lightbox-close').onclick = close;
  }
  window.__openLightbox = openLightbox;

  // setComposer also drives the slide-up sheet: any real content (the choices)
  // auto-opens it; clearing it (transitions/retries) slides it back down so the
  // learner can read the chat. The learner can also toggle it via the handle.
  function setComposer(html){
    composerEl.innerHTML = html;
    const s = document.getElementById('sheet');
    if(s){
      const open = !!(html && html.trim());
      s.classList.toggle('min', !open);
      const h = document.getElementById('sheetHandle');
      if(h) h.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    syncChatBottom();
  }
  function setSheetQuestion(t){ const q=document.getElementById('sheetQ'); if(q) q.textContent = t; }
  function toggleSheet(){
    const s=document.getElementById('sheet'); if(!s) return;
    const willOpen = s.classList.contains('min');
    s.classList.toggle('min');
    const h=document.getElementById('sheetHandle');
    if(h) h.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    syncChatBottom();
  }

  /* ---- Slide-up sheet ⇄ chat spacing (engine rule — applies to every scenario) ----
     The decision sheet is an overlay pinned to the panel's bottom edge, so on its
     own it would COVER the newest chat messages. Rather than resize the chat
     viewport, we reserve empty space INSIDE the chat equal to the sheet's currently
     visible height: the last messages slide UP above the choices, and when the
     sheet is minimized that reserved space shrinks so they slide back DOWN. The
     newest message is always pinned into view. (Viewport height never changes.) */
  function syncChatBottom(){
    if(!chatEl) return;
    const s = document.getElementById('sheet');
    let cover = 0;
    if(s){
      // The sheet is pinned to the panel's bottom edge (its bottom == the chat's
      // bottom), so the strip it covers equals its own height. Use offsetHeight,
      // NOT getBoundingClientRect: offsetHeight ignores the slide-in transform, so
      // it's correct even mid-animation. Minimized → only the ~3.25rem handle shows.
      const rootPx = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
      cover = s.classList.contains('min') ? (3.25 * rootPx) : s.offsetHeight;
    }
    chatEl.style.paddingBottom = cover + 'px';   // reserve exactly the covered strip
    chatEl.scrollTop = chatEl.scrollHeight;      // pin to newest (sits just above the sheet)
    // Testing update: if the newest message is taller than the visible strip,
    // anchor its TOP instead so the start of the caller's reply is never hidden.
    const msgs = chatEl.querySelectorAll('.msg:not(.typing)');
    const last = msgs[msgs.length-1];
    if(last){
      const visible = chatEl.clientHeight - cover;
      const top = last.offsetTop - chatEl.offsetTop;
      if(top < chatEl.scrollTop) chatEl.scrollTop = Math.max(0, top - 8);
      else if(last.offsetHeight > visible) chatEl.scrollTop = Math.max(0, top - 8);
    }
  }
  // The sheet's open height is a % of the panel, so re-sync when the panel resizes
  // (window resize or entering/leaving fullscreen).
  window.addEventListener('resize', syncChatBottom);
  document.addEventListener('fullscreenchange', syncChatBottom);

  /* "[Action] ..." choices are actions, not spoken replies. */
  const ACTION_RE = /^\s*\[Action\]\s*/i;
  function isAction(text){ return ACTION_RE.test(text||''); }
  function stripAction(text){ return (text||'').replace(ACTION_RE, ''); }

  /* ---- Split a scripted line (speaker OR consequence) into ordered segments,
     one bubble per speaker. Segments break ONLY at a speaker label at the start
     of a line — NOT at blank lines — so a single message that contains its own
     paragraph break (e.g. the "Set to Advanced" upgrade steps) stays one bubble.
       "Expert:"            -> your blue bubble (right)
       "Sarah:"/name/caller -> gray caller bubble (left)
       "(...)"              -> inline system note (tool result / stage direction)
       unlabeled            -> caller (spoken) by default
     Speaker labels, wrapping quotes, and the ( ) around system notes are
     stripped so bubbles read as clean chat. ---- */
  const YOU_LABEL = /^\s*expert\s*[:：]\s*/i;
  function callerLabelRe(){
    const nm = (U.name||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return new RegExp('^\\s*(?:' + (nm?nm+'|':'') + 'sarah|caller|customer)\\s*[:：]\\s*','i');
  }
  function stripQuotes(s){ return s.replace(/^\s*["'“”‘’]+/,'').replace(/["'“”‘’]+\s*$/,'').trim(); }
  function splitDialogue(text){
    if(!text) return [];
    const clr = callerLabelRe(); const segs=[]; let cur=null;
    String(text).split('\n').forEach(line=>{
      // A line of just [image] = the Expert sends the choice/screen screenshot here.
      if(/^\s*\[image\]\s*$/i.test(line)){ cur={kind:'image', text:''}; segs.push(cur); return; }
      if(YOU_LABEL.test(line)){ cur={kind:'you',    text:line.replace(YOU_LABEL,'')}; segs.push(cur); }
      else if(clr.test(line)){  cur={kind:'caller', text:line.replace(clr,'')};        segs.push(cur); }
      else if(!cur && /^\s*\(/.test(line)){ cur={kind:'system', text:line};            segs.push(cur); }
      else if(!cur){            cur={kind:'caller', text:line};                         segs.push(cur); }
      else cur.text += '\n' + line;
    });
    return segs.map(s=>{
      let t = s.kind==='system' ? s.text.replace(/^\s*\(/,'').replace(/\)\s*$/,'') : s.text;
      return { kind:s.kind, text:stripQuotes(t) };
    }).filter(s=>s.kind==='image' || s.text.length);
  }
  /* transcript bubbles: same markup, name label only (no live timer) */
  function segMarkup(kind, text){
    const who = kind==='system' ? '' : (kind==='you' ? (firstName()||'You') : U.name);
    return bubbleMarkup(kind, text, who);
  }

  /* ---- Typing indicator + auto-advance reveal ----
     Sarah's "typing…" dots show before her first reply to a pick; follow-on
     caller lines in the same beat use a shorter delay; your/system lines appear
     after a short beat. animate=false reveals everything at once (first load). */
  const TAI_MS = 5000, TAI_FOLLOW_MS = 1500, YOU_MS = 700, SYS_MS = 500;
  // Consequence beats:
  //  • inline notes (centered system bubbles) reveal 2s apart;
  //  • spoken consequence lines (Samantha OR the Expert) show a 5s typing
  //    indicator before landing.
  const REACT_INLINE_MS = 2000, REACT_TYPING_MS = 5000;
  const CHOICES_DELAY_MS = 2000;   // pause between the caller's line and the new choices
  function typingBubble(kind){
    const you = kind==='you';
    const side = you ? 'you' : 'caller';
    const who  = you ? (firstName()||'You') : U.name;
    return appendNode(
      `<div class="msg typing ${side}"><div class="meta">${escapeHtml(who)} · typing…</div>`+
      `<div class="bubble"><span class="tai-dot"></span><span class="tai-dot"></span><span class="tai-dot"></span></div></div>`);
  }
  function revealSegments(segs, animate, done, opts){
    opts = opts || {};
    const reaction = !!opts.reaction;
    let i=0, sawCaller=false;
    (function next(){
      if(i>=segs.length){ if(done) done(); return; }
      const s=segs[i++];
      if(s.kind==='image'){
        const go=()=>{ appendImage(opts.image, false, true); next(); };
        return animate ? setTimeout(go, YOU_MS) : go();
      }
      // In a consequence (reaction) reveal:
      //  • centered inline notes (system) turn green and reveal 2s apart;
      //  • spoken lines — Samantha (caller) OR the Expert (you) — show a 5s
      //    typing indicator, then land.
      const inlineNote = reaction && s.kind==='system';
      if(!animate){ appendBubble(s.kind, s.text, inlineNote); return next(); }
      if(inlineNote){
        setTimeout(()=>{ appendBubble('system', s.text, true); next(); }, REACT_INLINE_MS);
      } else if(reaction && s.kind==='you' && window.CallMode && window.CallMode.shouldSpeak && window.CallMode.shouldSpeak()){
        promptSayLine(s.text, ()=>{ appendBubble('you', s.text); next(); });
      } else if(reaction && (s.kind==='caller' || s.kind==='you')){
        const dots=typingBubble(s.kind);
        setTimeout(()=>{ dots.remove(); appendBubble(s.kind, s.text); next(); }, REACT_TYPING_MS);
      } else if(s.kind==='caller'){
        const t = sawCaller ? TAI_FOLLOW_MS : TAI_MS; sawCaller=true;
        const dots=typingBubble();
        setTimeout(()=>{ dots.remove(); appendBubble('caller', s.text); next(); }, t);
      } else {
        setTimeout(()=>{ appendBubble(s.kind, s.text); next(); }, s.kind==='you'?YOU_MS:SYS_MS);
      }
    })();
  }

  /* CALL MODE: an Expert follow-up line inside a consequence. The learner is the
     Expert, so on a voice call they say it; it appears in the chat once sent. */
  function promptSayLine(text, done){
    setComposer(`<div class="choices-label" id="choicesLabel">Say this aloud to ${escapeHtml(U.name)}</div>`
              + `<div class="say-line">${escapeHtml(px(text))}</div><div id="voicepanel"></div>`);
    setSheetQuestion('Say your next line');
    window.CallMode.sayLine(document.getElementById('voicepanel'), px(text), ()=>{ setComposer(''); done(); });
    syncChatBottom();
  }

  /* ---- Helper buttons (native <dialog>) ---- */
  function openModal(title, node){
    const dlg = document.createElement('dialog'); dlg.className='modal'; dlg.id='modal';
    const inner = document.createElement('div'); inner.className='modal-inner';
    const head = document.createElement('div'); head.className='mhead';
    head.innerHTML = `<h3>${escapeHtml(title)}</h3>`;
    const x = document.createElement('button'); x.className='mx'; x.innerHTML='&times;'; x.setAttribute('aria-label','Close');
    x.onclick = closeModal; head.appendChild(x);
    inner.appendChild(head); inner.appendChild(node); dlg.appendChild(inner);
    (document.fullscreenElement || document.body).appendChild(dlg); dlg.showModal();
    dlg.addEventListener('click', e=>{ if(e.target===dlg) closeModal(); });  // backdrop click
  }
  function closeModal(){ const m=document.getElementById('modal'); if(m){ try{m.close();}catch(e){} m.remove(); } }

  function renderHelpers(){
    const bar = document.getElementById('helperbar');
    if(!S.resources){ bar.style.display='none'; return; }
    bar.innerHTML='';
    const b=document.createElement('button');
    b.className='hbtn';
    b.textContent = S.resources.title || 'Check Resources';
    b.onclick = ()=>{ help.used = true; openResources(); };
    bar.appendChild(b);
  }
  /* Opens the scenario's dynamic links in a modal. Opening the resource
     marked correct:true is what lifts the article-stage cap in renderFinal —
     but only if it happens at/after RESOURCE_CREDIT_MIN_SECONDS into the call.
     Opening it earlier doesn't count; the learner can still open it again
     later (any time before ending the chat) to earn credit. */
  const RESOURCE_CREDIT_MIN_SECONDS = 30;
  function openResources(){
    const r=S.resources, wrap=document.createElement('div');
    resourcesOpenedAt = callSeconds;   // start the clock for this modal's dwell time
    logEvent({type:'helper', helper:'resources', action:'opened Check Resources', seconds:0});
    if(r.note) wrap.innerHTML='<div class="mnote" style="margin:0 0 0.625rem">'+escapeHtml(r.note)+'</div>';
    (r.items||[]).forEach(it=>{
      const a=document.createElement('a');
      a.className='mopt'; a.href=it.url||'#'; a.target='_blank'; a.rel='noopener noreferrer';
      a.textContent=it.label + '  ↗';
      a.onclick=(e)=>{
        // Placeholder article (no KB link yet): don't open a blank/self tab,
        // but still count the click as opening it.
        if(!it.url) e.preventDefault();
        // Article scoring: keep the best-scoring article opened in time.
        if(typeof it.points === 'number' && callSeconds >= RESOURCE_CREDIT_MIN_SECONDS
           && (!bestArticle || it.points > bestArticle.points)){
          bestArticle = { label:it.label, points:it.points,
                          rating: it.rating || (it.correct ? 'correct' : 'incorrect') };
        }
        // Any resource link click (correct or distractor) counts as "opened a
        // resource" — this gates speaker lines like "(You open CSI.)" that
        // should only appear if the learner actually looked something up.
        help.openedAnyResourceLink = true;
        if(document.fullscreenElement) fsLostToResource = true;
        help.openedLabels.add((it.label||'').trim().toLowerCase());
        refreshLocks();
        if(!r.stage){
          // Unscored Check Resources (no `stage`): log the click with no verdict,
          // so placeholder articles don't show as `correct = no` in the Sheet.
          logEvent({type:'helper', helper:'resources', action:it.label,
                    seconds:secondsOnResources(), notes:'opened a resource (not scored)'});
        } else if(it.correct){
          if(callSeconds >= RESOURCE_CREDIT_MIN_SECONDS){
            help.checkedCorrectArticle=true;
            logEvent({type:'helper', helper:'resources', action:it.label,
                      verdict:'correct', seconds:secondsOnResources(), notes:'opened the correct resource'});
          } else {
            logEvent({type:'helper', helper:'resources', action:it.label,
                      seconds:secondsOnResources(), notes:'opened the correct resource too early to earn credit (before '+RESOURCE_CREDIT_MIN_SECONDS+'s)'});
          }
        } else logEvent({type:'helper', helper:'resources', action:it.label,
                         verdict:'incorrect', seconds:secondsOnResources(), notes:'opened a distractor resource'});
      };
      wrap.appendChild(a);
    });
    openModal(r.title||'Check Resources', wrap);
    document.getElementById('modal').addEventListener('close', ()=>{
      logEvent({type:'helper', helper:'resources', action:'closed Check Resources', seconds:secondsOnResources()});
    }, {once:true});
  }

  /* End screen for the call tab: tells the learner to go back to the course tab
     (until the sim is embedded in the course). "Back to my course" focuses the
     opener tab when the browser allows it, then tries to close this one. */
  function showReturnToCourse(){
    const wrap=document.createElement('div');
    wrap.innerHTML='<p style="margin:0 0 1rem">Your results are saved and this activity is marked complete. Go back to your course tab to keep going.</p>'+
      '<button class="btn btn-dark" type="button" id="backToCourse">Back to my course</button>';
    openModal("You're all done", wrap);
    document.getElementById('backToCourse').onclick=()=>{
      try{ if(window.opener && !window.opener.closed) window.opener.focus(); }catch(_){}
      window.close();
    };
  }

  /* Re-entering full screen needs a click, so when an article tab knocks the sim
     out of full screen, offer a one-click way back when the learner returns. */
  let fsLostToResource = false;
  function offerFullscreenReturn(){
    if(!fsLostToResource || document.fullscreenElement || document.getElementById('fsReturn')) return;
    if(!document.getElementById('simWrap')) return;
    const b=document.createElement('button');
    b.id='fsReturn'; b.type='button'; b.className='btn btn-dark';
    b.style.cssText='position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:50';
    b.textContent='Go back to full screen';
    b.onclick=()=>{ fsLostToResource=false; b.remove(); app.requestFullscreen().catch(()=>{}); };
    document.body.appendChild(b);
    setTimeout(()=>{ if(b.isConnected){ b.remove(); fsLostToResource=false; } }, 10000);
  }
  window.addEventListener('focus', offerFullscreenReturn);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) offerFullscreenReturn(); });

  /* Centered in-sim notice (styled like the Check Resources panel) shown when a
     learner tries to reply from an article they never opened in Check Resources —
     replaces the old browser alert(). */
  /* "Reply using …" choices need their quoted article(s) opened in Check
     Resources. Returns null for other choices, else { need, have } counts.
     Matching is normalized (case/punctuation/&-and, plus a prefix-tolerant
     subset test) so labels and quotes don't have to match exactly. */
  function resourceProgress(text){
    text = px(text) || '';
    if(!/\b(?:reply using|provide a response using)\b/i.test(text)) return null;
    const toks = s => new Set((s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean));
    const subset = (a,b) => [...a].every(t => b.has(t));   // a ⊆ b
    const opened = [...help.openedLabels].map(toks).filter(s => s.size);
    const needed = (text.match(/["“”'‘’]([^"“”'‘’]+)["“”'‘’]/g)||[])
                     .map(q => toks(q.replace(/["“”'‘’]/g,''))).filter(s => s.size);
    const have = needed.filter(n => opened.some(o => subset(n,o) || subset(o,n))).length;
    return { need: needed.length, have };
  }
  // Locked "Task" choices: greyed with a hint until every article is opened.
  function lockLabel(prog){
    if(prog.have >= prog.need) return 'Ready';
    return prog.need > 1 ? `${prog.have} of ${prog.need} opened. Open them in Check Resources to unlock`
                         : 'Open this resource in Check Resources to unlock';
  }
  function refreshLocks(){
    if(!composerEl) return;
    composerEl.querySelectorAll('.choice-action[data-res]').forEach(b=>{
      const prog = resourceProgress(b.dataset.res); if(!prog) return;
      const done = prog.need > 0 && prog.have >= prog.need;
      b.classList.toggle('locked', !done);
      b.setAttribute('aria-disabled', done ? 'false' : 'true');
      const h = b.querySelector('.lock-hint'); if(h) h.textContent = lockLabel(prog);
    });
  }

  function notifyResourceNotOpened(){
    const wrap=document.createElement('div');
    wrap.innerHTML='<div class="mnote" style="margin:0;font-size:0.875rem;color:var(--ink-2)">'
      + 'It looks like you didn’t open this article using Check Resources. '
      + 'Remember to always check the resource before answering from memory.</div>';
    openModal('Check the resource first', wrap);
  }

  /* Progress bar removed — kept as a no-op so existing call sites are harmless. */
  function paintProgress(){}

  function applyCredit(stg, pts, verdict, pickText){
    if(!(stg in earned)) return;
    const cfg = stageCfg[stg] || {};
    if(cfg.additive){
      // Stage spans more than one screen (e.g. solve = s_solve + s_solve2):
      // sum contributions, capped at the stage max, rather than taking the best.
      const next = Math.min(cfg.max==null ? Infinity : cfg.max, earned[stg] + Math.max(0, pts));
      if(pts > 0 || !(stg in decisivePick)) decisivePick[stg] = {text:pickText, verdict:verdict, points:next};
      earned[stg] = next;
      if(verdict==='correct') status[stg]='done';
      else if(verdict==='partial' && status[stg]!=='done') status[stg]='partial';
      return;
    }
    if(!(stg in decisivePick) || pts > earned[stg]) decisivePick[stg] = {text:pickText, verdict:verdict, points:pts};
    if(pts > earned[stg]) earned[stg] = pts;
    if(verdict==='correct') status[stg]='done';
    else if(verdict==='partial' && status[stg]!=='done') status[stg]='partial';
  }
  function recordChoice(screen, ch, cappedPoints){
    const primary = ch.stageOverride || screen.stage;
    applyCredit(primary, cappedPoints, ch.verdict, ch.text);
    (ch.credits||[]).forEach(c => applyCredit(c.stage, c.points, c.verdict||'correct', ch.text));
  }

  function renderScreen(id, opts){
    opts = opts || {};
    const retriedIds = opts.retriedIds || [];
    if(id==='__end__') return renderFinal();
    const scr = S.screens[id];
    visitedScreens.add(scr.id);
    paintProgress();
    setComposer('');   // choices appear only AFTER the caller's line has landed

    const showChoices = ()=>{
      // (Screen screenshots are no longer shown automatically — they now reveal
      //  only when the learner picks the choice flagged with caption:"Samantha's Layers panel…".)
      // CALL MODE: all response options stay visible; the learner reads one aloud
      // (or taps it). The voice panel + meter sit below. See the CALL MODE module.
      // TONY TEST: spoken responses and click actions are separate groups.
      //   • "Say it"   — what the Expert says. In voice mode these are read aloud,
      //                  not clicked (a "Mic not working?" link unlocks tapping).
      //   • "Click it" — [Action] choices: things the Expert DOES. Click only;
      //                  voice matching never selects one.
      // A choice with `say` is the Expert SPEAKING, so it's a spoken response
      // even if its label reads "[Action]".
      const visible = scr.choices.filter(ch => !(ch.retryOnly && !retriedIds.length));
      const isAct = ch => isAction(ch.text) && !ch.say;
      const spoken = visible.filter(ch => !isAct(ch)), acts = visible.filter(isAct);
      const voiceOn = !!(window.CallMode && window.CallMode.shouldSpeak && window.CallMode.shouldSpeak()) && !tapFallback;
      const both = spoken.length && acts.length;
      const sayHead = `<div class="cgroup-head"><span class="demo-ico say">${MIC_SVG}</span><span class="cgroup-title">Say it</span>`
        + `<span class="cgroup-sub">${voiceOn ? 'Click the mic, read one aloud, click to stop' : 'Tap what you would say'}</span></div>`;
      const actHead = `<div class="cgroup-head"><span class="demo-ico click">${CLICK_SVG}</span><span class="cgroup-title">${both ? 'Or click it' : 'Click it'}</span>`
        + `<span class="cgroup-sub">${spoken.length ? "An action you'd take. Don't say it" : "This step is an action. Nothing to say aloud"}</span></div>`;
      setComposer((both ? `<div class="choices-label" id="choicesLabel">Choose one: say a response or click an action</div>` : '')
                + (spoken.length ? `<div class="cgroup">${sayHead}<div id="choices"></div><div id="voicepanel"></div>`
                    + (voiceOn ? `<p class="say-hint" id="sayHint">This is a spoken response. Click the mic button, say it aloud, then click it again to stop.</p><button class="tap-fallback" id="tapFallback" type="button">Mic not working? Tap responses instead</button>` : '')
                    + `</div>` : '')
                + (acts.length ? `<div class="cgroup">${actHead}<div id="actChoices"></div></div>` : ''));
      setSheetQuestion(px(scr.prompt));   // the question shows in the sheet handle
      const cWrap = document.getElementById('choices'), aWrap = document.getElementById('actChoices');
      const choiceBtns = [];
      const makeBtn = (ch, act)=>{
        const b=document.createElement('button');
        b.type = 'button';
        b._choose = ()=>choose(scr,ch,retriedIds,opts.cap);
        if(act){
          b.className = 'choice act choice-action';
          const prog = resourceProgress(ch.text);
          if(prog){
            // Real task (needs Check Resources), not a stage direction: tag + lock.
            b.dataset.res = ch.text;
            b.innerHTML = `<span class="act-ico">${CLICK_SVG}</span><span class="act-body"><span class="task-tag">Task</span>`
              + `${escapeHtml(stripAction(px(ch.text)))}<span class="lock-hint"></span></span>`;
          } else {
            b.innerHTML = `<span class="act-ico">${CLICK_SVG}</span><span>${escapeHtml(stripAction(px(ch.text)))}</span>`;
          }
          b.onclick = b._choose;
        } else {
          b.className = 'choice say' + (voiceOn ? ' say-only' : '');
          b.innerHTML = escapeHtml(stripAction(px(ch.text)));
          b.onclick = ()=>{
            if(b.classList.contains('say-only')){
              const h = document.getElementById('sayHint'); if(h){ h.classList.remove('show'); void h.offsetWidth; h.classList.add('show'); }
              return;
            }
            b._choose();
          };
        }
        if(retriedIds.includes(ch.id)) b.disabled=true;
        return b;
      };
      spoken.forEach(ch=>{ const b = makeBtn(ch, false); cWrap.appendChild(b); choiceBtns.push({ btn:b, choice:ch, disabled:!!b.disabled }); });
      acts.forEach(ch=>{ aWrap.appendChild(makeBtn(ch, true)); });
      refreshLocks();
      const tf = document.getElementById('tapFallback');
      if(tf) tf.onclick = ()=>{
        tapFallback = true;
        logEvent({ type:'helper', helper:'voice', action:'switched to tapping spoken responses', seconds:callSeconds });
        composerEl.querySelectorAll('.choice.say-only').forEach(x=>x.classList.remove('say-only'));
        const h = document.getElementById('sayHint'); if(h) h.remove();
        tf.remove();
        const sub = composerEl.querySelector('.cgroup .cgroup-sub'); if(sub) sub.textContent = 'Say one aloud, or tap it';
      };
      markStepStart();   // start the clock for this screen's time_on_step_sec
      // CALL MODE: attach the speak-aloud panel to the SPOKEN responses only.
      // Only when speaking: a learner who chose "Continue without speaking" (or
      // "Mic not working?") taps responses, so no mic panel is shown.
      if(window.CallMode && choiceBtns.length && voiceOn) window.CallMode.attach(scr, choiceBtns);
      syncChatBottom();  // choices are now in the DOM — slide the chat up above them
    };

    // The caller line (which may itself contain Expert:/Sarah: parts) is split
    // into its own bubbles. On auto-advance it animates in with typing dots.
    currentSpeakerShown = !!(scr.speaker && !opts.skipSpeaker && speakerGateMet(scr));
    if(currentSpeakerShown){
      // Testing update: a short beat after the caller's line lands, so learners
      // read it before the choices slide up and shift the view.
      revealSegments(splitDialogue(scr.speaker), !!opts.animateSpeaker,
        opts.animateSpeaker ? ()=>setTimeout(showChoices, CHOICES_DELAY_MS) : showChoices);
    } else {
      showChoices();
    }
  }

  /* Some speaker lines only make sense if the learner actually did something
     first. `speakerIf:"resourceOpened"` on a screen gates its speaker line so
     it's skipped entirely unless the learner clicked a resource link in Check
     Resources at some point in the call. Add more gate keys here as needed. */
  function speakerGateMet(scr){
    if(!scr.speakerIf) return true;
    if(scr.speakerIf === 'resourceOpened') return !!help.openedAnyResourceLink;
    return true;
  }

  function choose(scr, ch, retriedIds, cap){
    // A response was picked (tapped or matched): turn off a mic left on, without sending what it heard.
    if(window.CallMode && window.CallMode.stopMic) window.CallMode.stopMic();
    // Stage lock: a choice phrased "Reply using …" / "Provide a response using …"
    // requires the learner to have opened the quoted article(s) in Check
    // Resources first. Matching is normalized (case/punctuation/&-and, plus a
    // prefix-tolerant substring test) and ALL quoted articles must be opened.
    // Stage lock: "Reply using …" needs ALL quoted article(s) opened first.
    const prog = resourceProgress(ch.text);
    if(prog && (!prog.need || prog.have < prog.need)){
      notifyResourceNotOpened();
      return;
    }
    [...composerEl.querySelectorAll('.choice')].forEach(x=>x.disabled=true);
    // The learner's pick renders as:
    //   • `say` present  -> a blue Expert bubble of the spoken words ("Tell Sarah…")
    //   • an [Action]    -> an inline "You …" note (a tool action)
    //   • otherwise      -> a blue reply bubble of the choice text
    if(ch.say) appendBubble('you', ch.say);
    else if(isAction(ch.text)) appendActionNote(actionNoteText(ch.text));
    else appendBubble('you', ch.text);

    // Choice-gated screenshot: shows immediately on selection, before the reply.
    // Action-revealed screenshots auto-open the full-screen lightbox (2nd arg).
    if(ch.showsImage && (ch.image||scr.image)) appendImage(ch.image||scr.image, true);
    // Deferred screenshot: shown AFTER the consequence (reply) finishes revealing.
    const showImageAfter = ()=>{ if(ch.showsImageAfter && (ch.image||scr.image)) appendImage(ch.image||scr.image, true); };
    const segs = splitDialogue(ch.consequence);

    // GUIDED MODE (S.guided): after the caller's reaction, a choice with `feedback`
    // shows a coaching card. retry:true = must try again; retry:"optional" = the
    // learner picks Try again or Continue. Outside guided mode, feedback is ignored
    // and "optional" just advances.
    const guided = !!S.guided;
    const fb = guided && ch.feedback ? ch.feedback : '';
    const optRetry = ch.retry === 'optional';
    const retryCap = mergeCap(cap, ch.capIfRetried);
    const reopen = ()=>renderScreen(scr.id, { retriedIds:retriedIds.concat(ch.id), cap:retryCap, skipSpeaker:true });
    // Guided: ONE retry per screen. On the retry pass, any pick is scored (capped)
    // and the call moves on. A pick that points back at this screen (an incorrect
    // whose goTo is itself) advances where the correct answer would have gone.
    const onRetryPass = guided && retriedIds.length > 0;
    const forwardOf = s => {
      const c = s.choices.find(x => x.verdict==='correct' && x.goTo!==s.id)
             || s.choices.find(x => x.goTo!==s.id);
      return c ? c.goTo : '__end__';
    };
    const dest = (onRetryPass && ch.goTo===scr.id) ? forwardOf(scr) : ch.goTo;
    const goNext = ()=>{
      showImageAfter();
      if(dest==='__end__') renderFinal();
      else renderScreen(dest, { animateSpeaker:true });
    };
    const retryNote = 'screen re-opened for a retry' + (typeof retryCap==='number' ? ' (capped at '+retryCap+')' : '');

    if(ch.retry && !onRetryPass && !retriedIds.includes(ch.id) && (!optRetry || guided)){
      setComposer('');
      if(guided && !retriedScreens.includes(scr.id)) retriedScreens.push(scr.id);
      if(!optRetry){
        transcript.push({ speaker:currentSpeakerShown ? scr.speaker : null, picked:ch.text, say:ch.say, consequence:ch.consequence, feedback:fb, fbTitle:ch.feedbackTitle, verdict:ch.verdict });
        logEvent({ type:'choice', stage:scr.stage, screen:scr.id, question:px(scr.prompt),
                   text:stripAction(px(ch.text)), verdict:ch.verdict, points:0, seconds:secondsOnStep(),
                   notes:'first attempt — ' + (fb ? 'coaching shown, ' : 'caller pushed back, ') + retryNote });
        // Unguided: auto re-open once the pushback lands. Guided: coaching card first.
        revealSegments(segs, true, fb
          ? ()=>showCoaching(scr, ch, [{ label:'Try again', primary:true, go:reopen }])
          : reopen, { reaction:true, image:ch.image||scr.image });
        return;
      }
      // Optional retry: nothing is scored until the learner decides.
      const speakerShown = currentSpeakerShown;
      revealSegments(segs, true, ()=>showCoaching(scr, ch, [
        { label:'Try again', primary:true, go:()=>{
            transcript.push({ speaker:speakerShown ? scr.speaker : null, picked:ch.text, say:ch.say, consequence:ch.consequence, feedback:fb, fbTitle:ch.feedbackTitle, verdict:ch.verdict });
            logEvent({ type:'choice', stage:scr.stage, screen:scr.id, question:px(scr.prompt),
                       text:stripAction(px(ch.text)), verdict:ch.verdict, points:0, seconds:secondsOnStep(),
                       notes:'optional retry taken — ' + retryNote });
            reopen();
          } },
        { label:'Continue', go:()=>{ scoreAndLog(scr, ch, cap, fb, speakerShown, '; optional retry declined'); goNext(); } }
      ]), { reaction:true, image:ch.image||scr.image });
      return;
    }

    // Guided retry pass: a partial or incorrect pick here = still wrong after both tries.
    let retryNote2 = '';
    if(onRetryPass && ch.verdict !== 'correct'){
      if(!stillWrongScreens.includes(scr.id)) stillWrongScreens.push(scr.id);
      retryNote2 = '; still wrong after retry';
    }
    scoreAndLog(scr, ch, cap, fb, currentSpeakerShown, retryNote2);
    setComposer('');
    // Auto-advance to the next screen — NO Continue button. The next caller line
    // arrives via its own typing indicator, straight into the next choices.
    // Guided + feedback: the coaching card's Continue button advances instead.
    revealSegments(segs, true, fb
      ? ()=>showCoaching(scr, ch, [{ label:ch.goTo==='__end__' ? 'See results' : 'Continue', primary:true, go:goNext }])
      : goNext, { reaction:true, image:ch.image||scr.image });
  }

  // A retry's cap carries forward: chained retries keep the LOWEST cap.
  function mergeCap(a, b){
    const na = typeof a==='number', nb = typeof b==='number';
    return na && nb ? Math.min(a,b) : na ? a : nb ? b : undefined;
  }
  function scoreAndLog(scr, ch, cap, fb, speakerShown, extraNote){
    let pts = ch.points;
    if(typeof cap === 'number') pts = Math.min(pts, cap);
    recordChoice(scr, ch, pts);
    logEvent({ type:'choice', stage:scr.stage, screen:scr.id, question:px(scr.prompt),
               text:stripAction(px(ch.text)), verdict:ch.verdict, points:pts, seconds:secondsOnStep(),
               notes:(isAction(ch.text) ? 'action' : 'reply')
                     + (typeof cap==='number' ? '; retry attempt, capped at '+cap : '')
                     + (fb ? '; coaching shown' : '') + (extraNote||'') });
    transcript.push({ speaker:(typeof cap==='number' || !speakerShown ? null : scr.speaker), picked:ch.text, say:ch.say, consequence:ch.consequence, feedback:fb, fbTitle:ch.feedbackTitle, verdict:ch.verdict });
  }

  /* GUIDED MODE coaching card — appears inline in the chat after the caller's
     reaction. Heading/colour follow the choice's verdict; an author can override
     the heading with `feedbackTitle`. buttons: [{label, primary, go}] */
  const COACH_TITLES = { correct:'Nice work', partial:'Almost there', incorrect:'Not quite' };
  function showCoaching(scr, ch, buttons){
    const v = COACH_TITLES[ch.verdict] ? ch.verdict : 'partial';
    const title = ch.feedbackTitle || COACH_TITLES[v];
    // Inline in the chat (same look as the end-of-call transcript). The decision
    // sheet stays minimized; the buttons live in the card and are removed once
    // used, so the card stays in the chat as a record.
    setComposer('');
    setSheetQuestion('Coaching');
    const card = appendNode(`<div class="coachfb ${v} tx" role="status">
        <div class="coachfb-head"><span class="coachfb-dot"></span>${escapeHtml(title)}</div>
        ${ch.feedback ? `<p class="coachfb-text">${escapeHtml(px(ch.feedback))}</p>` : ''}
        <div class="coachfb-actions"></div>
      </div>`);
    lastBubbleKind = null;   // the next bubble re-shows its speaker name
    const row = card.querySelector('.coachfb-actions');
    buttons.forEach(b=>{
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'btn ' + (b.primary ? 'btn-dark' : 'btn-ghost');
      el.textContent = b.label;
      el.onclick = ()=>{ row.remove(); syncChatBottom(); b.go(); };
      row.appendChild(el);
    });
    const first = row.querySelector('button'); if(first) first.focus();
    syncChatBottom();
  }

  /* =================== PHASE 3 — COMPLETE =================== */
  function renderFinal(){
    stopTimer();
    // The call is over: stop the recorder and ship the audio to Drive (keyed by
    // attempt_id). Best-effort — never blocks rendering the results.
    try{
      if(window.CallMode && window.CallMode.stopRecording){
        window.CallMode.stopRecording().then(blob => {
          uploadRecording(blob);   // permanent copy → L&D Drive
          mountPlayback(blob);     // play-only copy → learner, in the results panel
        }).catch(()=>{});
      }
    } catch(e){}

    // Apply the Check-Resources penalty before tallying (same rule the old
    // "Check the Articles" used: no verify of the correct resource → capped).
    const helpNotes = [];
    const res = S.resources;
    // Article scoring: the best article opened in time credits the resources stage.
    if(res && bestArticle){
      applyCredit(res.stage, bestArticle.points, bestArticle.rating, 'Opened ' + bestArticle.label);
      logEvent({ type:'helper', helper:'resources', stage:res.stage, action:bestArticle.label,
                 verdict:bestArticle.rating, points:bestArticle.points, notes:'best article opened (scored)' });
    }
    if(res && !help.checkedCorrectArticle && (res.stage in earned) && earned[res.stage] > res.capIfUnchecked){
      earned[res.stage] = res.capIfUnchecked;
      helpNotes.push("You reached the right answer, but didn't verify it in the source resource — checking the resource is the skill, not remembering.");
    }
    S.stages.forEach(st=>{ if(earned[st.id] >= st.max) status[st.id]='done'; else if(earned[st.id] > 0 && status[st.id]==='done') status[st.id]='partial'; });

    const sum = Object.values(earned).reduce((a,b)=>a+b,0);

    // Guided: one summary row of retried / still-wrong screens (before `final`).
    if(S.guided){
      logEvent({ type:'guided_retries', seconds:callSeconds,
                 text:'retried: ' + (retriedScreens.join(', ') || 'none')
                    + ' | still wrong: ' + (stillWrongScreens.join(', ') || 'none'),
                 notes: retriedScreens.length + ' screen(s) retried, '
                    + stillWrongScreens.length + ' still wrong after retry (partial or incorrect)' });
    }
    // One summary row per attempt: the total score only.
    logEvent({ type:'final', points:sum, seconds:callSeconds,
               notes:'final score ' + sum + ' / ' + maxTotal });

    const rows = S.stages.map(st=>{
      const cls = status[st.id]==='done'?'done':status[st.id]==='partial'?'partial':'miss';
      return `<div class="srow"><span><span class="sdot ${cls}"></span>${st.name}</span>
              <span class="sval">${earned[st.id]} / ${st.max}</span></div>`;
    }).join('');

    const pickLine = st => {
      const p = decisivePick[st.id];
      return p ? `<div class="pick">Your response: “${escapeHtml(p.text)}”</div>`
               : `<div class="pick miss">You didn't reach this step.</div>`;
    };
    // A stage counts as "reached" only if the learner actually answered or was
    // credited for it (decisivePick set). Stages skipped by ending the chat
    // early get no coaching feedback — just a "didn't reach this step" note.
    const reached = st => (st.id in decisivePick);
    const strengths = S.stages.filter(st=>status[st.id]==='done' && st.strength)
        .map(st=>`<li><b>${st.name}</b> — ${st.strength}${pickLine(st)}</li>`).join('');
    const areas = S.stages.filter(st=>status[st.id]!=='done' && st.improvement)
        .map(st=> reached(st)
            ? `<li><b>${st.name}</b> — ${st.improvement}${pickLine(st)}</li>`
            : `<li><b>${st.name}</b> — You didn't reach this step.</li>`).join('');

    // One collapsible row, styled like the wix.com "Website builder FAQs".
    const accItem = (id, title, inner) => `
      <div class="acc-item" data-acc="${id}">
        <button class="acc-head" type="button" aria-expanded="false" aria-controls="accp-${id}">
          <span>${title}</span><span class="acc-icon" aria-hidden="true"></span>
        </button>
        <div class="acc-panel" id="accp-${id}" role="region">
          <div class="acc-clip"><div class="acc-inner">${inner}</div></div>
        </div>
      </div>`;

    // CALL MODE: voice summary for the results panel + one telemetry row.
    const dv = (window.CallMode && window.CallMode.delivery) ? window.CallMode.delivery() : null;
    if(dv && dv.spoken) logEvent({ type:'helper', helper:'voice', action:dv.rating, seconds:callSeconds,
      notes: dv.spoken + ' spoken responses, ' + dv.events + ' volume events (' + dv.quiet + ' too quiet, ' + dv.loud + ' too loud)' });

    const completeImg = U.completeImage || U.image;
    const portrait = completeImg
      ? `<img src="${escapeHtml(completeImg)}" alt="" onerror="this.style.display='none'">` : '';

    app.innerHTML = `
      <section class="complete-hero">
        <div class="portrait">${portrait}</div>
        <div class="body">
          <h1 class="display">Complete!</h1>
          <p class="lead">Here's how the chat went, stage by stage — with the exact response that set each score.</p>
          <div class="scorenum">${sum}<small> / ${maxTotal}</small></div>
        </div>
      </section>

      <div class="acc">
        ${accItem('scorecard','Scorecard', rows)}
        ${accItem('strengths','Top strengths', `<ul class="list str">${strengths || '<li>No stage was completed to full marks this time.</li>'}</ul>`)}
        ${accItem('areas','Areas for improvement', `<ul class="list imp">${areas || '<li>Nothing flagged — a clean run.</li>'}</ul>`)}
        ${dv ? accItem('delivery','Voice and Projection', dv.html) : ''}
      </div>

      ${helpNotes.length ? `<div class="card"><h3>Notes</h3><ul class="list imp">${helpNotes.map(n=>`<li>${n}</li>`).join('')}</ul></div>` : ''}

      <div class="gate">
        <button class="btn btn-dark" id="finishBtn" type="button" disabled>Finish</button>
        <span class="hint" id="gateHint">Open all ${dv ? 'four' : 'three'} sections to finish.</span>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" id="txBtn">View conversation transcript</button>
        <button class="btn btn-dark" onclick="location.reload()">Restart</button>
      </div>
      <div id="tx" class="card" style="display:none"></div>`;

    if(window.CallMode && window.CallMode.mountGraph) window.CallMode.mountGraph();   // draw the volume waveform

    // ---- Accordion toggle + completion gate ----------------------------------
    // Each row opens independently (mirrors the Wix FAQ). The Finish button
    // unlocks only once every row (three, or four with Voice and Projection) has
    // been opened at least once; re-collapsing a row does not re-lock it.
    // Finishing pushes the Rise/Storyline variable that marks the activity complete.
    const needIds = ['scorecard','strengths','areas'].concat(dv ? ['delivery'] : []);
    const opened  = new Set();
    const finishBtn = document.getElementById('finishBtn');
    const gateHint  = document.getElementById('gateHint');
    let finished = false;

    app.querySelectorAll('.acc-head').forEach(head=>{
      head.onclick = () => {
        const item = head.closest('.acc-item');
        const isOpen = item.classList.toggle('open');
        head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        if(isOpen){
          opened.add(item.getAttribute('data-acc'));
          if(!finished && needIds.every(id=>opened.has(id))){
            finishBtn.disabled = false;
            gateHint.textContent = 'All sections reviewed — you can finish.';
            gateHint.classList.add('ready');
          }
        }
      };
    });

    finishBtn.onclick = () => {
      if(finishBtn.disabled || finished) return;
      finished = true;
      pushRiseVar('activity_score', String(Math.round(sum / maxTotal * 100)));   // percent, read by the SCORM wrapper
      pushRiseVar('activity_complete', 'true');
      logEvent({ type:'complete', points:sum, seconds:callSeconds,
                 notes:'learner reviewed all end-screen sections and finished — ' + sum + ' / ' + maxTotal });
      finishBtn.classList.remove('btn-dark');
      finishBtn.classList.add('done');
      finishBtn.textContent = 'Completed';
      gateHint.textContent = IS_CALL_TAB ? 'Marked complete. You can close this tab and go back to your course.' : 'Marked complete.';
      gateHint.classList.add('ready');
      // Return-to-course end screen: the call tab doesn't take learners back by itself.
      if(IS_CALL_TAB) showReturnToCourse();
    };

    document.getElementById('txBtn').onclick = () => {
      const tx = document.getElementById('tx'), btn = document.getElementById('txBtn');
      if(tx.style.display==='none'){
        // Mirror the live chat: split speaker/consequence into speaker bubbles,
        // render the pick as an action note or a blue reply bubble.
        // Same back-to-back grouping as the live chat: name label only on the
        // first bubble of a same-speaker run (txSeg tracks the previous kind).
        let txLast = null;
        const txSeg = (kind, text, actionNote) => {
          if(kind==='image') return '';   // screenshots aren't repeated in the transcript
          const same = (kind !== 'system' && kind === txLast);
          txLast = kind;
          if(actionNote) return bubbleMarkup('system', text, '');
          const who = (kind==='system' || same) ? '' : (kind==='you' ? (firstName()||'You') : U.name);
          return bubbleMarkup(kind, text, who);
        };
        tx.innerHTML = `<h3 style="margin-bottom:0.375rem">Conversation transcript</h3>` +
          `<div class="chat txchat">` +
          transcript.map(t=>{
            let h='';
            if(t.speaker) splitDialogue(t.speaker).forEach(s=> h+=txSeg(s.kind, s.text));
            h += t.say ? txSeg('you', t.say)
               : isAction(t.picked) ? txSeg('system', actionNoteText(t.picked), true)
               : txSeg('you', t.picked);
            if(t.consequence) splitDialogue(t.consequence).forEach(s=> h+=txSeg(s.kind, s.text));
            if(t.feedback){ txLast = null; h += `<div class="coachfb ${COACH_TITLES[t.verdict]?t.verdict:'partial'} tx"><div class="coachfb-head"><span class="coachfb-dot"></span>${escapeHtml(t.fbTitle || COACH_TITLES[t.verdict] || COACH_TITLES.partial)}</div><p class="coachfb-text">${escapeHtml(px(t.feedback))}</p></div>`; }
            return h;
          }).join('') + `</div>`;
        tx.style.display='block'; btn.textContent='Hide conversation transcript';
      } else { tx.style.display='none'; btn.textContent='View conversation transcript'; }
    };
  }

  /* ---- boot ---- */
  if(IS_CALL_TAB && window.opener) bootCallTab(); else renderMeet();

  /* Signal the Rise 360 code block that the project has loaded and can display. */
  try { window.parent.postMessage({ type: 'complete' }, '*'); } catch(e){}
})();
</script>
<script id="callmode">
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const cm = { audio:null, analyser:null, data:null, meterFill:null, rafId:null,
               peak:0, recognizing:false,
               volLog:[],     // one entry per SPOKEN response: level, zone, when, what
               curFrames:[], t0:0, t1:0,   // loudness frames for the response being spoken now
               timeline:[],   // [seconds into recording, loudest level in that 0.1s, speaking?]
               recStart:0, recEnd:0,       // first capture happened / call ended (performance.now())
               recAccum:0, segStart:0,     // seconds recorded so far / start of the turn being spoken now
               src:null, dest:null,        // this turn's mic source / the recorder's input
               voiceMode:false,            // true once the learner is taking the call by voice
               stream:null, recorder:null, chunks:[] };  // call-recording capture

  /* ---- The "good volume" zone ----
     Matches the green band of the live meter (0.30 to 0.88 on the same 0..1
     scale). Each spoken response is scored by its typical speaking level (the
     80th percentile of its voiced frames), so a whisper, a normal voice and a
     shout land in different places instead of averaging out. Tune these two
     numbers if real headset tests read consistently high or low. */
  const ZONE_LOW = 0.25, ZONE_HIGH = 0.88;   // LOW matches where the meter/graph turns yellow-green
  /* Seconds into the RECORDING. The clock only runs while the learner is
     speaking (mic button on), matching the recording, which is paused between
     turns, so graph, volume events and playback all line up. */
  function relNow(){ return cm.recAccum + (cm.segStart ? (performance.now() - cm.segStart) / 1000 : 0); }

  // Words too common to help distinguish one choice from another.
  const STOP = new Set(("a an the and or but so to of in on at for with your you "+
    "i we they it is are be do does can could would should how what that this "+
    "them then just let me my our their his her him she he as if into about "+
    "okay ok hi hey please thanks thank got get go going want need see look "+
    "us up out now here there yes no not").split(/\s+/));

  function norm(s){ return String(s||'').toLowerCase()
      .replace(/\[action\]/gi,' ').replace(/[^a-z0-9\s]/g,' ')
      .replace(/\s+/g,' ').trim(); }
  function tokens(s){ return norm(s).split(' ')
      .map(w=>w.replace(/(ing|ed|es|s)$/,''))          // crude stemming
      .filter(w=>w.length>2 && !STOP.has(w)); }

  // Build the text we match each spoken answer AGAINST. Prefer `say` (the exact
  // words the Expert would speak); fall back to the button label.
  function targetText(ch){ return (ch.say ? ch.say + ' ' : '') + (ch.text||''); }

  // Score how well the transcript matches a choice: count of shared content
  // words, each weighted by how DISTINCTIVE it is across the visible choices
  // (a word appearing in only one choice is worth more than a shared one).
  function scoreChoices(transcript, choiceBtns){
    const heard = new Set(tokens(transcript));
    const sets = choiceBtns.map(c=>new Set(tokens(targetText(c.choice))));
    const df = {}; sets.forEach(set=>set.forEach(w=>{ df[w]=(df[w]||0)+1; }));
    return choiceBtns.map((c,idx)=>{
      let score=0;
      sets[idx].forEach(w=>{ if(heard.has(w)) score += 1/(df[w]||1); });
      return { ...c, score, idx };
    }).sort((a,b)=>b.score-a.score);
  }

  /* Chrome can start an AudioContext paused ("suspended"), especially inside a
     course frame or when the Allow prompt took a few seconds. A paused context
     reads pure silence even while the mic records (testing: Wix Smart showed the
     red recording dot but the meter never moved). Resume it now, and again on
     the learner's next click or key press if the browser refused. */
  function wakeAudio(ctx){
    if(!ctx || ctx.state !== 'suspended') return;
    const go = ()=>{ if(ctx.state === 'suspended') ctx.resume().catch(()=>{}); };
    go();
    const onGesture = ()=>{ go(); if(ctx.state !== 'suspended'){ document.removeEventListener('pointerdown', onGesture, true); document.removeEventListener('keydown', onGesture, true); } };
    document.addEventListener('pointerdown', onGesture, true);
    document.addEventListener('keydown', onGesture, true);
  }

  /* ---- Live volume meter (Web Audio) — initialised once, on first mic use ---- */
  /* ---- Mic: opened on "Click to start speaking", released on stop ----
     Testing update: nothing is heard, transcribed or recorded unless the mic
     button is on. Each turn opens a fresh mic stream and closes it when the
     learner clicks stop (or a response is tapped), so the browser's mic is off
     between turns. Opening it fresh also re-checks permission on every click:
     if access isn't granted (never given, dismissed, or switched off mid-call)
     the browser asks again before the learner can speak. One AudioContext and
     one recorder live for the whole call; the recorder is paused between turns. */
  function ensureCtx(){
    if(cm.audio){ wakeAudio(cm.audio); return; }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    wakeAudio(ctx);
    const an = ctx.createAnalyser(); an.fftSize = 1024;
    cm.audio = ctx; cm.analyser = an; cm.data = new Uint8Array(an.fftSize);
    try{ cm.dest = ctx.createMediaStreamDestination(); }catch(_){ cm.dest = null; }   // what the recorder records
    loopMeter();
  }
  async function micPermission(){
    try{ return (await navigator.permissions.query({ name:'microphone' })).state; }catch(_){ return ''; }
  }
  // onAsk() runs when the browser is about to show its Allow prompt.
  async function openMic(onAsk){
    closeMic();
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unavailable');
      ensureCtx();   // before any await, while the click still counts as a user gesture (lets audio start in a course frame)
      if(onAsk && (await micPermission()) !== 'granted') onAsk();
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      const track = stream.getAudioTracks()[0];
      if(!track || track.readyState !== 'live'){
        stream.getTracks().forEach(t=>t.stop());
        const e = new Error('The microphone track is not live'); e.name = 'NotReadableError'; throw e;
      }
      cm.stream = stream;
      wakeAudio(cm.audio);
      cm.src = cm.audio.createMediaStreamSource(stream);
      cm.src.connect(cm.analyser);
      if(cm.dest) cm.src.connect(cm.dest);
      if(!cm.recStart) cm.recStart = performance.now();
      return true;
    } catch(e){ cm.lastError = e; closeMic(); return false; }
  }
  function closeMic(){
    try{ if(cm.src) cm.src.disconnect(); }catch(_){}
    cm.src = null;
    try{ (cm.stream && cm.stream.getTracks() || []).forEach(t=>t.stop()); }catch(_){}
    cm.stream = null;
  }

  /* ---- Call recording (MediaRecorder) — one file per attempt ----
     Records ONLY while the mic button is on: it starts on the first spoken turn,
     pauses when the learner clicks stop and resumes on their next turn, so the
     file is the learner's spoken turns back to back. stopRecording() (called at
     end-of-call) returns the finished audio Blob for upload. Records the
     learner's side only — the caller's lines are scripted text, not audio.
     If MediaRecorder or a supported codec is missing, it silently no-ops. */
  function pickMime(){
    const cands = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    if(typeof MediaRecorder==='undefined' || !MediaRecorder.isTypeSupported) return '';
    for(const m of cands){ if(MediaRecorder.isTypeSupported(m)) return m; }
    return '';
  }
  function startRecording(stream){
    if(cm.recorder || typeof MediaRecorder==='undefined') return;
    try{
      const mime = pickMime();
      cm.recorder = mime ? new MediaRecorder(stream, { mimeType:mime })
                         : new MediaRecorder(stream);
      cm.chunks = [];
      cm.recorder.ondataavailable = e => { if(e.data && e.data.size) cm.chunks.push(e.data); };
      cm.recorder.start();   // one blob at stop; simplest and reliable for a POC
    } catch(e){ cm.recorder = null; }
  }
  function recResume(){
    if(!cm.dest) return;
    if(!cm.recorder) startRecording(cm.dest.stream);
    else if(cm.recorder.state === 'paused'){ try{ cm.recorder.resume(); }catch(_){} }
  }
  function recPause(){
    if(cm.recorder && cm.recorder.state === 'recording'){ try{ cm.recorder.pause(); }catch(_){} }
  }
  function stopRecording(){
    if(cm.segStart){ cm.recAccum += (performance.now() - cm.segStart) / 1000; cm.segStart = 0; }
    cm.recognizing = false;
    if(!cm.recEnd) cm.recEnd = performance.now();   // the call is over: freeze the timeline
    return new Promise(resolve => {
      const rec = cm.recorder;
      // Always release the mic when the call ends, recorder or not.
      const releaseMic = closeMic;
      if(!rec || rec.state === 'inactive'){ releaseMic(); resolve(null); return; }
      rec.onstop = () => {
        const type = (cm.chunks[0] && cm.chunks[0].type) || rec.mimeType || 'audio/webm';
        const blob = cm.chunks.length ? new Blob(cm.chunks, { type }) : null;
        cm.recorder = null; cm.chunks = [];
        releaseMic();
        resolve(blob);
      };
      try{ rec.stop(); }catch(e){ releaseMic(); resolve(null); }
    });
  }

  // Mic sensitivity: how much the raw level is boosted before it hits the 0..1
  // meter. Used by the in-call meter AND the intro mic test so they always match.
  const MIC_GAIN = 3.2;
  function level(){ // RMS -> 0..1, lightly boosted so normal speech reads mid-scale
    if(!cm.analyser) return 0;
    cm.analyser.getByteTimeDomainData(cm.data);
    let sum=0; for(let i=0;i<cm.data.length;i++){ const v=(cm.data[i]-128)/128; sum+=v*v; }
    return Math.min(1, Math.sqrt(sum/cm.data.length) * MIC_GAIN);
  }
  /* Whole-bar color for the CURRENT loudness. Only "too quiet" gets a warning
     color, and it's yellow, not red, so the meter never reads as failing.
     Average through loud is green (testing: red/amber at normal volume caused stress). */
  const METER_STOPS = [
    [0.00, [232,195,  0 ]],   // yellow      — too quiet
    [0.20, [232,195,  0 ]],   // yellow      — just under the projection threshold mark
    [0.30, [143,203,  0 ]],   // yellow-green — entering the good zone
    [0.42, [ 95,178,  0 ]],   // green       — good projection
    [1.00, [ 62,138,  0 ]]    // deeper green — loud is fine
  ];
  function meterColor(L){
    L = Math.max(0, Math.min(1, L));
    for(let i=1;i<METER_STOPS.length;i++){
      const [p1,c1]=METER_STOPS[i-1], [p2,c2]=METER_STOPS[i];
      if(L<=p2){
        const t=(L-p1)/(p2-p1||1);
        const r=Math.round(c1[0]+(c2[0]-c1[0])*t);
        const g=Math.round(c1[1]+(c2[1]-c1[1])*t);
        const b=Math.round(c1[2]+(c2[2]-c1[2])*t);
        return `rgb(${r},${g},${b})`;
      }
    }
    return `rgb(79,163,0)`;
  }
  function loopMeter(){
    // Calm the meter for EVERYONE by default: (1) exponential smoothing damps
    // spikes, (2) the width is quantized to steps so it doesn't twitch, (3)
    // repaints are throttled. Low-motion is the baseline — not gated behind the
    // OS setting. When the OS "reduce motion" setting is on, it's calmer still.
    const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const EMA      = reduce ? 0.07 : 0.12;   // lower = smoother / slower to react
    const STEP_PCT = reduce ? 12   : 8;      // quantize width to whole % steps
    const INTERVAL = reduce ? 260  : 150;    // ms between DOM repaints
    let smoothed = 0, lastPaint = 0, lastPct = -1, lastBucket = -1;
    let lastSample = 0, winMax = 0, winSpk = false;
    const step = (ts)=>{
      const L = level();
      if(cm.recognizing){ cm.peak = Math.max(cm.peak, L); cm.curFrames.push(L); }
      if(cm.segStart && !cm.recEnd){         // timeline for the results graph (only while the mic is on)
        winMax = Math.max(winMax, L); if(cm.recognizing) winSpk = true;
        if(ts - lastSample >= 100){ cm.timeline.push([relNow(), winMax, winSpk ? 1 : 0]); winMax = 0; winSpk = false; lastSample = ts; }
      }
      smoothed += (L - smoothed) * EMA;      // low-pass filter
      if(cm.meterFill && (ts - lastPaint) >= INTERVAL){
        lastPaint = ts;
        const pct = Math.round(smoothed*100 / STEP_PCT) * STEP_PCT;
        if(pct !== lastPct){ cm.meterFill.style.width = pct + '%'; lastPct = pct; }
        const bucket = Math.round(smoothed / 0.05);           // recolor per 5% band
        // Grey while the mic is off, so pauses never look like a warning.
        const b2 = cm.recognizing ? bucket : -2;
        if(b2 !== lastBucket){ cm.meterFill.style.background = cm.recognizing ? meterColor(smoothed) : '#D5DBE3'; lastBucket = b2; }
      }
      cm.rafId = setTimeout(()=>step(performance.now()), 16);
    };
    // A timer, not requestAnimationFrame: some course frames pause animation
    // frames, which would freeze the meter and leave Voice and Projection with no samples.
    cm.rafId = setTimeout(()=>step(performance.now()), 16);
  }

  /* ---- Attach the voice panel to the current screen's composer ---- */
  function attach(scr, choiceBtns){
    const panel = document.getElementById('voicepanel');
    const choicesWrap = document.getElementById('choices');
    const label = document.getElementById('choicesLabel');
    if(!panel) return;

    // ACTION-ONLY step (every option is an [Action], i.e. something the Expert
    // DOES, not says): nothing to say aloud, so the mic is shown switched off.
    const actionOnly = choiceBtns.length && choiceBtns.every(c => /^\s*\[Action\]/i.test(c.choice.text||'') && !c.choice.say);
    if(actionOnly){
      cm.meterFill = null;
      panel.innerHTML = `
        <div class="voice voice-off">
          <div class="voice-row"><button class="mic-btn" type="button" disabled><span class="mic-ico"></span>Click to start speaking</button></div>
          <p class="voice-status">This step is an action, not something you say. Tap the action you'd take.</p>
        </div>`;
      if(label) label.textContent = "Tap the action you'd take";
      return;
    }

    // All response options stay VISIBLE — the learner reads one aloud (or taps it).
    if(!SR){
      panel.innerHTML = `<div class="voice-unsupported">Speak-aloud isn't supported in this browser
        (use Chrome or Edge). You can still tap a response above.</div>`;
      return;
    }

    panel.innerHTML = `
      <div class="voice">
        <div class="voice-row">
          <button class="mic-btn" id="micBtn" type="button" aria-pressed="false"><span class="mic-ico"></span>Click to start speaking</button>
          <div class="meter"><div class="meter-fill" id="meterFill"></div><div class="meter-mark" style="left:22%"></div></div>
        </div>
        <p class="voice-status" id="vStatus">Click the mic, read your chosen response aloud as you would on a real call, then click it again to stop.</p>
        <div class="voice-confirm" id="vConfirm" style="display:none"></div>
      </div>`;
    cm.meterFill = document.getElementById('meterFill');
    const micBtn = document.getElementById('micBtn');
    const vStatus = document.getElementById('vStatus');
    const vConfirm = document.getElementById('vConfirm');

    let committed=false;

    function say(html){ vStatus.innerHTML = html; }

    // How much of the option was actually said, in order: the share of the
    // option's words (every word, not just key words) found in sequence in what
    // was heard. ~1.0 when the learner reads it (nearly) verbatim. Counting every
    // word keeps one misheard word in a short option from sinking the match
    // (testing: "Wix" heard as "me" failed a near-exact read). Placeholders like
    // [Name] are skipped: the learner says their own name, not the word "name".
    function speechWords(str){
      return String(str||'').toLowerCase()
        .replace(/\[[^\]]*\]/g, ' ')
        .replace(/['’]/g, '').replace(/(\w)-(\w)/g, '$1$2')       // I'm → im, e-commerce → ecommerce
        .replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean)
        .map(w=>({ wicks:'wix', wiks:'wix', weeks:'wix', wix:'wix' }[w] || w)   // common mishearings of the brand
               .replace(/(.)\1+/g, '$1'));                              // cancelled ~ canceled
    }
    function coverage(said, ch){
      const t = speechWords(targetText(ch)), h = speechWords(said);
      if(!t.length) return 0;
      let prev = new Array(h.length+1).fill(0);                     // longest common subsequence
      for(const w of t){ const cur=[0];
        for(let j=0;j<h.length;j++) cur.push(w===h[j] ? prev[j]+1 : Math.max(prev[j+1], cur[j]));
        prev = cur; }
      return prev[h.length] / t.length;
    }

    function finish(said){
      if(!said){ say(`I didn't hear anything. Click the mic, speak up, then click it again to stop.`); return; }

      const pool = choiceBtns.filter(c=>!c.disabled);
      const ranked = scoreChoices(said, pool);
      const top = ranked[0];
      choiceBtns.forEach(c=>c.btn.classList.remove('matched'));

      if(!top || top.score <= 0){
        say(`<span class="heard">“${escapeText(said)}”</span><br>I couldn't match that to a response — read one of the options aloud, or tap it.`);
        return;
      }

      // Testing update: a response only counts when the learner says (nearly) all
      // of it. Reading just the first sentence of a longer option is not a match:
      // nothing is sent and they're asked to try again with the whole response.
      // FULL_MATCH: the whole response has to be attempted aloud, but it leaves
      // room for about 1 misheard or skipped word in 5. Saying only the first
      // half (or first sentence) of an option stays under it and gets a retry.
      const FULL_MATCH = 0.8;
      // Highest coverage wins; ties keep the distinctive-word ranking (sort is stable).
      const best = ranked.map(r=>({ ...r, cov: coverage(said, r.choice) })).sort((a,b)=>b.cov - a.cov)[0];

      if(best && best.cov >= FULL_MATCH){
        best.btn.classList.add('matched');
        say(`<span class="heard">“${escapeText(said)}”</span> &nbsp;Matched. Sending…`);
        committed = true;
        setTimeout(()=>commit(best), 600);   // brief beat so the learner sees the match
        return;
      }

      // Partial → retry. Nothing is highlighted, so the retry doesn't hint at an answer.
      say(`<span class="heard">“${escapeText(said)}”</span><br>That wasn't a full response. Click the mic and read your chosen response all the way through, or tap it.`);
      vConfirm.style.display='flex'; vConfirm.innerHTML='';
      const again=document.createElement('button'); again.className='vc-no'; again.textContent='Try again';
      again.onclick=()=>{ vConfirm.style.display='none'; micBtn.click(); };   // starts listening again
      vConfirm.appendChild(again);
    }

    function commit(match){ if(!match) return;
      // Record THIS spoken response's peak loudness for the end-of-call
      // projection summary (only voice-driven selections land here; tapping a
      // choice directly doesn't, which is correct — no voice to measure).
      logSpoken('response', scr.prompt, match.btn.textContent.replace(/^\s*Action\s*/, ''));
      if(match.btn._choose) match.btn._choose(); else match.btn.click(); }  // reuse the engine's real scoring path

    // Click to start, click again to stop (toggle).
    bindToggleMic(micBtn, {
      idleLabel: 'Click to start speaking',
      beforeStart: async ()=>{
        const ok = await openMic(()=>say('Your browser will ask to use your microphone. Choose <b>Allow</b> to start speaking.'));
        if(!ok){ micErrorMessage(cm.lastError).then(h=>say(h + ' Click the mic to try again, or tap a response above.')); return false; }
        return true;
      },
      onStart: ()=>{
        committed=false;
        vConfirm.style.display='none'; vConfirm.innerHTML='';
        choiceBtns.forEach(c=>c.btn.classList.remove('matched'));
        say('Listening… Read your response, then click the mic again to stop.');
      },
      onHeard: t=>say(`<span class="heard">“${escapeText(t)}”</span>`),
      onError: err=>say(`<span style="color:#C81C0F">Didn't catch that (${escapeText(err)}). Click the mic to try again.</span>`),
      onDone: finish
    });
  }

  /* ---- Click-to-talk mic (toggle) ----
     Click once to start listening, click again to stop; only then is what was
     heard matched and sent. Chrome's recognizer ends by itself after a short
     pause, even with continuous=true. While the learner hasn't clicked stop we
     quietly restart it and keep everything heard so far, so a pause mid-sentence
     never submits a response early (testing: an answer was picked before the
