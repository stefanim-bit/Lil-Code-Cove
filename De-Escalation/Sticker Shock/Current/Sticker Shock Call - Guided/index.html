<!--
==================================================================================
  WIX L&D  ·  PRACTICE SESSION  ·  INTERACTIVE SCENARIO TEMPLATE  (Rise Code Block)
  v2 — Wix-branded redesign. SAME interaction/scoring model as v1; look only.
==================================================================================

  HOW TO READ THIS FILE (for stakeholders / non-coders)
  -----------------------------------------------------
  Two parts, on purpose:
    1) THE SCENARIO  (<script id="scenario">) — the CONTENT. Reads like a table.
    2) THE ENGINE    (<script id="engine">)   — the machinery that plays ANY scenario.

  WHAT CHANGED IN v2 (design only — the model below is unchanged)
  --------------------------------------------------------------
    • Wix Madefor typography (Display for headings, Text for body) via Google Fonts.
    • Three phases in one self-contained embed: MEET THE USER → LIVE CHAT → COMPLETE.
    • The live chat mirrors the real Wix Communication Panel: gray customer bubbles
      (left), blue agent bubbles (right), a call timer, and a red "End" button.
      (No sentiment chip — deliberately omitted.)
    • Brand palette applied. The END scorecard keeps the locked correctness legend
      (green / amber / red · done / partial / missed) — unchanged.
    • Helper pop-ups use the native <dialog> element (MDN-recommended for modals).

  THE INTERACTION MODEL (unchanged from v1)
  -----------------------------------------
  Each scenario mirrors a real Expert <-> user interaction across eight graded
  behaviors (the rubric, 100 pts):
     open(5) · dynamics(10) · familiarize(10) · clarify(15)
     roadmap(10) · article(20) · recreate(10) · solve(20)

  Rules:
    • FEEDBACK IS SAVED FOR THE END. No grade, no correctness colors, no running
      score during play. Choosing an answer simply advances the call.
    • IN-CHARACTER REACTIONS ARE NOT FEEDBACK. A weak choice may draw a caller
      reaction in dialogue; that line is part of the sim, not a grade.
    • MOSTLY GATED, SOME FREEDOM — "gate:true" screens must be finished to advance.
    • RETRY ONLY IF THE USER PROMPTS — a choice marked "retry:true" re-opens the
      screen because the caller pushed back; the retry is capped by "capIfRetried".
    • SKIPS ARE RECOVERABLE — each stage keeps its own best score.
    • GUIDED MODE (SCENARIO.guided:true) — a choice with `feedback` shows a
      coaching card after the caller's reaction. retry:true = learner must try
      again; retry:"optional" = learner picks Try again or Continue (points are
      recorded only on Continue); no retry = Continue. capIfRetried caps the
      retry pick. Guided calls allow ONE retry per screen: on the retry pass any
      pick is scored and the call moves on (a pick whose goTo is the same screen
      advances to the correct choice's goTo). Optional `feedbackTitle`
      overrides the card heading (default by verdict: Not quite / Almost there /
      Nice work). Feedback is also shown in the end-of-call transcript.
    • ROADMAP FLOATS — attach roadmap credit to any choice via credits:[...].

  FIELD GUIDE
  -----------
    user   : { name, image, bio } — shown on the MEET screen and in the call header.
    STAGE  : id, name, max, strength (shown at end if done), improvement (if missed).
    SCREEN : stage, gate, speaker (caller line), prompt, choices[].
    CHOICE : text, verdict, points, goTo, credits[], retry/capIfRetried,
             retryOnly (hidden until the screen re-opens for a retry),
             consequence, stageOverride.
==================================================================================
-->

<style>
  :root{
    /* ---- Brand palette (the exact hexes supplied) ---- */
    --ink:#242424; --ink-2:#424242; --muted:#707070;
    --line:#E0E0E0; --line-2:#D1D1D1; --bg:#F5F5F5; --paper:#ffffff;
    --brand:#DA3B01;                 /* Wix orange-red — the End button + accents   */
    --agent:#0F62E6; --agent-deep:#1464A0;  /* agent (you) blue                     */
    --positive:#5BBE7E;
    --agent-bubble:#EAF1FE; --agent-bubble-line:#CFE0FF;
    /* ---- LOCKED end-screen correctness legend (scorecard only) ---- */
    --correct:#38761d; --correct-bg:#D9EAD3;
    --partial:#bf9000;  --partial-bg:#FFF2CC;
    --incorrect:#cc0000;--incorrect-bg:#F4CCCC;
    /* ---- shape ---- */
    --r-lg:1.25rem; --r-md:0.875rem; --r-sm:0.625rem;
    --shadow:0 0.625rem 1.875rem rgba(20,24,40,.10);
    --font-display:'Wix Madefor Display','Wix Madefor Text',system-ui,Arial,sans-serif;
    --font-text:'Wix Madefor Text',system-ui,Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  html{font-size:16px}
  html,body{margin:0}
  body{
    font-family:var(--font-text); color:var(--ink); line-height:1.5;
    background:
      radial-gradient(68.75rem 31.25rem at 12% -10%, #EEF3FF 0%, rgba(238,243,255,0) 60%),
      radial-gradient(56.25rem 31.25rem at 105% 0%, #F3F0FA 0%, rgba(243,240,250,0) 55%),
      var(--bg);
    min-height:100vh;
  }
  .app{max-width:66.25rem;margin:0 auto;padding:1.5rem 1.25rem}
  h1,h2,h3{font-family:var(--font-display);letter-spacing:-.01em;margin:0}
  .display{font-weight:800;line-height:1.05}

  /* ============================ MEET THE USER ============================ */
  .meet{
    display:grid;grid-template-columns:0.37fr 0.65fr;gap:0;
    background:var(--paper);border:0.0625rem solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow);overflow:hidden;height:37.5rem;
  }
  .meet .portrait{
    position:relative;
    background:#fff;
    display:flex;align-items:center;justify-content:center;padding:0;
    overflow:hidden;min-height:0;
  }
  /* Full-bleed cropped headshot — matches Amber's meet spec and the Layers
     scenario: `cover` fills the container so the photo's own background always
     reaches every edge and never leaves a gap. Use this for all future scenarios. */
  .meet .portrait img{width:100%;height:100%;object-fit:cover}
  .meet .portrait .noimg{align-self:center;color:var(--muted);font-size:0.875rem;text-align:center;padding:1.5rem}
  .meet .body{padding:2.5rem 3.75rem;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-size:0.75rem;font-weight:700;color:#101585;text-transform:uppercase;letter-spacing:0;margin-bottom:0.625rem}
  .meet .body h1{font-weight:400;font-size:2.5rem;line-height:2.625rem;margin-bottom:1.125rem;color:#000000}
  .meet .body p{font-size:1rem;color:#000000;line-height:1.5rem;margin:0 0 1.75rem;max-width:65ch}

  /* black pill buttons — matches the Rise course (Get Started / Next / Restart) */
  .btn{font-family:var(--font-text);font-weight:500;font-size:0.875rem;cursor:pointer;border:0;border-radius:18.75rem;padding:0.375rem 1.5rem;transition:transform .12s ease, box-shadow .12s ease, background .12s ease, padding .12s ease;display:flex;align-items:center;justify-content:center;white-space:nowrap;position:relative}
  .btn-dark{background:#000000;color:#fff;width:126px;height:32px;padding:0.375rem 1.5rem}
  .btn-dark:hover{background:#000;padding:0.375rem 1rem}
  .btn-arrow{width:11px;height:8px;opacity:0;margin-left:-11px;transition:opacity 200ms ease-out, margin-left 200ms ease-out;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
  .btn-arrow svg{width:100%;height:100%;display:block}
  .btn-dark:hover .btn-arrow{opacity:1;margin-left:0.3125rem}
  .btn-ghost{background:var(--paper);color:var(--ink);border:0.0625rem solid var(--line-2)}
  .btn-ghost:hover{border-color:var(--ink)}

  /* ============================ THE CALL (Communication Panel) ============================ */
  .panel{position:relative;background:var(--paper);border:0.0625rem solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;height:600px;display:flex;flex-direction:column}
  .panel-head{display:flex;align-items:center;gap:0.75rem;padding:0.875rem 1.125rem;border-bottom:0.0625rem solid var(--line);background:#fff;flex:0 0 auto}
  .avatar{width:2.375rem;height:2.375rem;border-radius:50%;background:var(--agent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:0.9375rem;flex:0 0 auto}
  .who-name{font-weight:700;font-size:0.9375rem}
  .who-sub{display:flex;align-items:center;gap:0.5rem;color:var(--muted);font-size:0.78125rem;margin-top:0.0625rem}
  .livedot{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--positive);display:inline-block;box-shadow:0 0 0 0.1875rem rgba(91,190,126,.20)}
  .timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2)}
  .head-spacer{flex:1}
  .helperbar-head{display:flex;gap:0.5rem;margin-right:0.5rem}
  .btn-end{background:var(--brand);color:#fff;font-weight:700;font-size:0.875rem;border:0;border-radius:0.5rem;padding:0.5625rem 1.125rem;cursor:pointer}
  .btn-end:hover{filter:brightness(.94)}


  /* Fixed height so the chat window stays the SAME SIZE for the whole call —
     it no longer grows message-by-message; overflow scrolls internally. */
  /* Fixed-height chat window: it stays ONE consistent size on every screen and
     scrolls internally, so the response options below always sit on screen and
     can be read in full without scrolling the page. 40vh is tuned so the
     options fit for the common (≤4 option) screens. */
  .chat{padding:1rem 1.125rem 3.5rem;display:flex;flex-direction:column;gap:0.875rem;flex:1;min-height:0;overflow-y:auto}
  .msg{display:flex;flex-direction:column;max-width:78%}
  .msg .meta{font-size:0.6875rem;color:var(--muted);margin:0 0 0.25rem}
  .bubble{padding:0.6875rem 0.875rem;border-radius:1rem;font-size:0.90625rem;line-height:1.45}
  .msg.caller{align-self:flex-start;align-items:flex-start}
  .msg.caller .bubble{background:#F5F5F5;border:0px;border-top-left-radius:0.3125rem;color:var(--ink)}
  .msg.you{align-self:flex-end;align-items:flex-end}
  .msg.you .meta{text-align:right;color:#707070}
  .msg.you .bubble{background:#E4EFFE;border:0px;border-top-right-radius:0.3125rem;color:var(--ink)}
  .msg.system{align-self:center;max-width:90%;align-items:center}
  .msg.system .bubble{background:transparent;border:0;color:var(--muted);font-style:normal;font-size:0.78125rem;padding:0.125rem 0.375rem;text-align:center}
  /* Inline screenshot figure (Layers panel, Accessibility Wizard, etc.) */
  .msg.system .screenshot{margin:0.25rem 0;max-width:100%;display:flex;flex-direction:column;align-items:center}
  .msg.system .screenshot img{max-width:100%;height:auto;border:0.0625rem solid var(--line);border-radius:0.5rem;box-shadow:0 0.125rem 0.5rem rgba(0,0,0,0.08);display:block;cursor:zoom-in}
  /* Expert-sent screenshot ([image] line in a consequence): right-side, like an Expert message */
  .msg.you .screenshot{margin:0.25rem 0;max-width:100%}
  .msg.you .screenshot img{max-width:100%;height:auto;border:0.0625rem solid var(--line);border-radius:0.5rem;box-shadow:0 0.125rem 0.5rem rgba(0,0,0,0.08);display:block;cursor:zoom-in}

  /* Lightbox: click-to-enlarge overlay for inline screenshots */
  .lightbox{border:0;padding:0;background:transparent;max-width:95vw;max-height:95vh}
  .lightbox::backdrop{background:rgba(15,17,25,0.82)}
  .lightbox img{display:block;max-width:95vw;max-height:95vh;object-fit:contain;border-radius:0.5rem;box-shadow:0 1.5rem 3rem rgba(0,0,0,0.35)}
  .lightbox-close{position:fixed;top:1rem;right:1.5rem;background:rgba(255,255,255,0.92);border:0;border-radius:50%;width:2.5rem;height:2.5rem;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--ink)}
  .lightbox-close:hover{background:#fff}
  .lightbox-caption{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);max-width:min(90vw,40rem);background:rgba(255,255,255,0.94);color:var(--ink);font-size:0.875rem;line-height:1.4;padding:0.5rem 0.875rem;border-radius:0.5rem;text-align:center}
  .msg.system .screenshot figcaption{font-size:0.6875rem;color:var(--muted);font-style:italic;margin-top:0.375rem;text-align:center}
  .msg.system .screenshot .noimg{color:var(--muted);font-size:0.8125rem;padding:1rem;border:0.0625rem dashed var(--line);border-radius:0.5rem}

  /* [Action] choices render their result as an inline centered system note in the
     chat stream (reusing .msg.system), so there's no separate action bar. */
  .msg.system .bubble.action{font-style:normal;color:#242424;background:none;border:none;border-radius:62.4375rem;padding:0.25rem 0.75rem}

  /* Inline notes — the centered "system" bubbles only: an action you take
     ("You clone the site…") or a thing you find ("(You find…)"). These are the
     ONLY lines painted green; caller replies are untouched. */
  .msg.reaction .bubble,
  .msg.reaction .bubble.action{color:#242424 !important}

  /* legacy in-header fullscreen text button (replaced by the .fs-fab icon) */
  .btn-fs{background:none;border:0;color:var(--muted);font-family:var(--font-text);font-weight:600;font-size:0.875rem;cursor:pointer;padding:0.4375rem 0.625rem;border-radius:62.4375rem;display:inline-flex;align-items:center;gap:0.375rem}
  .btn-fs:hover{color:var(--agent);background:var(--agent-bubble)}
  .panel:fullscreen{border-radius:0;display:flex;flex-direction:column;overflow:auto}
  .panel:fullscreen .chat{min-height:0;flex:1}
  /* Fullscreen toggle — a round icon that lives OUTSIDE the chat panel (top-right). */
  .sim-wrap{position:relative;padding-top:3rem}
  .fs-fab{position:absolute;top:0;right:0;width:2.25rem;height:2.25rem;padding:0;border:0;border-radius:50%;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0.0625rem 0.25rem rgba(20,24,40,.14);transition:transform .12s ease}
  .fs-fab:hover{transform:scale(1.08)}
  .fs-fab svg{width:100%;height:100%;display:block}
  .sim-wrap:fullscreen{padding-top:0;background:var(--bg);display:flex;flex-direction:column}
  .sim-wrap:fullscreen .panel{flex:1;height:auto;border-radius:0;display:flex;flex-direction:column;overflow:auto}
  .sim-wrap:fullscreen .chat{min-height:0;flex:1}
  .sim-wrap:fullscreen .fs-fab{top:0.75rem;right:0.75rem;z-index:20}
  /* In fullscreen the round fullscreen icon floats at the panel's top-right and
     would sit on top of the End button. Pad the header right so the buttons
     shift left and clear the icon. */
  .sim-wrap:fullscreen .panel-head{padding-right:3.5rem}
  /* One fullscreen element for the whole activity (#app), so fullscreen turned on
     in the intro carries into the call instead of fighting the call's own button. */
  .app:fullscreen:has(.sim-wrap){padding:0;display:flex;flex-direction:column}
  .app:fullscreen .sim-wrap{flex:1;min-height:0;padding-top:0;background:var(--bg);display:flex;flex-direction:column}
  .app:fullscreen .sim-wrap .panel{flex:1;height:auto;border-radius:0;display:flex;flex-direction:column;overflow:auto}
  .app:fullscreen .sim-wrap .chat{min-height:0;flex:1}
  .app:fullscreen .sim-wrap .panel-head{padding-right:3.5rem}
  .app:fullscreen .fs-pill .fs-label{display:none}
  .app:fullscreen .intro-fs .fs-label{display:inline}
  .app:fullscreen .sim-wrap .fs-pill{padding:0 0.25rem}
  .app:fullscreen .sim-wrap .top-tools{top:0.75rem;right:0.75rem;z-index:20}

  /* "Action" badge on choices — distinguishes actions (things the Expert DOES)
     from spoken replies, right inside the choice button. */
  .cbadge{display:inline-block;font-weight:700;font-size:0.625rem;text-transform:uppercase;letter-spacing:.05em;color:var(--agent-deep);background:var(--agent-bubble);border:0.0625rem solid var(--agent-bubble-line);border-radius:0.375rem;padding:0.0625rem 0.375rem;margin-right:0.5rem;vertical-align:0.05rem}

  /* composer / decision area — where the real panel's message box sits */
  .composer{border-top:0.0625rem solid var(--line);background:#FBFBFC;padding:0.875rem 1.125rem 1.125rem}
  /* ===== CALL MODE — speak-aloud voice panel ===== */
  .voice{border:0.0625rem solid #D6E6FE;background:#F7FAFF;border-radius:0.75rem;padding:0.875rem 1rem;margin:0 0 0.75rem}
  .voice-row{display:flex;align-items:center;gap:0.75rem}
  .mic-btn{flex:none;display:inline-flex;align-items:center;gap:0.5rem;font-family:var(--font-text);font-size:0.9375rem;font-weight:700;color:#fff;background:#116DFF;border:none;border-radius:62rem;padding:0.625rem 1.125rem;cursor:pointer;transition:background .15s,transform .05s}
  .mic-btn:hover{background:#0F5EDB}
  .mic-btn:active{transform:scale(.98)}
  .mic-btn.listening{background:#E62214}
  .mic-btn.listening:hover{background:#C81C0F}
  .mic-btn:disabled{background:#B7C7E3;cursor:default}
  .mic-ico{width:0.875rem;height:0.875rem;border-radius:62rem;background:#fff;display:inline-block}
  .mic-btn.listening .mic-ico{animation:micpulse 1s ease-in-out infinite}
  @keyframes micpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.6)}}
  /* live volume meter — segmented bar driven by mic RMS */
  .meter{flex:1 1 auto;height:0.75rem;border-radius:62rem;background:#E3ECFB;overflow:hidden;position:relative}
  /* Color is set per-frame from meterColor(L); width tracks live level. */
  .meter-fill{height:100%;width:0%;border-radius:62rem;background:#B31200;transition:width .18s ease-out,background-color .3s ease-out}
  .meter-mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:#116DFF;opacity:.55}
  .voice-status{font-size:0.8125rem;color:var(--ink-2);margin:0.5rem 0 0;min-height:1.1rem;line-height:1.35}
  .voice-status .heard{color:var(--ink);font-style:italic}
  .voice-tip{font-size:0.75rem;color:#E07A00;margin:0.25rem 0 0}
  .voice-confirm{display:flex;gap:0.5rem;margin:0.625rem 0 0;flex-wrap:wrap}
  .vc-yes{font-size:0.8125rem;font-weight:700;color:#fff;background:#0F6B3B;border:none;border-radius:0.5rem;padding:0.5rem 0.875rem;cursor:pointer}
  .vc-no{font-size:0.8125rem;font-weight:600;color:var(--ink-2);background:#fff;border:0.0625rem solid var(--line-2);border-radius:0.5rem;padding:0.5rem 0.875rem;cursor:pointer}
  .choice.matched{border-color:#116DFF;box-shadow:0 0 0 0.125rem rgba(17,109,255,.25)}
  .choices-label{font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0.25rem 0 0.5rem}
  .voice-unsupported{font-size:0.8125rem;color:#C81C0F;background:#FDECEA;border-radius:0.5rem;padding:0.5rem 0.75rem;margin:0 0 0.5rem}
  /* ===== Results page — Delivery (voice & projection) panel ===== */
  .dv-wrap{padding:0.25rem 0}
  .dv-top{display:flex;align-items:center;gap:0.625rem;flex-wrap:wrap;margin:0 0 0.75rem}
  .dv-pill{font-size:0.8125rem;font-weight:700;color:#fff;border-radius:62rem;padding:0.3125rem 0.75rem}
  .dv-pill.good{background:#3E8A00} .dv-pill.mid{background:#E0900A} .dv-pill.low{background:#D0210F}
  .dv-meta{font-size:0.8125rem;color:var(--ink-2)}
  .dv-bar{position:relative;height:0.75rem;border-radius:62rem;background:#E3ECFB;overflow:visible;margin:0 0 0.75rem}
  .dv-fill{height:100%;border-radius:62rem;transition:width .3s ease}
  .dv-mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:#116DFF;opacity:.6}
  .dv-note{font-size:0.875rem;color:var(--ink-2);line-height:1.45;margin:0}
  .dv-none{font-size:0.875rem;color:var(--ink-2);line-height:1.45;margin:0}
  .dv-playback{margin:1rem 0 0;padding:0.875rem 0 0;border-top:0.0625rem solid var(--line)}
  .dv-playback.is-empty{display:none}
  .dv-pb-label{font-size:0.8125rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 0.5rem}
  .dv-pb-slot audio{width:100%;height:2.25rem;display:block}
  .dv-pb-prep{font-size:0.875rem;color:var(--muted);font-style:italic}
  /* ===== Pre-call mic check popup ===== */
  .mc-lead{font-size:0.875rem;color:var(--ink-2);margin:0 0 0.75rem;line-height:1.45}
  .mc-notes{margin:0 0 1rem;padding-left:1.125rem;font-size:0.875rem;color:var(--ink-2);line-height:1.5}
  .mc-notes li{margin:0 0 0.375rem}
  .mc-row{margin:0 0 0.25rem}
  .mc-code{display:block;font-size:0.75rem;color:var(--muted);margin-top:0.25rem}
  /* Action-only step: mic shown but switched off */
  .voice-off{background:#F5F5F5;border-color:var(--line)}
  /* Expert follow-up line the learner says aloud */
  .say-line{background:#E4EFFE;border-radius:var(--r-sm);border-top-right-radius:0.3125rem;padding:0.8125rem 0.9375rem;margin:0.25rem 0 0.75rem;font-size:0.90625rem;line-height:1.45;color:var(--ink)}
  /* Results: volume events + volume-through-the-call graph */
  .dv-section{font-size:0.8125rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:1rem 0 0.5rem}
  .dv-ev-count{display:inline-block;min-width:1.375rem;padding:0 0.375rem;margin-left:0.375rem;border-radius:62rem;background:var(--bg);color:var(--ink);text-align:center;letter-spacing:0}
  .dv-ev-sub{font-size:0.8125rem;color:var(--ink-2);margin:0 0 0.5rem}
  .dv-ev-list{list-style:none;margin:0;padding:0}
  .dv-ev{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:0.25rem 0.625rem;align-items:center;text-align:left;background:#fff;border:0.0625rem solid var(--line);border-radius:var(--r-sm);padding:0.5rem 0.75rem;margin:0 0 0.375rem;font-family:var(--font-text);color:var(--ink);cursor:pointer}
  .dv-ev:hover,.dv-ev:focus-visible{border-color:var(--agent);outline:none}
  .dv-ev.static{cursor:default} .dv-ev.static:hover{border-color:var(--line)}
  .dv-ev-tag{font-size:0.75rem;font-weight:700;color:#fff;border-radius:62rem;padding:0.125rem 0.5rem;white-space:nowrap}
  .dv-ev-tag.quiet{background:#B38F00} .dv-ev-tag.loud{background:#3E8A00}
  .dv-ev-where{font-size:0.8125rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dv-ev-time{font-size:0.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .dv-ev-said{grid-column:2 / 4;min-width:0;font-size:0.8125rem;color:var(--ink-2);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dv-graph{position:relative;cursor:pointer;outline:none;touch-action:none}
  .dv-plot{position:relative;height:7rem}
  .dv-plot svg{position:absolute;inset:0;display:block;overflow:visible}
  .dv-dim{position:absolute;top:0;bottom:0;right:0;left:100%;background:rgba(255,255,255,.6);pointer-events:none}
  .dv-head{position:absolute;top:-0.25rem;bottom:-0.25rem;left:0;width:2px;margin-left:-1px;border-radius:1px;background:#116DFF;opacity:0;pointer-events:none}
  .dv-graph:not(.static) .dv-head{opacity:1}
  .dv-graph:focus-visible .dv-plot{outline:0.125rem solid var(--agent);outline-offset:0.25rem;border-radius:0.25rem}
  .dv-graph.static{cursor:default}
  .dv-times{display:flex;justify-content:space-between;margin:0.3125rem 0 0.5rem;font-size:0.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .dv-times b{color:var(--ink);font-weight:600}
  .dv-legend{display:flex;gap:0.5rem 0.875rem;flex-wrap:wrap;margin:0 0 0.25rem;font-size:0.75rem;color:var(--ink-2)}
  .dv-legend i{display:inline-block;width:0.625rem;height:0.625rem;border-radius:0.125rem;margin-right:0.3125rem;vertical-align:-0.0625rem}
  .helperbar{display:flex;gap:0.5rem;flex-wrap:wrap;margin:0 0 0.75rem}
  .hbtn{font-size:0.875rem;font-weight:500;padding:0.375rem 1.5rem;border-radius:18.75rem;border:1px solid #424242;background:#fff;color:#242424;cursor:pointer;height:32px}
  .hbtn:hover{border-color:#424242;color:#fff;background:#424242}
  .prompt{font-weight:700;font-size:0.875rem;color:var(--muted);text-transform:uppercase;letter-spacing:0;margin:0.125rem 0 0.625rem}
  /* ---- slide-up decision sheet: the question + choices overlay the lower chat,
     so the panel height is FIXED and never grows. Click the handle to
     minimize/expand; it auto-opens for each new question, no backdrop dim. ---- */
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#FBFBFC;border-top:0.0625rem solid var(--line);border-top-left-radius:var(--r-md);border-top-right-radius:var(--r-md);box-shadow:0 -0.5rem 1.5rem rgba(20,24,40,.10);display:flex;flex-direction:column;max-height:82%;transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:2}
  .sheet.min{transform:translateY(calc(100% - 3.25rem))}
  .sheet-handle{position:relative;flex:0 0 auto;height:3.25rem;width:100%;display:flex;align-items:center;gap:0.75rem;padding:0 1.125rem;cursor:pointer;user-select:none;background:none;border:0;font-family:var(--font-text);text-align:left}
  .sheet-handle:hover{background:#F3F4F7}
  .sheet-grab{position:absolute;top:0.4375rem;left:50%;transform:translateX(-50%);width:2.25rem;height:0.25rem;border-radius:62.4375rem;background:var(--line-2)}
  .sheet-q{flex:1;font-weight:700;font-size:0.8125rem;color:var(--muted);text-transform:uppercase;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:0.25rem}
  .sheet-chev{flex:0 0 auto;color:var(--ink-2);display:inline-flex;transition:transform .28s ease;padding-top:0.25rem}
  .sheet:not(.min) .sheet-chev{transform:rotate(180deg)}
  .sheet-body{flex:1;min-height:0;overflow-y:auto;padding:0.25rem 1.125rem 1.125rem}
  .choice{display:block;width:100%;text-align:left;border:0.0625rem solid var(--line-2);background:#fff;border-radius:var(--r-sm);padding:0.8125rem 0.9375rem;margin:0.5rem 0;font-size:0.90625rem;font-family:var(--font-text);color:var(--ink);cursor:pointer;transition:border-color .12s ease, box-shadow .12s ease, background .12s ease}
  .choice:hover:not(:disabled){border-color:var(--agent);box-shadow:0 0.125rem 0.625rem rgba(15,98,230,.10);background:#fff}
  .choice:disabled{opacity:.45;cursor:not-allowed}
  .next{margin-top:0.75rem}
  /* GUIDED MODE coaching card (inline in the chat after a reaction, and in the transcript) */
  .coachfb{border:0.0625rem solid var(--line);border-left-width:0.25rem;border-radius:var(--r-sm);background:#fff;padding:0.875rem 1rem;margin:0.5rem 0}
  .coachfb-head{display:flex;align-items:center;gap:0.5rem;font-weight:700;font-size:0.9375rem;color:var(--ink);margin:0 0 0.375rem}
  .coachfb-dot{width:0.625rem;height:0.625rem;border-radius:50%;flex:none}
  .coachfb-text{font-size:0.90625rem;line-height:1.5;color:var(--ink-2);margin:0;white-space:pre-line}
  .coachfb-actions{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.875rem}
  .coachfb-actions .btn{display:inline-flex;height:2.25rem}
  .coachfb.incorrect{border-left-color:#D0210F} .coachfb.incorrect .coachfb-dot{background:#D0210F}
  .coachfb.partial{border-left-color:#E0900A}   .coachfb.partial .coachfb-dot{background:#E0900A}
  .coachfb.correct{border-left-color:#3E8A00}   .coachfb.correct .coachfb-dot{background:#3E8A00}
  .coachfb.tx{margin:0.5rem 2rem;background:#FBFBFC}

  /* typing awareness indicator (TAI) — the user "typing…" bubble before a reply */
  .msg.typing .bubble{display:inline-flex;align-items:center;gap:0.3125rem;padding:0.8125rem 0.9375rem}
  .tai-dot{width:0.4375rem;height:0.4375rem;border-radius:50%;background:var(--muted);opacity:.4;animation:tai-blink 1.2s infinite ease-in-out}
  .tai-dot:nth-child(2){animation-delay:.2s}
  .tai-dot:nth-child(3){animation-delay:.4s}
  @keyframes tai-blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-0.125rem)}}

  /* learner name field on the Meet screen */
  .namefield{display:flex;flex-direction:column;gap:0.3125rem;margin:0 0 1.5rem;max-width:21.25rem}
  .namefield label{font-size:0.875rem;font-weight:400;color:#000000}
  .nameinput{font-family:var(--font-text);font-size:1rem;padding:0.375rem 0.375rem;border:0.0625rem solid #D6E6FE;border-radius:0.375rem;color:var(--ink);background:#fff}
  .nameinput::placeholder{color:#868AA5;font-size:1rem}
  .nameinput:focus{outline:none;border-color:#116DFF}
  .nameinput.invalid{border-color:#E62214}
  .nameerror{font-size:0.75rem;color:#44485F;opacity:0;visibility:hidden;transition:opacity 200ms ease-out, visibility 200ms ease-out}
  .nameerror.show{opacity:1;visibility:visible}

  /* confirm-your-details step (between Meet and the call) */
  .confirm-details{display:flex;flex-direction:column;gap:0.75rem;margin:0 0 1.75rem;max-width:21.25rem}
  .confirm-row{display:flex;flex-direction:column;gap:0.1875rem;border-bottom:0.0625rem solid var(--line);padding-bottom:0.625rem}
  .confirm-label{font-size:0.75rem;font-weight:700;color:var(--muted);text-transform:uppercase}
  .confirm-value{font-size:1rem;color:#000000;word-break:break-word}
  .confirm-actions{display:flex;gap:0.625rem;align-items:center}
  .btn-wide{width:auto;padding:0.375rem 1.5rem}
  .confirm-consent{display:flex;gap:0.5rem;align-items:flex-start;max-width:24rem;margin:0 0 1.5rem;
    padding:0.75rem 0.875rem;background:var(--bg);border:0.0625rem solid var(--line);border-radius:0.5rem;
    font-size:0.8125rem;line-height:1.45;color:var(--ink-2)}
  .confirm-consent svg{flex:0 0 auto;margin-top:0.0625rem}

  /* ============================ COMPLETE ============================ */
  .complete-hero{display:grid;grid-template-columns:0.7fr 1.3fr;gap:0;background:var(--paper);border:0.0625rem solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:1.125rem}
  .complete-hero .portrait{background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
  .complete-hero .portrait img{width:100%;height:100%;object-fit:cover}
  .complete-hero .body{padding:2.5rem 2.75rem;display:flex;flex-direction:column;justify-content:center}
  .complete-hero h1{font-size:3rem;margin-bottom:0.75rem}
  .complete-hero .lead{font-size:1rem;color:var(--ink-2);margin:0 0 1.375rem;max-width:46ch}
  .scorenum{font-family:var(--font-display);font-weight:800;font-size:3.5rem;line-height:1}
  .scorenum small{font-size:1.375rem;color:var(--muted);font-weight:700}

  .card{background:var(--paper);border:0.0625rem solid var(--line);border-radius:var(--r-md);padding:1.25rem 1.375rem;margin-top:1rem;box-shadow:0 0.25rem 1rem rgba(20,24,40,.05)}
  .card h3{font-size:0.9375rem;margin:0 0 0.5rem}
  .srow{display:flex;justify-content:space-between;align-items:center;font-size:0.875rem;padding:0.5625rem 0;border-bottom:0.0625rem solid #F1F1F1}
  .srow:last-child{border-bottom:0}
  .sdot{width:0.5625rem;height:0.5625rem;border-radius:50%;margin-right:0.5625rem;display:inline-block}
  .sdot.done{background:var(--correct)} .sdot.partial{background:var(--partial)} .sdot.miss{background:var(--incorrect)}
  .sval{font-variant-numeric:tabular-nums;font-weight:600}
  .list{margin:0.5rem 0 0;padding-left:0;list-style:none}
  .list li{padding:0.5625rem 0 0.5625rem 1.625rem;position:relative;font-size:0.875rem;border-bottom:0.0625rem solid #F4F4F4}
  .list li:last-child{border-bottom:0}
  .list.str li:before{content:"✓";position:absolute;left:0.125rem;color:var(--correct);font-weight:800}
  .list.imp li:before{content:"→";position:absolute;left:0.125rem;color:var(--partial);font-weight:800}
  .pick{font-size:0.78125rem;color:var(--muted);margin-top:0.3125rem;font-style:italic}
  .pick.miss{color:#9aa0a6}

  /* ---- End-screen accordion — mirrors wix.com "Website builder FAQs" ----
     Flat list of rows with divider lines and a +/× toggle. Each row opens
     independently (multiple can be open at once). All start collapsed so the
     completion gate below is meaningful. */
  .acc{background:var(--paper);border:0.0625rem solid var(--line);border-radius:var(--r-md);box-shadow:0 0.25rem 1rem rgba(20,24,40,.05);margin-top:1rem;overflow:hidden}
  .acc-item{border-top:0.0625rem solid var(--line)}
  .acc-item:first-child{border-top:0}
  .acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem;background:none;border:0;cursor:pointer;font-family:var(--font-display);font-size:1.0625rem;font-weight:500;letter-spacing:-.01em;color:var(--ink);text-align:left;padding:1.125rem 1.375rem}
  .acc-head:hover{color:#000}
  .acc-head:focus-visible{outline:0.125rem solid var(--agent);outline-offset:-0.125rem}
  .acc-icon{position:relative;width:1rem;height:1rem;flex:0 0 auto;transition:transform .2s ease}
  .acc-icon::before,.acc-icon::after{content:"";position:absolute;background:var(--ink)}
  .acc-icon::before{left:0;top:calc(50% - 0.03125rem);width:1rem;height:0.0625rem}
  .acc-icon::after{top:0;left:calc(50% - 0.03125rem);width:0.0625rem;height:1rem}
  .acc-item.open .acc-icon{transform:rotate(45deg)}
  .acc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
  .acc-item.open .acc-panel{grid-template-rows:1fr}
  .acc-clip{overflow:hidden;min-height:0}
  .acc-inner{padding:0.25rem 1.375rem 1.25rem}
  .acc-inner .list{margin-top:0}
  .acc-inner .srow:last-child{border-bottom:0}

  /* completion gate */
  .gate{display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;margin-top:1.125rem}
  .gate .hint{font-size:0.8125rem;color:var(--muted)}
  .gate .hint.ready{color:var(--correct);font-weight:600}
  .btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
  .btn.done{background:var(--correct);color:#fff;cursor:default;pointer-events:none;opacity:1;width:auto;padding:0.375rem 1.25rem}

  .actions{display:flex;gap:0.625rem;flex-wrap:wrap;margin-top:1.125rem}
  /* end-screen transcript reuses the LIVE chat bubbles (.msg/.bubble) so it
     mirrors the simulation exactly — gray Sarah left, blue Expert right,
     centered action/system notes. */
  .txchat{display:flex;flex-direction:column;gap:0.75rem;padding:0.5rem 0 0.25rem}

  /* ============================ helper <dialog> ============================ */
  dialog.modal{border:0;border-radius:var(--r-md);max-width:35rem;width:calc(100% - 2rem);padding:0;box-shadow:0 1.5rem 3.75rem rgba(20,24,40,.28)}
  dialog.modal::backdrop{background:rgba(20,24,40,.45)}
  .modal-inner{padding:1.25rem 1.375rem 1.375rem}
  .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem}
  .mhead h3{font-size:1.0625rem}
  .mx{border:0;background:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted)}
  .mx:hover{color:var(--ink)}
  .mopt{display:block;width:100%;text-align:left;border:0.0625rem solid var(--line-2);background:#fff;border-radius:var(--r-sm);padding:0.6875rem 0.8125rem;margin:0 0 0.5rem;font-size:0.875rem;font-family:var(--font-text);color:var(--ink);cursor:pointer}
  .mopt:hover{border-color:var(--agent)}
  .tabrow{display:flex;gap:0.375rem;margin-bottom:0.625rem}
  .tab{font-size:0.8125rem;padding:0.4375rem 0.75rem;border-radius:0.5rem;border:0.0625rem solid var(--line-2);background:#fff;font-family:var(--font-text);cursor:pointer}
  .tab.active{border-color:var(--agent);color:var(--agent);font-weight:700}
  .article-body{white-space:pre-wrap;font-size:0.875rem;background:var(--bg);border-radius:var(--r-sm);padding:0.8125rem;min-height:5.625rem;line-height:1.5}
  .mnote{font-size:0.78125rem;color:var(--muted);margin-top:0.5rem}
  .speakerbox{background:var(--bg);border:0.0625rem solid var(--line);padding:0.6875rem 0.8125rem;border-radius:var(--r-sm);font-size:0.875rem}

  /* ===================== TONY TEST — QUICK WINS =====================
     1) Guided "Before your call" screen (replaces the mic-check pop-up)
     2) Check Resources + Full screen callouts
     3) "Say it" vs "Click it" choice groups
     4) "What you'll be scored on / this is just practice" note */
  .intro{background:var(--paper);border:0.0625rem solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);min-height:30rem;display:flex;flex-direction:column}
  .intro-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.25rem 2rem;border-bottom:0.0625rem solid var(--line)}
  .intro-steps{display:flex;gap:0.375rem;flex-wrap:wrap}
  .intro-step{font-size:0.75rem;font-weight:600;color:var(--muted);padding:0.25rem 0.625rem;border-radius:62rem;background:var(--bg);display:inline-flex;align-items:center;gap:0.375rem}
  .intro-step b{display:inline-flex;align-items:center;justify-content:center;width:1.125rem;height:1.125rem;border-radius:50%;background:#fff;border:0.0625rem solid var(--line-2);font-size:0.6875rem}
  .intro-step.on{background:#E4EFFE;color:#101585}
  .intro-step.on b{background:#116DFF;border-color:#116DFF;color:#fff}
  .intro-step.past b{background:var(--correct);border-color:var(--correct);color:#fff}
  .intro-body{flex:1;padding:2rem 2.5rem;display:flex;flex-direction:column;gap:1rem}
  .intro-body h1{font-weight:400;font-size:2rem;line-height:2.25rem;color:#000}
  .intro-lead{font-size:1rem;color:var(--ink-2);margin:0;max-width:62ch}
  .intro-foot{display:flex;justify-content:space-between;align-items:center;gap:0.75rem;padding:1rem 2rem;border-top:0.0625rem solid var(--line);background:#FBFBFC;border-bottom-left-radius:var(--r-lg);border-bottom-right-radius:var(--r-lg)}
  .intro-foot .actions{margin:0}
  .demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .demo-card{border:0.0625rem solid var(--line);border-radius:var(--r-md);padding:1rem 1.125rem;background:#fff;display:flex;flex-direction:column;gap:0.625rem}
  .demo-card h3{font-size:1rem;display:flex;align-items:center;gap:0.5rem}
  .demo-card p,.demo-card li{font-size:0.875rem;color:var(--ink-2);margin:0;line-height:1.45}
  .demo-card ul{margin:0;padding-left:1.125rem}
  .demo-ico{width:1.75rem;height:1.75rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .demo-ico.say{background:#E4EFFE;color:#116DFF}
  .demo-ico.click{background:#FFF1E6;color:#B34700}
  .demo-ico svg{width:1rem;height:1rem}
  .demo-mock{background:#FBFBFC;border:0.0625rem dashed var(--line-2);border-radius:var(--r-sm);padding:0.75rem;pointer-events:none}
  .demo-mock .choice{margin:0 0 0.5rem;font-size:0.8125rem;padding:0.625rem 0.75rem}
  .demo-mock .voice{margin:0}
  .demo-mock .mic-btn{font-size:0.8125rem;padding:0.5rem 0.875rem}
  .tools-mock{border:0.0625rem solid var(--line);border-radius:var(--r-md);background:#fff;overflow:visible;position:relative;margin-top:2.25rem}
  .tools-mock .panel-head{border-radius:var(--r-md) var(--r-md) 0 0}
  .tools-mock .mock-chat{height:3.5rem;background:repeating-linear-gradient(0deg,#fff 0 0.75rem,#F7F7F7 0.75rem 1.5rem);border-radius:0 0 var(--r-md) var(--r-md)}
  .tools-mock .btn-end{pointer-events:none}
  .tools-stage{position:relative;padding-top:3rem}
  .tools-stage .tools-mock{margin-top:0}
  .tools-mock .panel-head{flex-wrap:wrap;row-gap:0.75rem}
  .mock-call{display:flex;flex-direction:column;gap:0.5rem;padding:0.75rem 1rem;pointer-events:none;background:#fff;border-radius:0 0 var(--r-md) var(--r-md)}
  .mock-call .bubble{font-size:0.8125rem;padding:0.5rem 0.75rem}
  .mock-opts{border-top:0.0625rem solid var(--line);padding-top:0.625rem;display:flex;flex-direction:column;gap:0.375rem}
  .mock-opts .choice{margin:0;font-size:0.8125rem;padding:0.5rem 0.75rem}
  .tools-mock .who-sub{white-space:nowrap}
  .intro-head{display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .intro-head .intro-fs{position:static;flex:0 0 auto}
  .app:fullscreen{background:var(--bg);overflow:auto;padding:1.5rem}
  .tag-num{display:inline-flex;align-items:center;justify-content:center;width:1.375rem;height:1.375rem;border-radius:50%;background:#116DFF;color:#fff;font-size:0.75rem;font-weight:700;flex:0 0 auto}
  .tools-mock .tag-num{position:absolute;top:-0.6875rem;box-shadow:0 0 0 0.1875rem #fff}
  .tools-list{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .tools-list .demo-card h3{font-size:0.9375rem}
  .score-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:1rem;align-items:start}
  .score-list{list-style:none;margin:0;padding:0}
  .score-list li{display:flex;justify-content:space-between;gap:0.75rem;font-size:0.875rem;padding:0.4375rem 0;border-bottom:0.0625rem solid #F1F1F1}
  .score-list li:last-child{border-bottom:0}
  .score-list .pts{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);white-space:nowrap}
  .practice-note{background:#F1F8EE;border:0.0625rem solid #CFE6C6;border-radius:var(--r-md);padding:1rem 1.125rem}
  .practice-note h3{font-size:0.9375rem;color:#1F5A0E;margin:0 0 0.5rem}
  .practice-note ul{margin:0;padding-left:1.125rem}
  .practice-tip{font-size:0.875rem;color:var(--ink-2);line-height:1.45;margin:0}
  .practice-note li{font-size:0.875rem;color:var(--ink-2);line-height:1.45;margin:0 0 0.375rem}
  .mic-step{max-width:40rem}
  @media (max-width:45rem){
    .demo-grid,.tools-list,.score-grid{grid-template-columns:1fr}
    .intro-body{padding:1.5rem 1.25rem}
    .intro-top,.intro-foot{padding:1rem 1.25rem}
  }

  /* Full screen: labeled pill instead of a bare icon (icon-only once in fullscreen) */

<script id="engine">
(function(){
  const S = window.SCENARIO;
  const app = document.getElementById('app');
  const U = S.user || { name:(S.userBio? "the user":"User"), image:null, bio:S.userBio||"" };

  const earned = {};        // stageId -> best points (skips are recoverable)
  const status = {};        // stageId -> 'todo' | 'partial' | 'done'
  const decisivePick = {};  // stageId -> the response that set that stage's score
  const transcript = [];    // ordered record of the whole conversation
  const stageCfg = {};      // stageId -> stage config (for additive/max lookups)
  S.stages.forEach(st => { earned[st.id]=0; status[st.id]='todo'; stageCfg[st.id]=st; });
  const maxTotal = S.stages.reduce((a,st)=>a+st.max,0);
  const visitedScreens = new Set();
  const help = { used:false, checkedCorrectArticle:false, openedAnyResourceLink:false, openedLabels:new Set() };
  // Article scoring: resources.items may carry `points` + `rating` (correct /
  // partial / incorrect). The highest-points article opened at/after
  // RESOURCE_CREDIT_MIN_SECONDS sets the resources stage score (capped at the
  // stage max) in renderFinal. Items without `points` score nothing, so older
  // scenarios behave exactly as before.
  let bestArticle = null;   // { label, points, rating }
  // Whether the CURRENT screen's speaker line actually played (passed its
  // speakerIf gate) — read when the choice is recorded so the end-of-call
  // transcript replay matches exactly what the learner saw live.
  let currentSpeakerShown = false;
  // TONY TEST: set when a voice-mode learner opts to tap spoken responses instead.
  let tapFallback = false;

  /* ---- learner name ----------------------------------------------------
     Captured on the Meet screen (learners enter their FULL name). During the
     simulation, the Expert is shown by FIRST NAME ONLY — this applies both to
     (a) the label on the learner's own chat bubbles and (b) the [name] token
     substituted anywhere in scenario text (e.g. "I'm [name]"). The full name
     is still pushed to the Rise/Storyline "learner_name" variable and sent to
     telemetry unchanged. */
  let learner_name = "";
  function firstName(){ return (learner_name || "").trim().split(/\s+/)[0] || ""; }
  function px(s){ return String(s==null?'':s).replace(/\[name\]/gi, firstName() || "you"); }
  function setLearnerName(v){
    learner_name = (v||"").trim();
    pushRiseVar("learner_name", learner_name);
  }

  /* ---- learner email ---------------------------------------------------
     Also captured on the Meet screen (required, basic format check). Unlike
     the name, it is NOT pushed to a Rise/Storyline variable — it is only
     sent to the telemetry Form (see FIELD_IDS.learner_email below). */
  let learner_email = "";
  function setLearnerEmail(v){ learner_email = (v||"").trim(); }

  // Best-effort write to the host course's variable. Storyline exposes
  // GetPlayer(); Rise/other hosts can listen for the postMessage below.
  function pushRiseVar(name, value){
    try {
      const p = (window.parent && window.parent.GetPlayer && window.parent.GetPlayer())
             || (window.top && window.top.GetPlayer && window.top.GetPlayer());
      if(p && p.SetVar) p.SetVar(name, value);
    } catch(e){}
    try { window.parent && window.parent.postMessage({ type:'setVar', name:name, value:value }, '*'); } catch(e){}
    // SCORM package: scorm.js (only present in the LMS build) reports score + completion.
    try { if(!IS_CALL_TAB && window.CDScorm) window.CDScorm.setVar(name, value); } catch(e){}
    // Call tab: pass it back to the course copy, which forwards it to Rise.
    try { if(IS_CALL_TAB && window.opener) window.opener.postMessage({ type:'cd-relay', payload:{ type:'setVar', name:name, value:value } }, '*'); } catch(e){}
  }

  // Stamp each screen with its own id so retry can re-open it.
  Object.keys(S.screens).forEach(k => { S.screens[k].id = k; });

  /* =========================== TELEMETRY ===========================
     Posts one row per learner action to a Google Form, whose responses feed
     the Sheet. A Google Form's formResponse endpoint accepts anonymous,
     cross-origin POSTs with no auth, no deployment permissions, and no shared
     key — which is why this works where the Apps Script Web App returned 401.
     (This is the same mechanism proven in the working Rise POC.)

     Each field is addressed by its Form `entry.NNN` id, not by column name.
     Body is application/x-www-form-urlencoded (entry.123=value&...). If the
     Form's questions ever change, refresh the ids in FIELD_IDS below by
     opening the live form's prefilled-link tool or viewing its HTML source.

     mode:'no-cors' makes the response opaque, so a rejected/misrouted write is
     invisible here and fails silently. Verify the first run by watching rows
     actually land in the Sheet.

     learner_email IS collected on the Meet screen in this scenario and sent to
     the Form's learner_email field (entry.1276253364). All other values are
     derived dynamically from the scenario/screen, so every scenario self-labels
     with no per-scenario editing here. */
  // Shared Care Dojo telemetry Form (same Form + entry ids as the live PS1–PS4
  // builds). Rows self-label via TELEMETRY_COURSE below; filter test plays out
  // by course or email.
  const TELEMETRY_ENDPOINT = 'https://docs.google.com/forms/d/e/1FAIpQLSegiZwFV7DN-wwWsqnBbrqzJ5yEK-3lk8Zl182M0fMNFYH5hg/formResponse';
  const FIELD_IDS = {
    learner_email:    'entry.1276253364',
    learner_name:     'entry.2005409239',
    attempt_id:       'entry.1673953677',
    course:           'entry.2010105379',
    scene:            'entry.1283761747',
    interaction:      'entry.1781563601',
    question:         'entry.786197073',
    response:         'entry.2057562952',
    correct:          'entry.1897805741',
    points:           'entry.1780599104',
    time_on_step_sec: 'entry.1327709145',
    notes:            'entry.1963386753'
  };
  // Written to the `course` field. Set by hand here (not S.title) so the Sheet
  // label can differ from the on-screen title.
  const TELEMETRY_COURSE = 'De-Esc Reinforcement: Sticker Shock (Guided)';

  // GUIDED retry tracking — summarized in one `guided_retries` row at results.
  const retriedScreens = [];      // screens where the first pick forced a retry
  const stillWrongScreens = [];   // screens where the retry pick was partial or incorrect

  // One id per play-through, so a learner's rows can be grouped in the Sheet.
  let attemptId = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // `time_on_step_sec` — seconds between a screen appearing and the learner acting.
  let stepStartedAt = null;
  function markStepStart(){ stepStartedAt = callSeconds; }
  function secondsOnStep(){ return stepStartedAt==null ? '' : Math.max(0, callSeconds - stepStartedAt); }

  // Same idea for the Check Resources modal: seconds since it was opened, not the call clock.
  let resourcesOpenedAt = null;
  function secondsOnResources(){ return resourcesOpenedAt==null ? '' : Math.max(0, callSeconds - resourcesOpenedAt); }

  // verdict -> the `correct` field
  function correctCol(verdict){
    if(verdict==='correct')   return 'yes';
    if(verdict==='partial')   return 'partial';
    if(verdict==='incorrect') return 'no';
    return '';
  }

  function logEvent(evt){
    evt = evt || {};
    // Map this event onto the Form fields.
    const row = {
      learner_email:    learner_email,
      learner_name:     learner_name,
      attempt_id:       attemptId,
      course:           TELEMETRY_COURSE,
      scene:            evt.screen   || '',
      interaction:      evt.stage    || evt.helper || evt.type || '',
      question:         evt.question || '',
      response:         evt.text     || evt.action || '',
      correct:          correctCol(evt.verdict),
      points:           evt.points  == null ? '' : evt.points,
      time_on_step_sec: evt.seconds == null ? '' : evt.seconds,
      notes:            evt.notes    || ''
    };
    if(!TELEMETRY_ENDPOINT) return;            // tracking off (no Form set)
    // Build the urlencoded body keyed by Form entry ids.
    const body = [];
    for(const k in row){
      if(!FIELD_IDS[k]) continue;              // skip any field without an entry id
      const v = row[k];
      body.push(FIELD_IDS[k] + '=' + encodeURIComponent(v == null ? '' : v));
    }
    try{
      fetch(TELEMETRY_ENDPOINT, {
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
        body: body.join('&')
      }).catch(()=>{});  // best-effort telemetry; never blocks the learner's flow
    } catch(e){}
  }

  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* =================== CALL-RECORDING UPLOAD ===================
     The per-action telemetry above rides a Google Form, which CANNOT accept a
     file. So the call audio goes to a separate sink: a Google Apps Script Web
     App that (1) saves the .webm to a Drive folder and (2) writes one row to a
     "Recordings" tab — timestamp, attempt_id, email, name, course, recording_url
     — keyed by the SAME attempt_id used in the Form rows, so the recording links
     back to the learner's telemetry. Everything stays inside Google Workspace;
     no third-party host.

     DEPLOYMENT (must be done once, by the sheet/Drive owner):
       • Paste the companion Apps Script (see "RECORDING WEB APP.gs") into the
         Sheet's Apps Script editor and deploy as a Web App.
       • Execute as: Me.  Who has access: ANYONE.
         "Anyone" (not "Anyone within Wix") is required — external BPO learners
         sign in with @wixcs.com, a different domain, and a domain-scoped Web App
         would reject them (the 401 we hit before). "Execute as: Me" means the
         file lands in the OWNER's Drive; learners need no Drive permissions.
       • Paste the resulting /exec URL into RECORDING_ENDPOINT below.
     Until a URL is set, recording silently no-ops and the sim runs unchanged. */
  // !! The mic-test popup tells learners "We don't store recordings after the
  // !! simulation is complete." That is only true while this stays EMPTY. If you
  // !! ever paste a URL here, update that note in micStepMarkup() first.
  const RECORDING_ENDPOINT = '';   // <-- paste the Apps Script Web App /exec URL here

  function uploadRecording(blob){
    if(!RECORDING_ENDPOINT || !blob || !blob.size) return;
    const reader = new FileReader();
    reader.onload = () => {
      // reader.result is a data: URL — keep only the base64 payload.
      const base64 = String(reader.result).split(',')[1] || '';
      const body = new URLSearchParams({
        attempt_id:    attemptId,
        learner_email: learner_email,
        learner_name:  learner_name,
        course:        TELEMETRY_COURSE,
        mime:          blob.type || 'audio/webm',
        audio_b64:     base64
      });
      try{
        // Same transport as the telemetry Form: urlencoded + no-cors, so it's
        // fire-and-forget with no CORS preflight. The Web App parses e.parameter,
        // writes the Recordings row + Drive link itself, so we never read a
        // response back (which no-cors wouldn't let us do anyway).
        fetch(RECORDING_ENDPOINT, {
          method:'POST', mode:'no-cors',
          headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
          body: body.toString()
        }).catch(()=>{});
      } catch(e){}
    };
    reader.readAsDataURL(blob);
  }

  /* Local, play-only playback of the learner's OWN call, shown in the results
     "Voice and Projection" panel. Uses an in-memory object URL — nothing is
     downloaded and no Drive access is needed; it lives only for this session and
     is gone on refresh. The permanent copy is the one uploaded to L&D's Drive.
     `controlsList="nodownload"` hides the browser's download button (Chrome/Edge,
     which is also the required browser for speech-to-text). */
  function mountPlayback(blob){
    const wrap = document.getElementById('callPlayback');
    const slot = document.getElementById('callPlaybackSlot');
    if(!wrap || !slot) return;
    if(!blob || !blob.size){ wrap.classList.add('is-empty'); return; }
    try{
      const url = URL.createObjectURL(blob);
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.preload = 'metadata';
      audio.src = url;
      audio.setAttribute('controlsList', 'nodownload noplaybackrate');
      audio.oncontextmenu = () => false;   // no "save audio as" right-click
      slot.innerHTML = '';
      slot.appendChild(audio);
      if(window.CallMode && window.CallMode.bindGraph) window.CallMode.bindGraph(audio);   // playhead follows playback
    } catch(e){ wrap.classList.add('is-empty'); }
  }


  /* ---- call timer (authentic Communication-Panel touch) ---- */
  let callSeconds = 0, timerHandle = null, callStartTs = null;
  function mmss(t){ const m=Math.floor(t/60), s=t%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
  // Drive the clock from a real timestamp, NOT a tick counter. Background tabs
  // throttle/pause setInterval (e.g. after opening Resources and switching tab),
  // which makes a "callSeconds++" counter fall behind real time. Deriving the
  // value from elapsed wall-clock time keeps it accurate: it snaps to the right
  // value on the next tick, and immediately when the tab is re-focused.
  function tickTimer(){
    if(callStartTs==null) return;
    callSeconds = Math.round((Date.now()-callStartTs)/1000);
    const e=document.getElementById('timer'); if(e) e.textContent=mmss(callSeconds);
  }
  function startTimer(){
    callStartTs = Date.now() - callSeconds*1000;   // resume-safe
    tickTimer();
    timerHandle = setInterval(tickTimer, 1000);
  }
  function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }
  // Correct the display the instant the tab becomes visible again.
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) tickTimer(); });

  let chatEl, composerEl;

  /* =================== PHASE 1 — MEET THE USER =================== */
  function renderMeet(){
    stopTimer();
    const portrait = U.image
      ? `<img src="${escapeHtml(U.image)}" alt="Portrait of ${escapeHtml(U.name)}"
             onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=\\'noimg\\'>[ ${escapeHtml(U.name)} ]<br><span style=&quot;font-size:0.75rem&quot;>character image not found</span></div>')">`
      : `<div class="noimg">[ ${escapeHtml(U.name)} ]</div>`;
    app.innerHTML = `
      <section class="meet">
        <div class="portrait">${portrait}</div>
        <div class="body">
          <div class="eyebrow">Care Dojo · User Scenario</div>
          <h1 class="display">Meet ${escapeHtml(U.name)}</h1>
          <p>${escapeHtml(U.bio).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<em>$1</em>')}</p>
          <div class="namefield">
            <label for="learnerName">Full Name</label>
            <input class="nameinput" id="learnerName" type="text" autocomplete="name"
                   placeholder="Enter your full name" value="${escapeHtml(learner_name)}">
            <div class="nameerror" id="nameError">Please enter your name to continue.</div>
          </div>
          <div class="namefield">
            <label for="learnerEmail">Wix Email</label>
            <input class="nameinput" id="learnerEmail" type="email" autocomplete="email"
                   placeholder="Enter your Wix email" value="${escapeHtml(learner_email)}">
            <div class="nameerror" id="emailError">Please enter a valid email to continue.</div>
          </div>
          <div><button class="btn btn-dark" id="startBtn">Get Started<span class="btn-arrow"><svg viewBox="0 0 11 8" xmlns="http://www.w3.org/2000/svg"><path d="M7 0L11 4L7 8" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="4" x2="10" y2="4" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg></span></button></div>
        </div>
      </section>`;
    const nameInput  = document.getElementById('learnerName');
    const nameError  = document.getElementById('nameError');
    const emailInput = document.getElementById('learnerEmail');
    const emailError = document.getElementById('emailError');
    const emailOk = v => /^\S+@\S+\.\S+$/.test((v||'').trim());
    nameInput.addEventListener('input', e => {
      setLearnerName(e.target.value);
      if(learner_name) { nameError.classList.remove('show'); nameInput.classList.remove('invalid'); }
    });
    emailInput.addEventListener('input', e => {
      setLearnerEmail(e.target.value);
      if(emailOk(learner_email)) { emailError.classList.remove('show'); emailInput.classList.remove('invalid'); }
    });
    document.getElementById('startBtn').onclick = () => {
      setLearnerName(nameInput.value);
      setLearnerEmail(emailInput.value);
      let bad = false;
      if(!learner_name){
        nameError.classList.add('show'); nameInput.classList.add('invalid'); bad = true;
      }
      if(!emailOk(learner_email)){
        emailError.classList.add('show'); emailInput.classList.add('invalid'); bad = true;
      }
      if(bad){ (!learner_name ? nameInput : emailInput).focus(); return; }
      openConfirm();
    };
  }

  /* =================== PHASE 1b — CONFIRM YOUR DETAILS (popup) ===================
     A modal checkpoint over the Meet screen: the learner reviews the exact name
     + email that will be attached to their results. Close/Back dismisses the
     popup (Meet stays put); "These are correct" starts the call. */
  function openConfirm(){
    const dlg = document.createElement('dialog'); dlg.className='modal';
    dlg.innerHTML = `<div class="modal-inner">

          <div class="confirm-row"><span class="confirm-label">Name</span><span class="confirm-value">${escapeHtml(learner_name)}</span></div>
          <div class="confirm-row"><span class="confirm-label">Email</span><span class="confirm-value">${escapeHtml(learner_email)}</span></div>
        </div>
        <div class="actions" style="margin:0">
          <button class="btn btn-dark" id="confirmYes" type="button">These are correct<span class="btn-arrow"><svg viewBox="0 0 11 8" xmlns="http://www.w3.org/2000/svg"><path d="M7 0L11 4L7 8" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="4" x2="10" y2="4" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg></span></button>

    const close = ()=>{ dlg.close(); dlg.remove(); };
    dlg.querySelector('#confirmClose').onclick = close;
    dlg.querySelector('#confirmBack').onclick = close;
    dlg.querySelector('#confirmYes').onclick = ()=>{ close(); renderIntro(0); };
  }

  /* =================== PHASE 1c — BEFORE YOUR CALL (guided intro) ===================
     TONY TEST: replaces the old mic-check pop-up with a full, stepped screen so
     first-timers are walked through the call before it starts:
       1  How this call works  — "Say it" (spoken) vs "Click it" (actions)
       2  How you're scored    — the rubric + "what to expect"
       3  Test your microphone — the same live mic check as before, inline
     The mic logic is unchanged from openMicCheck(): Chrome/Edge note, Allow
     prompt, recording note, the 0.22 volume gate, the embedded-page "Open the
     call in a new tab" path, and "Continue without speaking". */
  const MIC_SVG = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  const CLICK_SVG = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 3.5v10.2l2.3-2.1 2 4.6 2.1-.9-2-4.5h3.1L9 3.5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
  const ARROW_SVG = `<span class="btn-arrow"><svg viewBox="0 0 11 8" xmlns="http://www.w3.org/2000/svg"><path d="M7 0L11 4L7 8" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="4" x2="10" y2="4" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg></span>`;
  /* Testing update: the mic test comes FIRST, then the demo. Inside a course page
     (Wix Smart, Moodle, Rise) the learner never speaks in the page: the first
     screen's only way to speak is "Test your microphone", which opens the call
     in its own tab, where the mic test runs and the demo continues. */
  const INTRO_STEPS = ['Test your mic', 'How this call works', "How you're scored"];
  const MIC_STEP = 0;
  let introMicCheck = null;
  let introVoice = false;   // set on the mic step: true once the mic test hears them

  function renderIntro(step){
    stopTimer();
    if(introMicCheck){ introMicCheck.stop(); introMicCheck = null; }
    step = Math.max(0, Math.min(INTRO_STEPS.length - 1, step|0));
    const name = escapeHtml(U.name);
    const pills = INTRO_STEPS.map((t,i)=>`<span class="intro-step${i===step?' on':''}${i<step?' past':''}"><b>${i<step?'✓':i+1}</b>${escapeHtml(t)}</span>`).join('');
    let body = '';
    if(step === MIC_STEP){
      body = micStepMarkup();
    } else if(step === 1){
      body = `
        <div class="intro-head">
          <h1 class="display">How this call works</h1>
          <button class="fs-pill intro-fs" id="introFs" type="button" title="Enter full screen">${MAXIMIZE_SVG}<span class="fs-label">Full screen</span></button>
        </div>
        <p class="intro-lead">On each turn, a question appears with two kinds of responses: things you <b>say</b> and things you <b>click</b>.</p>
        <div class="demo-grid">
          <div class="demo-card">
            <h3><span class="demo-ico say">${MIC_SVG}</span>Say it</h3>
            <p>Spoken responses are what you'd say to ${name}. Click the blue mic button, read one aloud at your normal call volume, then click it again to stop. It's sent once you stop.</p>
            <div class="demo-mock" aria-hidden="true">
              <div class="choice say say-only">Hi ${name}, thanks so much for calling today…</div>
              <div class="voice"><div class="voice-row"><span class="mic-btn"><span class="mic-ico"></span>Click to start speaking</span><div class="meter"><div class="meter-fill" style="width:46%;background:#5BBE7E"></div><div class="meter-mark" style="left:22%"></div></div></div></div>
            </div>
          </div>
          <div class="demo-card">
            <h3><span class="demo-ico click">${CLICK_SVG}</span>Click it</h3>
            <p>Actions are things you'd <b>do</b> in your tools, like looking someone up in User Manager. Don't say these out loud. Just click one.</p>
            <div class="demo-mock" aria-hidden="true">
              <div class="choice act"><span class="act-ico">${CLICK_SVG}</span><span>Look ${name} up in User Manager to verify the account.</span></div>
            </div>
          </div>
        </div>`;
    } else {
      const rows = S.stages.map(st=>`<li><span>${escapeHtml(st.name)}</span><span class="pts">${st.max} pts</span></li>`).join('');
      body = `
        <h1 class="display">How you're scored</h1>
        <div class="score-grid">
          <div class="practice-note">
            <h3>What to expect:</h3>
            ${S.guided ? `<p class="practice-tip" style="margin-bottom:0.5rem"><b>This is a guided call.</b> When a response could be stronger, you'll get coaching right away and one chance to try again.</p>` : ''}
            <p class="practice-tip">You'll see your score, what you did well, what to work on, and the full transcript at the end.</p>
            <p class="practice-tip" style="margin-top:0.5rem">Time isn't scored. The timer is there so it feels like a real call.</p>
          </div>
          <div class="demo-card">

        </div>`;
    }
    const isMic = step === MIC_STEP, isLast = step === INTRO_STEPS.length - 1;
    app.innerHTML = `
      <section class="intro">
        <div class="intro-top">
          <div class="eyebrow" style="margin:0">Before your call · Step ${step+1} of ${INTRO_STEPS.length}</div>
          <div class="intro-steps">${pills}</div>
        </div>

          <div>${step>0 ? `<button class="btn btn-ghost btn-wide" id="introBack" type="button">Back</button>` : ''}</div>
          <div class="actions" id="introActions">${isMic ? micStepActions()
            : isLast ? `<button class="btn btn-dark btn-wide" id="introStart" type="button">Start the call${ARROW_SVG}</button>`
            : `<button class="btn btn-dark" id="introNext" type="button">Next${ARROW_SVG}</button>`}</div>
        </div>
      </section>`;
    const back = document.getElementById('introBack'); if(back) back.onclick = ()=>renderIntro(step-1);
    const next = document.getElementById('introNext'); if(next) next.onclick = ()=>renderIntro(step+1);
    const go = document.getElementById('introStart');
    if(go) go.onclick = ()=>{
      const CM = window.CallMode;
      if(CM && CM.setVoiceMode) CM.setVoiceMode(introVoice);
      logEvent({ type:'helper', helper:'mic_check', action: introVoice ? 'started call speaking' : 'started call tapping responses' });
      startCall();
    };
    bindIntroTools();
    if(isMic) bindMicStep();
    try{ app.scrollIntoView({block:'start'}); }catch(_){}
  }

  /* Intro Full screen toggle on step 1. It expands #app, so it carries into the call. */
  function toggleAppFullscreen(){
    if(document.fullscreenElement) document.exitFullscreen();
    else if(document.fullscreenEnabled) app.requestFullscreen().catch(()=>{});
  }
  function bindIntroTools(){
    const fs = document.getElementById('introFs');
    if(fs){
      if(!document.fullscreenEnabled) fs.style.display='none';
      else { fs.onclick = toggleAppFullscreen; syncFsButtons(); }
    }
  }
  /* Every Full screen button shows the real state: any fullscreen counts as on. */
  function syncFsButtons(){
    const on = !!document.fullscreenElement;
    [['introFs', null], ['fsBtn', 'fsIco']].forEach(([id, icoId])=>{
      const b = document.getElementById(id); if(!b) return;
      const ico = icoId ? document.getElementById(icoId) : b.querySelector('svg');
      if(ico){ if(icoId) ico.innerHTML = on ? MINIMIZE_SVG : MAXIMIZE_SVG; else ico.outerHTML = on ? MINIMIZE_SVG : MAXIMIZE_SVG; }
      const lbl = b.querySelector('.fs-label'); if(lbl) lbl.textContent = on ? 'Exit full screen' : 'Full screen';
      b.title = on ? 'Exit full screen' : 'Enter full screen';
      b.setAttribute('aria-label', b.title);
    });
  }
  document.addEventListener('fullscreenchange', ()=>syncFsButtons());

  function micEnv(){
    const CM = window.CallMode;
    const ok = !!(CM && CM.supported);
    let inFrame = false; try{ inFrame = window.self !== window.top; }catch(_){ inFrame = true; }
    // Inside a course page: always take the call in its own tab (the failsafe).
    // The call tab itself is a top-level page, so it runs the mic test normally.
    const framed = ok && inFrame && !IS_CALL_TAB;
    const canTab = framed && /^https?:$/.test(location.protocol);
    return { CM, ok, framed, canTab };
  }
  const RED = t => `<span style="color:#C81C0F;font-weight:700">${t}</span>`;
  function micStepMarkup(){
    const { ok, framed, canTab } = micEnv();
    return `
      <h1 class="display">Test your microphone</h1>
      <div class="mic-step">
        <p class="mc-lead" style="font-size:1rem">This is a call, so you'll say your spoken responses out loud. Put on your headset, then test your mic before you start.</p>
        <ul class="mc-notes">
          <li><b>Use Google Chrome or Microsoft Edge.</b> Speaking your responses only works in these browsers.</li>
          ${canTab ? `<li><b>The call opens in a new tab.</b> Click <b>Test your microphone</b> to open it. You'll test your mic there, then continue.</li>` : ''}
          <li><b>Allow microphone access.</b> When your browser asks to use your microphone, click <b>Allow</b>.</li>
          ${ok ? `<li><b>Your call is recorded only for your personal learning.</b> You can listen back to it on the results screen. We don't store recordings after the simulation is complete.</li>` : ''}
        </ul>
        ${!ok ? `<div class="voice-unsupported">This browser doesn't support speaking your responses. Switch to Chrome or Edge, or continue and tap your responses instead.</div>`
          : canTab ? `<p class="voice-status" id="mcStatus">Can't use a mic right now? Click <b>Continue without speaking</b> to tap your responses here instead.</p>`
          : framed ? `<p class="voice-status" id="mcStatus">${RED("Speaking isn't available inside this course page.")} Continue without speaking to tap your responses.</p>`
          : `<div class="voice-row mc-row">
          <button class="mic-btn" id="mcTest" type="button"><span class="mic-ico"></span>Test my mic</button>
          <div class="meter"><div class="meter-fill" id="mcFill"></div><div class="meter-mark" style="left:22%"></div></div>
        </div>
        <p class="voice-status" id="mcStatus">Click Test my mic, then say a sentence at your normal call volume.</p>`}
      </div>`;
  }
  function micStepActions(){
    const { ok, framed, canTab } = micEnv();
    return `${ok && !framed ? `<button class="btn btn-dark btn-wide" id="mcNext" type="button" disabled>Next${ARROW_SVG}</button>` : ''}
            ${canTab ? `<button class="btn btn-dark btn-wide" id="mcTab" type="button">Test your microphone</button>` : ''}
            <button class="btn btn-ghost btn-wide" id="mcSkip" type="button">Continue without speaking</button>`;
  }
  function bindMicStep(){
    const { CM, ok, framed, canTab } = micEnv();
    const stopCheck = ()=>{ if(introMicCheck){ introMicCheck.stop(); introMicCheck = null; } };
    const proceed = (voice, action)=>{ stopCheck(); introVoice = !!voice;
      logEvent({ type:'helper', helper:'mic_check', action:action }); renderIntro(MIC_STEP + 1); };
    document.getElementById('mcSkip').onclick = ()=>proceed(false, 'continued without speaking');
    if(canTab){
      document.getElementById('mcTab').onclick = ()=>{
        if(openCallTab()){
          logEvent({ type:'helper', helper:'mic_check', action:'opened the call in a new tab' });
          renderWaiting();
        } else {
          logEvent({ type:'helper', helper:'mic_check', action:'new tab was blocked' });
          document.getElementById('mcStatus').innerHTML = RED("The new tab was blocked.")
            + " Your browser or course stopped it from opening. Allow pop-ups for this course and try again, or continue without speaking to tap your responses here.";
        }
      };
    }
    if(!ok || framed) return;
    const testB = document.getElementById('mcTest'), nextB = document.getElementById('mcNext'), st = document.getElementById('mcStatus');
    nextB.onclick = ()=>proceed(true, 'passed mic check');
    testB.onclick = ()=>{
      if(introMicCheck) return;
      testB.disabled = true;
      st.textContent = 'Waiting for microphone access… click Allow if your browser asks.';
      const check = introMicCheck = CM.micCheck(document.getElementById('mcFill'), ()=>{
        st.innerHTML = '<span style="color:#3E8A00;font-weight:700">We can hear you.</span> Click Next to continue.';
        nextB.disabled = false;
      });
      check.ready.then(()=>{
        if(nextB.disabled) st.textContent = 'Listening… say a sentence at your normal call volume.';
      }).catch(err=>{
        if(introMicCheck === check) introMicCheck = null;
        testB.disabled = false;
        logEvent({ type:'helper', helper:'mic_check', action:'mic failed: ' + ((err && err.name) || 'Error') });
        CM.micErrorMessage(err).then(h=>{ st.innerHTML = h + ' You can also continue without speaking and tap your responses.'; });
      });
    };
  }

  /* =================== CALL TAB — take the call in a standalone tab ===================
     The embedded copy (inside Rise/Smart) opens this same page in a new tab with
     ?cdCallTab=1 and keeps a handle to it. The two talk by postMessage:
       new tab  -> course : {type:'cd-call-ready'}           "I've loaded"
       course   -> new tab: {type:'cd-call-details', ...}    name, email, attempt_id
       new tab  -> course : {type:'cd-relay', payload}       every Rise variable push
     Name and email travel by message, never in the URL. The course copy forwards
     each relayed variable to Rise exactly as if it had set it itself, so the
     activity_complete signal still reaches the course. If the tab loses its
     link back (no window.opener), it simply starts at the Meet screen and the
     learner can still take the call; only the completion relay is lost. */
  const IS_CALL_TAB = new URLSearchParams(location.search).get('cdCallTab') === '1';
  let callTabWin = null;
  const msgTarget = (location.origin && location.origin !== 'null') ? location.origin : '*';

  function openCallTab(){
    try{
      const url = new URL(location.href);
      url.searchParams.set('cdCallTab', '1');
      callTabWin = window.open(url.toString(), '_blank');
    } catch(e){ callTabWin = null; }
    return !!callTabWin;
  }

  // Course side: hand the details over, then forward whatever the tab relays.
  window.addEventListener('message', e=>{
    if(!callTabWin || e.source !== callTabWin || !e.data) return;
    if(e.data.type === 'cd-call-ready'){
      try{ callTabWin.postMessage({ type:'cd-call-details', name:learner_name, email:learner_email, attemptId:attemptId }, msgTarget); }catch(_){}
    } else if(e.data.type === 'cd-relay' && e.data.payload && e.data.payload.type === 'setVar'){
      const p = e.data.payload;
      if(p.name === 'learner_name') return;   // the course copy already set this itself
      pushRiseVar(p.name, p.value);
      if(p.name === 'activity_complete' && String(p.value) === 'true') markWaitingDone();
    }
  });

  function renderWaiting(){
    stopTimer();
    const portrait = U.image
      ? `<img src="${escapeHtml(U.image)}" alt="Portrait of ${escapeHtml(U.name)}" onerror="this.style.display='none'">` : '';
    app.innerHTML = `
      <section class="meet">
        <div class="portrait">${portrait}</div>
        <div class="body">
          <div class="eyebrow">Care Dojo · Call in progress</div>
          <h1 class="display" id="wtTitle">Your call is open in a new tab</h1>
          <p id="wtText">Take the call with ${escapeHtml(U.name)} in the new tab. When you click Finish on the results screen there, this activity is marked complete here.</p>
          <div class="actions" id="wtActions">
            <button class="btn btn-dark btn-wide" id="wtFocus" type="button">Go to the call tab</button>
            <button class="btn btn-ghost btn-wide" id="wtHere" type="button">Take this as a chat here instead</button>
          </div>
        </div>
      </section>`;
    document.getElementById('wtFocus').onclick = ()=>{
      if(callTabWin && !callTabWin.closed){ try{ callTabWin.focus(); }catch(_){} }
      else if(!openCallTab()){
        document.getElementById('wtText').textContent = "The new tab was blocked. Allow pop-ups for this course and try again, or take the call here instead.";
      }
    };
    document.getElementById('wtHere').onclick = ()=>{
      logEvent({ type:'helper', helper:'mic_check', action:'took it as a chat here instead of the new tab' });
      startCall();
    };
  }
  function markWaitingDone(){
    const t = document.getElementById('wtTitle'); if(!t) return;
    t.textContent = 'Call complete';
    document.getElementById('wtText').textContent = "You finished the call in the other tab, so this activity is marked complete. You can close that tab.";
    document.getElementById('wtActions').style.display = 'none';
  }

  // Tab side: ask the course copy for the learner's details; start at Meet if none arrive.
  function bootCallTab(){
    let settled = false;
    const fallback = ()=>{ if(settled) return; settled = true; renderMeet(); };
    window.addEventListener('message', e=>{
      if(settled || e.source !== window.opener || !e.data || e.data.type !== 'cd-call-details') return;
      settled = true;
      if(e.data.attemptId) attemptId = e.data.attemptId;     // keep one attempt across both copies
      setLearnerName(e.data.name); setLearnerEmail(e.data.email);
      // Start at the mic test (step 1), then the demo continues here. This tab is
      // a top-level page, so Chrome shows its normal Allow prompt.
      renderIntro(MIC_STEP);
    });
    try{ window.opener.postMessage({ type:'cd-call-ready' }, '*'); }catch(_){ fallback(); return; }
    setTimeout(fallback, 3000);
  }

  /* =================== PHASE 2 — THE LIVE CALL =================== */
  // Fullscreen toggle icons (recreated inline — no image files). A circle with
  // outward arrows = expand; inward arrows = collapse. Swapped on fullscreenchange.
  const MAXIMIZE_SVG = `<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="18" cy="18" r="17.4462" stroke="#000624" stroke-width="1.10769"/><path d="M16.5893 18.8569C16.7609 19.0286 16.78 19.2951 16.6465 19.4878L16.5893 19.5563L12.4873 23.6571H15.7451V24.6462H10.8V19.7011H11.7891V22.9569L15.8899 18.8569C16.0831 18.6638 16.3962 18.6638 16.5893 18.8569ZM24.6462 10.8V15.7451H23.6572V12.4873L19.5563 16.5892C19.3632 16.7823 19.0501 16.7823 18.857 16.5892C18.6639 16.3961 18.6639 16.083 18.857 15.8899L22.957 11.789H19.7011V10.8H24.6462Z" fill="#000624"/></svg>`;
  const MINIMIZE_SVG = `<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="18" cy="18" r="17.4462" stroke="#000624" stroke-width="1.10769"/><path d="M24.5012 11.6452C24.594 11.5523 24.6462 11.4264 24.6462 11.2951C24.6462 11.1638 24.594 11.0379 24.5012 10.945C24.4083 10.8522 24.2824 10.8 24.1511 10.8C24.0198 10.8 23.8939 10.8522 23.801 10.945L19.701 15.0461V11.7895H18.712V16.7342H23.6567V15.7452H20.4001L24.5012 11.6452ZM15.0461 19.7009H11.7896V18.712H16.7342V23.6566H15.7453V20.4001L11.6452 24.5012C11.5524 24.594 11.4264 24.6462 11.2951 24.6462C11.1638 24.6462 11.0379 24.594 10.9451 24.5012C10.8522 24.4083 10.8 24.2824 10.8 24.1511C10.8 24.0198 10.8522 23.8938 10.9451 23.801L15.0461 19.7009Z" fill="#000624"/></svg>`;
  function startCall(){
    const initial = (U.name||'?').trim().charAt(0).toUpperCase();
    app.innerHTML = `
      <div class="sim-wrap" id="simWrap">
      <div class="top-tools">

        <button class="fs-pill" id="fsBtn" type="button" title="Enter full screen" aria-label="Enter full screen"><span id="fsIco">${MAXIMIZE_SVG}</span><span class="fs-label">Full screen</span></button>
      </div>
      <section class="panel" id="sim">
        <div class="panel-head">
          <div class="avatar">${escapeHtml(initial)}</div>
          <div>
            <div class="who-name">${escapeHtml(U.name)}</div>
