server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;

    # Browse all scenarios from the repo root.
    autoindex on;
    autoindex_exact_size off;

    # Never cache, so edits appear on a plain refresh.
    add_header Cache-Control "no-store" always;
    etag off;
    if_modified_since off;

    # Show the START HERE guide above the file list on the home page only.
    location = / {
        add_before_body /_start_here;
        addition_types text/html;
    }
    location = /_start_here {
        internal;
        alias /usr/share/nginx/html/.base44/start-here.html;
    }

    # Back button on every other HTML page too (folder listings); .html files override this below.
    sub_filter '</body>' '<script src="/_b44_back_button.js"></script></body>';
    sub_filter '</head>' '<link rel="stylesheet" href="/_b44_theme.css"></head>';
    sub_filter_once on;
    sub_filter_types text/html;

    location = /_b44_theme.css {
        alias /usr/share/nginx/html/.base44/theme.css;
        default_type text/css;
    }

    # No favicon in the repo; answer quietly instead of logging a 404 in the browser.
    location = /favicon.ico { access_log off; return 204; }

    # Preview-only feedback tool (click an element, copy a note). Served from here, injected into pages below.
    location = /_b44_feedback.js {
        alias /usr/share/nginx/html/.base44/feedback.js;
        default_type application/javascript;
    }

    # Preview-only "Back to Home" button, injected into every scenario page below.
    location = /_b44_back_button.js {
        alias /usr/share/nginx/html/.base44/back-button.js;
        default_type application/javascript;
    }

    # Admin panel (password-protected) to choose which documents display on the home page.
    location = /_b44_admin {
        alias /usr/share/nginx/html/.base44/admin.html;
        default_type text/html;
    }

    # Document visibility store (see docs-server.js). Exact match wins over /_b44_api/ below.
    location = /_b44_api/documents {
        proxy_pass http://docs:8081;
    }

    # Comment storage API (see comments-server.js).
    location /_b44_api/ {
        proxy_pass http://comments:8080;
    }

    location ~ /\.(git|base44) { deny all; }

    # JSON folder listings, used by the home page to find every scenario .html without clicking through folders.
    location ^~ /_b44_tree/ {
        if ($uri ~ "/\.") { return 403; }
        alias /usr/share/nginx/html/;
        autoindex on;
        autoindex_format json;
    }

    # Add the feedback button to every scenario page; the .html files on disk are not modified.
    location ~* \.html$ {
        sub_filter '</body>' '<script src="/_b44_back_button.js"></script><script src="/_b44_feedback.js"></script></body>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
