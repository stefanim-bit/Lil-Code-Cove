server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;

    # Browse all scenarios from the repo root.
    autoindex on;
    autoindex_exact_size off;

    # Never cache, so edits appear on a plain refresh.
    add_header Cache-Control "no-store" always;
    etag off;
    if_modified_since off;

    # Show the START HERE guide above the file list on the home page only.
    location = / {
        add_before_body /_start_here;
        addition_types text/html;
    }
    location = /_start_here {
        internal;
        alias /usr/share/nginx/html/.base44/start-here.html;
    }

    # No favicon in the repo; answer quietly instead of logging a 404 in the browser.
    location = /favicon.ico { access_log off; return 204; }

    # Preview-only feedback tool (click an element, copy a note). Served from here, injected into pages below.
    location = /_b44_feedback.js {
        alias /usr/share/nginx/html/.base44/feedback.js;
        default_type application/javascript;
    }

    location ~ /\.(git|base44) { deny all; }

    # Add the feedback button to every scenario page; the .html files on disk are not modified.
    location ~* \.html$ {
        sub_filter '</body>' '<script src="/_b44_feedback.js"></script></body>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
