# Base44 sandbox preview: serves the repo's static HTML scenarios live from the bind-mounted source.
services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./.base44/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # The sandbox checkout root is mode 700, so nginx workers must run as root to read it.
    command: ["sh", "-ec", "sed -i 's/^user .*/user root;/' /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    restart: on-failure
    depends_on:
      comments:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Stores reviewer comments (JSON file in a named volume, so it survives restarts and is never committed).
  comments:
    image: node:22-alpine
    volumes:
      - ./.base44/comments-server.js:/app/server.js:ro
      - comments-data:/data
    command: ["node", "/app/server.js"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/_b44_api/comments || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

  # Document visibility store: only the admin (B44_ADMIN_PASSWORD) can change which documents
  # the public home page lists. Data lives in a named volume, never committed.
  docs:
    image: node:22-alpine
    env_file:
      - /run/base44/app.env
    volumes:
      - ./.base44/docs-server.js:/app/server.js:ro
      - docs-data:/data
    command: ["node", "/app/server.js"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/_b44_api/documents || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

volumes:
  comments-data:
  docs-data:
